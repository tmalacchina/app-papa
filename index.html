<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IA sur le terrain — Paco</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA terrain">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0f1726; --surface:#1b2740; --surface2:#223052; --txt:#eaf0fb; --muted:#9fb0cc;
  --line:#2c3c5e; --accent:#37a0e0; --gold:#f0c040; --teal2:#1D9E75; --red:#A32D2D; --amber:#BA7517;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1422,#14213a);color:var(--txt);line-height:1.5;margin:0;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700;cursor:pointer}
header h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.pill b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:18px 0 6px;font-size:15.5px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.gold{background:var(--gold);color:#1a1a1a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;margin:9px 0;font-size:14.5px;color:var(--txt);cursor:pointer;font-family:inherit;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:#16442f;border-color:var(--teal2)}
.opt.wrong{background:#4a1d1d;border-color:var(--red)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.expl{background:#11203a;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:14px;font-size:13.5px}
.expl.ok{border-left-color:var(--teal2)}
.expl.ko{border-left-color:var(--red)}
.bar{height:8px;background:#0c1322;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--accent));transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.18s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .ic{font-size:26px}
.mode b{display:block;margin-top:6px;font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.lvl:hover{border-color:var(--accent)}
.lvl.locked{opacity:.5;cursor:not-allowed}
.lvl .num{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lvl.done .num{background:linear-gradient(135deg,var(--teal2),var(--accent))}
.lvl .ti{flex:1}
.lvl .ti small{display:block;color:var(--muted);font-size:12.5px}
.connector{width:2px;height:14px;background:var(--line);margin-left:34px}
.lesson p{margin:0 0 12px;font-size:15px}
.lesson p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--muted);margin-right:6px}
.tag.done{background:#16442f;color:#8fe0bd}
textarea{width:100%;min-height:150px;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;line-height:1.5;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=url]{width:100%;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px}
.crit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit .mk{flex:none;width:22px;text-align:center}
.crit .aide{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.modele{white-space:pre-wrap;background:#0c1322;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0}
.step .tx{flex:1;font-size:14.5px}
.step .ar{display:flex;flex-direction:column;gap:4px}
.step .ar button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:7px;width:30px;height:24px;cursor:pointer;font-size:12px}
.step.ok{background:#16442f}
.step.ko{background:#4a1d1d}
.cls{background:var(--surface2);border-radius:12px;padding:12px;margin:8px 0}
.cls .tx{font-size:14.5px;margin-bottom:8px}
.cls .bk{display:flex;gap:6px;flex-wrap:wrap}
.cls .bk button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:inherit;font-size:13px}
.cls .bk button.sel{border-color:var(--accent);background:#11304a}
.cls.ok{background:#16442f}
.cls.ko{background:#4a1d1d}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp .rep{background:#0c1322;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;cursor:pointer;line-height:1.5}
.cmp .rep:hover{border-color:var(--accent)}
.cmp .rep b{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.cmp .rep.bad{border-color:var(--red);background:#2a1414}
.cmp .rep.good{border-color:var(--teal2);background:#12301f}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 22px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-size:17px}
.fc small{color:var(--muted);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c1322;border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.footer-note{margin-top:30px;font-size:12.5px;color:var(--muted);text-align:center}
.footer-note a{color:var(--accent);cursor:pointer;text-decoration:none}
.warn{background:#3a2a10;border:1px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.big{font-size:32px;font-weight:700;color:var(--gold)}
.next{background:#11203a;border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:14px;font-size:14px}
.next b{color:var(--gold)}
@media(max-width:560px){
  .wrap{padding:12px 12px 50px}
  .grid{grid-template-columns:1fr}
  .btn{flex:1 1 auto;justify-content:center}
  .opt{font-size:15px;padding:13px}
  .cmp{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home-link">IA sur le terrain <small>Parcours de Paco · 16 séances · 16 missions</small></h1>
    <div class="stats" id="stats"></div>
  </header>
  <div id="app"></div>
  <div class="footer-note">
    <span id="syncstatus">☁️ sync non configurée</span> ·
    <a id="exportlink">exporter</a> · <a id="importlink">importer</a> · <a id="cfglink">synchro</a>
    <input type="file" id="importfile" accept="application/json" style="display:none">
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== 1. DONNÉES — PACO ===================== */
const APP_NAME = "IA sur le terrain";
const USER_NAME = "Paco";

const CATS = {
  base:   { name:"Comment ça marche",     icon:"🧠" },
  cadre:  { name:"Cadre et données",      icon:"⚖️" },
  panneaux:{ name:"PannÔpropre",          icon:"☀️" },
  prospect:{ name:"Trouver des vendeurs", icon:"🔍" },
  produire:{ name:"Produire sans se faire avoir", icon:"📝" },
  vocab:  { name:"Vocabulaire",           icon:"🗣️" }
};

const PROG = [
/* ───────────── S1 ───────────── */
{ id:"s1", num:1, t:"Ce que l'IA fait vraiment", icon:"🧠", cat:"base", dur:"30 min",
  obj:"Comprendre pourquoi une IA peut te donner un prix d'appartement à Toulon avec assurance — et pourquoi ce prix est inventé.",
  lesson:[
    "Tu as répondu qu'une IA peut estimer un appartement si tu lui donnes l'adresse, et lister les biens en vente dans ta commune. Les deux sont faux, et comprendre pourquoi est la base de tout le reste.",
    "Une IA comme ChatGPT n'a pas une base de données des ventes de Toulon. Elle a appris, sur des milliards de textes, à prédire le mot suivant le plus probable. Quand tu lui demandes « combien vaut un T3 au Mourillon », elle <b>compose</b> une réponse qui ressemble à ce qu'un agent dirait — un prix plausible, un fourchette, un ton sûr. Le chiffre n'est relié à aucune vente réelle.",
    "Ça a un nom : <b>l'hallucination</b>. L'IA invente un prix, une loi, une référence, une adresse, avec exactement la même assurance que quand elle a raison. Ce n'est pas un bug qui arrive de temps en temps, c'est sa façon de fonctionner. Tu as écrit « je ne sais pas du tout » sur ce mot : après cette séance, c'est le mot que tu connais le mieux.",
    "Dans ton métier, une hallucination coûte cher. Une estimation inventée annoncée à un vendeur engage ta responsabilité. Une mention légale oubliée dans une annonce, c'est un litige. Un « article de loi » cité par l'IA qui n'existe pas, c'est toi qui es responsable devant le client — pas l'IA. Ton inquiétude « me faire avoir sur un défaut de ce qu'a fait l'IA » est exactement la bonne.",
    "La règle qui vaut pour les 15 séances suivantes : <b>tout ce qui est vérifiable doit être vérifié</b>. Un prix, une loi, une surface, une date, un nom de rue. Le reste — la structure d'un message, le ton, les idées, un plan de contenu — tu peux le prendre tel quel. L'IA est excellente pour la forme. Pour les faits, elle est une source de propositions à contrôler."
  ],
  prac:[
    { type:"compare", title:"Deux réponses, une dangereuse",
      intro:"Question posée : « Combien vaut un T3 de 65 m² au Mourillon à Toulon ? » Laquelle des deux réponses ne dois-tu jamais utiliser ?",
      a:"Un T3 de 65 m² au Mourillon se situe actuellement entre 285 000 et 320 000 €, soit environ 4 400 à 4 900 €/m², selon les dernières données notariales du 2e trimestre. Les biens avec vue mer ou terrasse dépassent 5 200 €/m².",
      b:"Je n'ai pas accès aux ventes réelles du quartier. Pour une estimation, il te faut les transactions récentes de biens comparables — la base DVF (data.gouv), les références notariales, et les outils de ton réseau. Si tu me donnes 5 ou 6 ventes comparables, je peux t'aider à structurer l'analyse.",
      bad:0,
      why:"La réponse A donne une fourchette précise, un prix au m², une source (« données notariales du 2e trimestre ») — et c'est exactement ce qui la rend dangereuse. Aucun de ces chiffres n'est relié à une vente réelle : ils sont plausibles, donc inventés avec talent. La B dit qu'elle ne sait pas et te renvoie vers les vraies sources. C'est la seule utilisable.",
      tells:["Un prix précis sans que tu aies fourni aucune vente","Une source nommée que tu ne peux pas ouvrir","Un ton de professionnel sûr de lui sur ton secteur"] },
    { type:"classify", title:"Je prends tel quel, ou je vérifie ?",
      intro:"Pour chaque réponse d'IA, dis si tu peux la prendre telle quelle ou si elle doit être vérifiée avant usage.",
      buckets:["Je prends tel quel","Je vérifie d'abord"],
      items:[
        {t:"Une reformulation plus chaleureuse de ton message à un propriétaire", a:0},
        {t:"« Le DPE est obligatoire dans l'annonce depuis 2011 »", a:1},
        {t:"Un plan de 4 posts Instagram pour lancer ton activité à Toulon", a:0},
        {t:"« La rue Jean-Jaurès est dans le quartier du Pont-du-Las »", a:1},
        {t:"« Ta commission IAD sur une vente à 300 000 € sera de 12 000 € »", a:1},
        {t:"Trois façons de tourner une relance sans être lourd", a:0},
        {t:"« Les panneaux sales perdent en moyenne 15 % de production »", a:1}
      ] },
    { type:"scenario", title:"Le réflexe",
      situation:"Tu prépares ton premier rendez-vous. Tu demandes à ChatGPT le prix moyen au m² à La Rode. Il répond « environ 3 900 €/m² ». Tu n'as fourni aucune donnée.",
      options:["Je note 3 900, ça a l'air cohérent.","Je lui demande sa source.","Je ne peux pas utiliser ce chiffre : il n'a aucune vente réelle. Je vais chercher les ventes DVF du quartier et je reviens avec."],
      a:2, e:"Sans données fournies, ce chiffre est une invention plausible. Lui demander « ta source » produira une source inventée aussi. Le seul geste correct : aller chercher les vraies ventes, puis revenir." }
  ],
  qids:[0,1,2,3]
},

/* ───────────── S2 ───────────── */
{ id:"s2", num:2, t:"Le prompt en quatre éléments", icon:"✍️", cat:"base", dur:"30 min",
  obj:"Passer de « fais-moi un business plan » à une demande qui donne un résultat utilisable du premier coup, sur ton secteur.",
  lesson:[
    "Tes business plans ont marché « si la demande n'est pas trop compliquée », et celui des barges flottantes a déçu parce que « mon cas est compliqué ». Ce n'est pas la complexité qui a fait la différence : c'est la quantité de contexte que tu avais donné. Un prompt qui marche contient quatre choses.",
    "<b>Le rôle</b> : qui doit être l'IA pour répondre. « Tu es un conseiller immobilier expérimenté sur Toulon et son agglomération, spécialisé dans la prise de mandats de particuliers. » Ça règle le vocabulaire, le niveau et le point de vue.",
    "<b>Le contexte</b> : ce que l'IA ne peut pas deviner. Ton secteur (Toulon, quels quartiers), ton statut (mandataire IAD débutant, démarrage en décembre), ton réseau, ce que tu as déjà essayé, ce qui te bloque. C'est la partie que tout le monde oublie et qui fait 80 % de la différence. Elle prend de la place. C'est normal.",
    "<b>Le format</b> : ce que tu veux recevoir. « Un message de 5 lignes. » « Un tableau : canal / effort / délai avant premier résultat. » « Trois versions, de la plus sobre à la plus directe. » Sans ça, tu reçois de la prose générique.",
    "<b>La contrainte</b> : ce qu'il ne faut pas faire. « N'invente aucun prix, aucune loi, aucune adresse — si tu en as besoin, écris [À VÉRIFIER]. » « Pas de superlatifs. » « Rien qui suppose du démarchage téléphonique. » La contrainte anti-invention va dans presque tous tes prompts pros. Tu corriges déjà toi-même quand ça ne va pas ; avec un prompt complet, tu corriges trois fois moins."
  ],
  prac:[
    { type:"order", title:"Reconstituer un bon prompt",
      intro:"Voici les morceaux d'un prompt pour préparer un message à un ami qui a mentionné vouloir vendre son appartement. Remets-les dans l'ordre : rôle, contexte, tâche, format, contrainte.",
      steps:[
        "Tu es conseiller immobilier indépendant, expérimenté dans la prise de contact avec des proches sans les mettre mal à l'aise.",
        "Contexte : je démarre comme mandataire IAD à Toulon en décembre. Un ami de mon réseau rugby a dit en soirée qu'il pensait vendre son T2 à Saint-Jean-du-Var. On se connaît bien, on n'a jamais parlé business.",
        "Rédige le message WhatsApp que je lui envoie.",
        "Format : 4 à 6 lignes, ton naturel, une seule question en fin de message.",
        "Contrainte : aucune promesse de prix ni de délai, pas de jargon immobilier, ne pas dire que je suis « expert »."
      ] },
    { type:"write", title:"Réécris une de tes vraies demandes",
      intro:"Prends une demande que tu as faite récemment (business plan, rentabilité, message) et réécris-la avec les quatre éléments, sur ton vrai contexte. Colle le prompt complet.",
      criteres:[
        { label:"Un rôle est donné", test:t=>/(tu es|agis (en tant que|comme)|en tant que|role ?:)/.test(t), aide:"Commence par « Tu es … » — un métier, un niveau, un point de vue." },
        { label:"Du contexte propre à ta situation (Toulon, IAD, PannÔpropre, ton réseau, tes chiffres)", test:t=>/(toulon|var|iad|mandataire|pann|panneau|matthieu|micro|decembre|mourillon|la garde|hyeres|la seyne|ollioules|six.fours|installateur|reseau)/.test(t) && t.length>180, aide:"Ce que l'IA ne peut pas deviner : où, quand, avec qui, ce qui s'est déjà passé. Plusieurs phrases." },
        { label:"Un format de sortie précis", test:t=>/(format|tableau|lignes? max|mots max|colonnes|liste|\d+ (points|options|lignes|mots|phrases|idees|versions|propositions)|sous forme de)/.test(t), aide:"« Un tableau à 3 colonnes », « 3 versions », « 5 lignes max »." },
        { label:"Une contrainte anti-invention ou une interdiction explicite", test:t=>/(n.invente|ne pas inventer|sans inventer|pose.moi (la|une|des) question|si (une information|il te) manque|a verifier|ne (fais|fait) pas|interdit|pas de |maximum|au plus)/.test(t), aide:"« N'invente aucun chiffre ni aucune loi ; écris [À VÉRIFIER] à la place. »" }
      ],
      modele:"Tu es un conseiller immobilier expérimenté sur Toulon et son agglomération, spécialisé dans la prospection sans démarchage téléphonique.\n\nContexte : je suis mandataire IAD, je démarre réellement le 3 décembre, en micro-entreprise. Mon secteur : Toulon, en priorité Mourillon, La Rode, Saint-Jean-du-Var, Le Pont-du-Las. Mon réseau : club de rugby, amis d'enfance, partenaires installateurs solaires (mon autre activité). Je n'ai encore aucun mandat. Je n'aime pas le téléphone, et depuis août 2026 le démarchage téléphonique des particuliers est de toute façon interdit sans consentement.\n\nTâche : propose-moi 5 canaux de prospection adaptés à ma situation, classés par rapidité de premier résultat.\n\nFormat : tableau à 4 colonnes — canal / première action concrète cette semaine / effort par semaine / délai avant un premier contact vendeur.\n\nContrainte : n'invente aucun chiffre de marché ni aucune règle légale ; écris [À VÉRIFIER] si tu en as besoin. Rien qui repose sur des appels à froid.",
      conseil:"Le contexte fait plus de la moitié du prompt. C'est le signe qu'il est bon." },
    { type:"scenario", title:"Il manque quoi ?",
      situation:"Prompt : « Fais-moi un plan pour trouver des clients pour le nettoyage de panneaux solaires. »",
      options:["Le rôle","Le contexte : Var, clients actuels, canal qui marche déjà (installateurs), ce que Matthieu et toi pouvez faire en temps","Le format","Les trois, mais le contexte est le trou le plus grave"],
      a:3, e:"Sans contexte, tu reçois le plan générique valable pour n'importe quel nettoyeur de panneaux en France. Rôle et format manquent aussi, mais c'est le contexte qui rend le plan vôtre." }
  ],
  qids:[4,5,6,7]
},

/* ───────────── S3 ───────────── */
{ id:"s3", num:3, t:"Ce qu'on vérifie, et où", icon:"🔎", cat:"base", dur:"30 min",
  obj:"Savoir en une seconde ce qui est vérifiable dans une réponse d'IA, et connaître les trois sources qui font foi dans ton métier.",
  lesson:[
    "Vérifier, ça ne veut pas dire tout relire avec méfiance. Ça veut dire repérer en une seconde les éléments <b>vérifiables</b> — et ne vérifier que ceux-là. Un chiffre, une date, une loi, un nom de rue, une surface, un pourcentage, une référence. Le reste (ton, structure, idées, plan) se prend tel quel.",
    "Trois sources qui font foi pour un mandataire. <b>Les prix</b> : la base DVF (Demandes de valeurs foncières), publique et gratuite sur data.gouv.fr — toutes les ventes réelles avec adresse, surface, prix. C'est là que tu construis tes comparables, pas dans l'IA. <b>Les règles</b> : ta formation IAD, le support du réseau, et Légifrance pour le texte exact. <b>Le terrain</b> : tes propres yeux. Une rue, un quartier, un immeuble.",
    "L'IA a une place dans la vérification : elle peut te <b>dire quoi vérifier</b>. « Liste tous les éléments factuels de ta réponse que je devrais contrôler, et où. » Elle est bonne à ça, parce que c'est de la structure, pas des faits. Elle peut aussi t'aider à lire une source une fois que tu l'as : « Voici 6 ventes DVF de la rue X, aide-moi à calculer un prix au m² médian. » Là, elle calcule sur tes données — et tu contrôles un calcul à la main.",
    "Un piège spécifique : les <b>lois</b>. L'IA cite volontiers « l'article L. xxx du Code de la construction » avec un numéro plausible. Une loi citée par l'IA vaut zéro tant que tu ne l'as pas lue sur Légifrance ou confirmée par IAD. Tu n'as pas à devenir juriste : tu dois savoir que <i>tu ne sais pas encore</i>, et poser la question au bon endroit.",
    "Le réflexe à installer : quand l'IA t'annonce quelque chose qui engage un client ou ta responsabilité, tu demandes « est-ce que tu es sûr, ou est-ce que c'est une estimation ? ». Elle répond honnêtement à cette question directe. Puis tu vérifies quand même."
  ],

    "<b>Le téléphone.</b> Depuis le 11 août 2026, appeler un particulier à des fins commerciales sans son consentement préalable est interdit — tous secteurs, immobilier compris. Appeler un propriétaire qui a publié une annonce sur Leboncoin, c'est fini : publier une annonce n'est pas un consentement. Un mandat signé après un appel non consenti peut être annulé. Tu as écrit que tu ferais la pige « mais sans aimer ça ». Bonne nouvelle : tu ne dois pas la faire. Ce qui reste autorisé : appeler quelqu'un qui t'a donné son accord explicite et traçable, appeler dans le cadre d'un contrat en cours, et prospecter des professionnels.",

{ id:"s5", num:5, t:"PannÔpropre — trouver des clients", icon:"☀️", cat:"panneaux", dur:"30 min",

    "Le geste 1, <b>cartographier</b> : demande à l'IA de t'aider à structurer une liste d'installateurs photovoltaïques dans le Var — Toulon, La Garde, La Valette, Hyères, La Seyne, Six-Fours, Ollioules, Le Pradet. Attention : l'IA ne connaît pas les vrais installateurs et va en inventer. Ce qu'elle fait bien, c'est te donner la <b>méthode</b> : où chercher (Google Maps, annuaire des installateurs RGE, Pages Jaunes, les camions que tu croises), quelles colonnes tenir (nom, ville, taille, contact, date du dernier échange, statut), et comment qualifier. La liste, c'est toi qui la remplis, avec des vraies entreprises.",

{ id:"s7", num:7, t:"PannÔpropre — devis et facture propres", icon:"🧾", cat:"panneaux", dur:"30 min",

{ id:"s16", num:16, t:"Ton système", icon:"⚙️", cat:"vocab", dur:"30 min",
  obj:"Assembler tout ça en une routine hebdomadaire tenable, avec tes projets, tes prompts, ta mesure — et savoir en parler à Matthieu.",
  lesson:[
    "Seize séances, seize missions. Ce qui reste maintenant, c'est un <b>système</b> : des outils rangés, une routine, et un chiffre pour savoir si ça marche.",
    "<b>Les projets ChatGPT</b> (menu de gauche, Nouveau projet) : un dossier avec instructions permanentes. Crée-en trois. « Prospection Toulon » : ton contexte, tes quartiers, tes règles (pas d'appel à froid, pas de chiffre de marché, vouvoiement avec les inconnus). « Contenu réseaux » : ton ton, ce que tu refuses, tes trois types de posts. « PannÔpropre » : la grille, le modèle de devis, le message installateur. Chaque conversation dans un projet démarre avec tout ça sans que tu le recolles.",
    "<b>prompts.txt</b> : un fichier sur ton Mac avec tes prompts qui marchent (l'écran Mes prompts de cette app te donne les modèles). Un prompt réutilisé ne se retape jamais. <b>Le mode vocal</b> : tu ne l'avais jamais essayé. Pour les notes après une visite, pour la simulation vendeur, pour dicter tes impressions de quartier en marchant — c'est là qu'il change tout.",
    "<b>La routine</b> : lundi, revue CRM (10 min). Dimanche, contenu (1 h). Chaque visite, note vocale immédiate puis structuration (5 min). Chaque nouveau contact, une ligne dans le fichier avec prochaine action. Tous les trois mois, fiches quartier mises à jour. Ça tient en 3 heures par semaine — tu en passais 7 à « chercher des prospects » sans système.",
    "<b>La mesure</b> : nombre de contacts avec consentement, nombre de rendez-vous d'estimation, nombre de mandats. Trois chiffres, une ligne par semaine dans un Sheet. Si après trois mois les contacts montent et les rendez-vous non, le problème est dans le message. Si les rendez-vous montent et les mandats non, il est dans le rendez-vous. Le chiffre te dit quelle séance refaire. Et <b>Matthieu</b> : les séances 5 à 8 tiennent en une soirée à deux. Montre-lui la grille et le message installateur ; c'est court, c'est ce qu'il a demandé."
  ],
  prac:[
    { type:"write", title:"Les instructions du projet « Prospection Toulon »",
      intro:"Rédige les instructions permanentes de ton projet principal. Pas d'exemples ici : les règles que l'IA doit toujours appliquer.",
      criteres:[
        { label:"Qui tu es, où, depuis quand", test:t=>/(mandataire|conseiller|iad)/.test(t) && /(toulon)/.test(t) && /(decembre|debut|demarr|nouveau|premier)/.test(t), aide:"« Je suis mandataire IAD à Toulon, en démarrage depuis décembre. »" },
        { label:"Tes quartiers", test:t=>(t.match(/(mourillon|la rode|saint.jean|pont.du.las|cap brun|la garde|le pradet|hyeres|la seyne|ollioules|centre)/g)||[]).length>=2, aide:"Au moins deux quartiers nommés." },
        { label:"Règle : aucun appel à froid, aucun démarchage sans consentement", test:t=>/(appel a froid|demarchage|consentement|pige)/.test(t) && /(jamais|aucun|pas de|interdit|sans)/.test(t), aide:"« Ne propose jamais d'appel à froid ni de pige téléphonique : interdit depuis août 2026. »" },
        { label:"Règle : aucun chiffre de marché, aucune loi sans [À VÉRIFIER]", test:t=>/(chiffre|prix|loi|regle|mention)/.test(t) && /(a verifier|n.invente|jamais|aucun|pas de)/.test(t), aide:"« N'avance aucun prix ni aucune règle légale ; écris [À VÉRIFIER]. »" },
        { label:"Ton et forme", test:t=>/(ton|vouvoie|tutoie|direct|simple|court|naturel)/.test(t), aide:"« Ton direct et simple, vouvoiement avec les inconnus, tutoiement avec mon cercle 1. »" },
        { label:"Tu relis et envoies toi-même", test:t=>/(brouillon|je relis|je valide|j.envoie moi|proposition)/.test(t), aide:"« Tu produis des brouillons ; je relis et j'envoie moi-même. »" }
      ],
      modele:"Tu m'aides à prospecter comme mandataire immobilier IAD à Toulon. Je démarre en décembre, micro-entreprise. Secteur : Mourillon, La Rode, Saint-Jean-du-Var, Pont-du-Las, et la couronne (La Garde, Le Pradet). J'ai aussi une activité de nettoyage de panneaux solaires (PannÔpropre) avec un associé.\n\nRègles permanentes :\n- Ne propose jamais d'appel à froid, de pige téléphonique ni de SMS non sollicité : interdit depuis août 2026 sans consentement préalable. Mes canaux : réseau perso, pros de terrain, prescripteurs, réseaux sociaux, courrier.\n- N'avance aucun prix, aucun chiffre de marché, aucune règle légale. Si tu en as besoin, écris [À VÉRIFIER]. Les prix viennent de mes ventes DVF, les règles de ma formation IAD.\n- Aucune mention sur le profil des occupants dans un texte lié à un bien.\n\nTon : direct, simple, phrases courtes. Vouvoiement avec les inconnus et les pros, tutoiement avec mon cercle proche. Pas de superlatif, pas d'« expert ».\n\nTu produis des brouillons. Je relis, je corrige, j'envoie moi-même.",
      conseil:"Ces instructions sont la synthèse des 15 séances. Si tu ne gardes qu'un fichier, c'est celui-là." },
    { type:"classify", title:"Où ça vit ?",

      buckets:["Projet ChatGPT","Fichier sur mon Mac / Drive","Nulle part dans une IA"],
      items:[

        {t:"Ma liste de contacts avec numéros et consentements", a:1},
        {t:"Ma grille tarifaire PannÔpropre", a:0},
        {t:"Le compromis d'un client avec son nom", a:2},
        {t:"Mes prompts qui marchent", a:1},
        {t:"Mes trois chiffres hebdomadaires", a:1},
        {t:"La pièce d'identité d'un vendeur", a:2},
        {t:"Mon ton et mes trois types de posts", a:0}
      ] },
    { type:"scenario", title:"Trois mois plus tard",
      situation:"Mars. Tes chiffres : 60 contacts avec consentement, 14 rendez-vous d'estimation, 1 mandat.",
      options:["Ça ne marche pas, je change de canal.","Les contacts et les rendez-vous sont là ; le problème est dans le rendez-vous. Je refais la séance 14, je simule dix fois, je demande à un mandataire expérimenté d'assister à un rendez-vous.","Je baisse mes prix."],
      a:1, e:"Les chiffres disent où ça coince : la conversion rendez-vous → mandat. Ce n'est ni le canal ni le prix, c'est ce qui se passe dans le salon du vendeur. C'est la séance à refaire." }
  ],

}

  modele:"Liste :\n1. [Entreprise] — La Garde — formulaire site\n2. [Entreprise] — Hyères — mail\n3. [Entreprise] — Toulon — tel\n4. [Entreprise] — La Seyne — LinkedIn\n5. [Entreprise] — Six-Fours — mail\n6. [Entreprise] — Ollioules — formulaire\n7. [Entreprise] — Le Pradet — tel\n8. [Entreprise] — La Valette — mail\n9. [Entreprise] — Sanary — Facebook\n10. [Entreprise] — La Crau — mail\n\nMessage envoyé (mardi 7/10 aux n° 1, 2 et 5) :\n« Bonjour, je suis Paco, de PannÔpropre — nettoyage de panneaux solaires sur Toulon et le Var, à deux. Vos clients vous rappellent sans doute quand leur production baisse, et ce n'est pas votre métier de monter sur les toits pour ça. Nous pouvons être la réponse que vous leur donnez : intervention sur leur créneau, photos avant/après envoyées après chaque chantier. Un installateur du secteur nous recommande déjà. Auriez-vous 10 minutes cette semaine pour en parler ? »",

  modele:"Description publiée : « PannÔpropre — nettoyage de panneaux solaires à Toulon et dans le Var. Particuliers, entreprises, collectivités. Deux associés, intervention sur votre créneau, photos avant/après après chaque chantier. Recommandés par des installateurs du secteur. Devis gratuit sous 48 h : envoyez une photo de votre toit et le nombre de panneaux. »\n\nCatégorie : service de nettoyage. Zone : Toulon et 40 km (La Garde, Hyères, La Seyne, Ollioules, Six-Fours).\n8 photos ajoutées : 3 avant/après, 2 matériel, 2 chantier hangar, 1 nous deux.\n\nPremier post : « Chantier de la semaine à La Garde : 32 panneaux sur toiture, pollen et poussière de l'été. Avant / après sur les photos. Un nettoyage annuel avant la saison, c'est le bon moment. Devis gratuit en message. »",

  modele:"Grille (basée sur 5 chantiers : 18, 24, 32, 40 et 60 panneaux) :\n- Forfait déplacement : 40 € jusqu'à 20 km, 60 € au-delà\n- Par panneau : plain-pied 5 €, toiture accessible 6 €, toiture difficile/hauteur 8 €\n- Minimum de facturation : 120 €\n- Majorations : salissure lourde +20 %, nacelle sur devis, urgence sous 48 h +30 €\n- Dégressif : −10 % au-delà de 50 panneaux\n\nModèle de devis, mentions présentes : PannÔpropre, SIREN, adresse, « TVA non applicable, art. 293 B du CGI », date, validité 30 jours, désignation détaillée (nombre de panneaux, niveau, majorations), prix unitaires et total, conditions de paiement (30 jours, virement), mention « bon pour accord » et signature.\n\nÀ faire vérifier par un comptable avant le premier client entreprise.",

s8:{ title:"Un client, ses chiffres, ta fiche",
  intro:"Chez un vrai client (ou un proche équipé), récupère deux mois comparables de production sur son appli. Fais calculer la perte, contrôle une étape à la main. Colle la fiche client obtenue et ton contrôle.",
  criteres:[
    { label:"Deux valeurs de production comparables en kWh", test:t=>(t.match(/\d+ ?kwh/g)||[]).length>=2, aide:"« Mai 2024 : 610 kWh. Mai 2026 : 545 kWh. »" },
    { label:"La puissance et la valeur du kWh", test:t=>/(kwc)/.test(t) && /(0[.,]\d+ ?€|€\/kwh)/.test(t), aide:"« 6 kWc, 0,18 €/kWh. »" },
    { label:"La perte en euros et une projection annuelle prudente", test:t=>/(perte|perd)/.test(t) && /(\d+([.,]\d+)? ?€)/.test(t) && /(an|annuel|annee)/.test(t), aide:"Perte du mois en €, et projection sur l'année." },
    { label:"Ton contrôle à la main d'une étape", test:t=>/(main|manuel|verif|controle|recalcul)/.test(t) && /(ok|identique|meme|juste|ecart)/.test(t), aide:"« 610 − 545 = 65 kWh × 0,18 = 11,70 € — identique. »" },
    { label:"Comparaison avec le prix du nettoyage", test:t=>/(nettoyage|prix|devis|cout)/.test(t) && /(rentab|amorti|couvre|par rapport|contre|vs|face)/.test(t), aide:"« Perte annuelle estimée X € contre un nettoyage à Y €. »" }
  ],
  modele:"Client : maison à La Garde, 6 kWc, 16 panneaux. Appli SolarEdge.\nMai 2024 (installation neuve) : 610 kWh. Mai 2026 : 545 kWh. Valeur du kWh (autoconsommation) : 0,18 €.\n\nFiche IA : perte de 65 kWh sur le mois, soit 11,70 €. Projection annuelle prudente (hiver moins productif, hypothèse basse 70 % de l'écart de mai) : environ 95 €/an.\n\nContrôle à la main : 610 − 545 = 65 ; 65 × 0,18 = 11,70 € — identique.\n\nComparaison : perte annuelle estimée ~95 € contre un nettoyage à 136 € (16 × 6 + 40). Rentabilisé en moins d'un an et demi, sans compter la durée de vie de l'installation.",
  conseil:"Note aussi la production le mois suivant le nettoyage : c'est la preuve avant/après que tu montreras aux suivants." },

s9:{ title:"Ta première fiche quartier",
  intro:"Choisis un quartier de Toulon. Extrais 10 à 15 ventes DVF, fais calculer le prix au m² médian (contrôle une ligne), marche une heure, dicte tes impressions. Colle la fiche de 10 lignes datée.",
  criteres:[
    { label:"Le quartier et la date", test:t=>/(mourillon|la rode|saint.jean|pont.du.las|cap brun|centre|haute.ville|sainte.anne|siblas|valbertrand|les routes|bon.rencontre|escaillon|la garde|le pradet)/.test(t) && /(20\d\d|\d{1,2}\/\d{1,2})/.test(t), aide:"Nom du quartier et date de la fiche." },
    { label:"Prix au m² médian issu de DVF, avec le nombre de ventes", test:t=>/(dvf)/.test(t) && /(\d{1,2} ventes)/.test(t) && /(m2|m²)/.test(t) && /(median|mediane)/.test(t), aide:"« 12 ventes DVF, médiane X €/m². »" },
    { label:"Un contrôle à la main d'une vente", test:t=>/(controle|verif|main|recalcul)/.test(t) && /\d{3} ?\d{3}/.test(t), aide:"« Contrôle : 244 000 / 61 = 4 000 — OK. »" },
    { label:"Des impressions de terrain (bâti, rues, commerces, stationnement)", test:t=>(t.match(/(rue|immeuble|bati|commerce|ecole|parking|stationnement|bruit|calme|marche|vue|mer|plage|bus|tram)/g)||[]).length>=4, aide:"Ce que tu as vu en marchant : au moins quatre observations concrètes." },
    { label:"Ce qui fait monter et ce qui fait baisser", test:t=>/(monte|hausse|valoris|plus cher)/.test(t) && /(baisse|moins cher|devalor|penalis)/.test(t), aide:"Deux lignes : « fait monter : … / fait baisser : … »" }
  ],
  modele:"Fiche quartier — La Rode, Toulon — 12/10/2026\n\nBâti : copropriétés années 60-80, quelques petits collectifs récents, peu de maisons.\nPrix : 12 ventes DVF (18 derniers mois), médiane [X] €/m², fourchette [Y]–[Z]. Contrôle : [adresse] 244 000 / 61 = 4 000 €/m² — OK.\nQui achète : familles, primo-accédants, quelques investisseurs.\nFait monter : ascenseur, balcon exposé sud, parking, proximité école et tram.\nFait baisser : rez-de-chaussée sur rue, copropriété visiblement non entretenue, absence de parking.\nRues repères : [rue], [rue].\nCommerces : supermarché, boulangeries, marché le [jour].\nStationnement : difficile le soir.\nVu sur place : plusieurs façades rénovées récemment côté [rue], chantier en cours [adresse].\nÀ mettre à jour : janvier 2027.",
  conseil:"Une fiche par quartier prioritaire d'ici décembre. Quatre fiches = tu connais ton secteur mieux que la plupart des débutants." },

s10:{ title:"Vingt contacts, cinq messages",
  intro:"Liste 20 contacts de ton cercle 1 et 2 (prénoms + contexte, sans numéros). Fais personnaliser, envoie 5 messages. Colle la liste, un des messages envoyés, et les réponses reçues à ce jour.",
  criteres:[
    { label:"Vingt contacts avec cercle et contexte", test:t=>(t.match(/(cercle ?[12]|c[12]\b)/g)||[]).length>=10 || (t.match(/^\s*(\d{1,2}[.)]|[-•])/gm)||[]).length>=15, aide:"Une ligne par contact : prénom — cercle — un mot de contexte." },
    { label:"Aucun numéro de téléphone dans le texte", test:t=>!/(0[67]\s?(\d{2}\s?){4}|\+33)/.test(t), aide:"Les numéros restent dans ton téléphone." },
    { label:"Un message envoyé, personnalisé", test:t=>/(immobilier|immo|iad|decembre)/.test(t) && /(pense a moi|si tu (entends|connais)|quelqu.un)/.test(t) && t.length>400, aide:"Le texte réel d'un des cinq messages." },
    { label:"Cinq envois et les réponses reçues (même « aucune »)", test:t=>/(envoye|envoyé)/.test(t) && /(reponse|repondu|aucune|retour)/.test(t), aide:"« 5 envoyés, 2 réponses : … »" }
  ],
  modele:"Contacts :\n1. Julien — cercle 1 — rugby, vient d'avoir un bébé\n2. Sarah — cercle 1 — amie d'enfance, La Garde\n3. Marc — cercle 2 — installateur, La Seyne\n4. Nadia — cercle 1 — cousine, Hyères\n5. Le Bar des Sports — cercle 2 — gérant, après-match\n6. Thomas — cercle 1 — cousin\n7. Karim — cercle 1 — rugby, cherche à acheter\n8. Mme Rossi — cercle 2 — gardienne de la résidence de mes parents\n9. Élodie — cercle 1 — collègue de Matthieu\n10. Coiffeur du Mourillon — cercle 2 — voit passer les déménagements\n… (jusqu'à 20)\n\nMessage envoyé à Julien : « Salut Julien ! Félicitations encore pour la petite. Petite nouvelle de mon côté : je démarre dans l'immobilier à Toulon en décembre avec IAD. Si tu entends parler de quelqu'un qui pense vendre ou acheter, pense à moi — avis de valeur gratuit avec les vraies ventes de la rue, sans engagement. On se voit samedi ? »\n\n5 envoyés le 14/10. Réponses : Julien (« carrément, mon beau-frère vend à La Valette »), Sarah (« ok je note »). Trois sans réponse, relance prévue le 21/10.",
  conseil:"Le beau-frère de Julien : nouvelle ligne dans le CRM, consentement à obtenir via Julien avant tout appel." },

s11:{ title:"Cinq posts publiés",
  intro:"Génère ton calendrier de 4 semaines, tourne tes 3 premières vidéos et fais 2 photos le dimanche, publie 5 posts sur la semaine. Colle : les 5 sujets publiés avec leur type, le script d'une vidéo tel que tu l'as dit, et ce que ça t'a pris.",
  criteres:[
    { label:"Cinq posts avec leur type (quartier / conseil / coulisses)", test:t=>(t.match(/(quartier|conseil|coulisse)/g)||[]).length>=5, aide:"Cinq lignes : sujet — type." },
    { label:"Le script d'une vidéo, dans tes mots", test:t=>/(script|video|vidéo)/.test(t) && t.length>500, aide:"Le texte réellement dit, pas celui de l'IA tel quel." },
    { label:"Aucun prix ni chiffre de marché dans les posts", test:t=>!/(\d{3} ?\d{3} ?€|€\/m2|€\/m²|\d+ ?% de (hausse|baisse))/.test(t), aide:"Retire tout prix ou chiffre de marché des posts." },
    { label:"Le temps que ça a pris", test:t=>/(\d+ ?(h|min|minutes?|heures?))/.test(t), aide:"« Tournage 50 min, montage 0, programmation 15 min. »" }
  ],
  modele:"Publiés cette semaine :\n1. « Le marché du Mourillon un samedi matin » — quartier (vidéo 35 s)\n2. « Faut-il refaire la cuisine avant de vendre ? » — conseil (vidéo 40 s)\n3. « 6h du matin sur un toit à La Garde avec Matthieu » — coulisses (photo)\n4. « La rue de Belgique, entre centre et port » — quartier (photo)\n5. « Ce que j'ai appris cette semaine en formation IAD » — coulisses (vidéo 45 s)\n\nScript vidéo 2, tel que dit : « On me demande souvent s'il faut refaire la cuisine avant de vendre. Ma réponse : ça dépend de ce qu'elle a. Une cuisine propre, qui fonctionne, avec un bon éclairage, se vend. Une cuisine neuve à 15 000 € ne se retrouve presque jamais dans le prix. Ce qui compte, c'est que l'acheteur se projette, pas qu'il soit impressionné. Si vous hésitez, envoyez-moi une photo, je vous dis ce que j'en pense. »\n\nTemps : tournage dimanche 50 min pour 3 vidéos, sous-titres auto, programmation 15 min. Zéro montage.",
  conseil:"Le script 2 contient un chiffre (15 000 €) : c'est un exemple, pas un chiffre de marché, mais garde l'œil dessus. Dans le doute, « une cuisine neuve chère »." },

    { label:"Où le fichier vit", test:t=>/(drive|sheet|iad|outil|fichier|excel|numbers)/.test(t) && /(mac|drive|cloud|iad|espace)/.test(t), aide:"« Google Sheet dans mon Drive » ou « outil IAD »." }

  modele:"Fichier : Google Sheet « CRM Paco » dans mon Drive (en attendant l'outil IAD).\nColonnes : prénom / nom / cercle / canal d'origine / date premier contact / consentement (oui-non, date, preuve) / statut / prochaine action / date prochaine action / notes.\n23 contacts.\n\nExemples :\n- Julien — C1 — rugby — 14/10 — consentement oui (a répondu « carrément », WhatsApp 14/10) — vendeur potentiel indirect (beau-frère) — demander une mise en relation — 21/10\n- Marc — C2 — installateur La Seyne — 7/10 — oui (mail 9/10 : « rappelez-moi ») — partenaire en cours — appel — 16/10\n- Sarah — C1 — amie d'enfance — 14/10 — non (pas encore demandé) — contactée — relance douce — 28/10",

s13:{ title:"Une annonce contrôlée par ta checklist",
  intro:"Obtiens auprès de IAD (formation, support, e-learning) la checklist des mentions obligatoires. Fais rédiger une annonce pour un bien fictif ou un bien réel anonymisé, puis contrôle chaque fait et chaque mention. Colle l'annonce finale et ta checklist cochée.",
  criteres:[
    { label:"L'annonce complète (titre, description, atouts, mentions)", test:t=>/(titre)/.test(t) && /(mention)/.test(t) && t.length>700, aide:"L'annonce telle que tu la publierais." },
    { label:"La checklist avec au moins 5 points cochés", test:t=>(t.match(/(\[x\]|✅|✓|ok\b|coche)/g)||[]).length>=5, aide:"Chaque mention obligatoire : présente ✓ ou manquante ✗." },
    { label:"La source de la checklist", test:t=>/(iad|formation|support|e.learning|atelier|formateur)/.test(t) && /(checklist|liste)/.test(t), aide:"« Checklist issue de l'atelier IAD du … » ou « du support »." },
    { label:"Aucune formulation visant un profil d'occupants", test:t=>!/(ideal pour (un|une|des) (jeune|couple|famille|retraite|personne seule|etudiant)|convient a (un|une) (couple|famille|personne seule|retraite)|sans (enfant|colocation|jeune))/.test(t), aide:"Relis : rien sur qui devrait y habiter." },
    { label:"Une correction que tu as faite sur le texte de l'IA", test:t=>/(corrig|supprim|retire|remplac|modifi|elle avait|l.ia avait)/.test(t), aide:"« L'IA avait écrit « à 3 minutes de la plage », remplacé par « à proximité ». »" }
  ],
  modele:"Annonce :\nTitre : T3 lumineux avec balcon sud — Saint-Jean-du-Var\nAccroche : Un trois-pièces au 3e étage avec ascenseur, exposé plein sud.\nDescription : Dans une copropriété de 42 lots, cet appartement de 64 m² se compose d'un séjour avec cuisine ouverte rénovée et parquet, de deux chambres, d'une salle d'eau et de WC séparés. Balcon de 6 m² exposé sud. Cave. À proximité d'une école et de commerces. DPE : D.\nAtouts : ascenseur, exposition sud, cuisine rénovée, cave, secteur commerçant.\nMentions : [complétées d'après la checklist IAD : prix, honoraires, DPE et GES, surface, copropriété — lots, charges annuelles, procédures]\n\nChecklist (atelier IAD du 20/10) :\n[x] prix et charge des honoraires\n[x] classes énergie et GES\n[x] surface\n[x] nombre de lots\n[x] charges annuelles\n[x] mention procédures en cours (aucune)\n[x] aucune formulation sur les occupants\n\nCorrection : l'IA avait écrit « à 5 minutes des commerces », remplacé par « à proximité ». Elle avait aussi écrit « parfait pour une première acquisition » — retiré.",
  conseil:"Garde cette checklist dans ton fichier Règles. Elle sert pour chaque annonce jusqu'à ce que IAD la mette à jour." },

s14:{ title:"Cinq simulations, un débrief",
  intro:"Fais cinq simulations de rendez-vous avec cinq profils de vendeurs différents (méfiant, pressé, en deuil, investisseur, déjà passé par une autre agence), au moins une en vocal. Colle : les cinq profils, le débrief de la plus difficile, et la phrase que tu as apprise à dire.",
  criteres:[
    { label:"Cinq profils de vendeurs", test:t=>(t.match(/(mefiant|presse|deuil|investisseur|autre agence|herit|sceptique|attache|divorce|mutation|militaire)/g)||[]).length>=5, aide:"Cinq profils différents, nommés." },
    { label:"Au moins une en mode vocal", test:t=>/(vocal|voix|oral|micro)/.test(t), aide:"« La 3e en vocal. »" },
    { label:"Le débrief de l'IA hors rôle (ce qui a marché, ce qui a fait douter)", test:t=>/(debrief|hors role|sorti du role)/.test(t) && /(douter|bien fait|faible|manque|hesit)/.test(t), aide:"« Ce qui t'aurait fait douter de moi : … »" },
    { label:"La phrase apprise", test:t=>/(phrase|j.ai appris|je dis maintenant|je dirai)/.test(t) && /«|"/.test(t), aide:"Entre guillemets, la phrase que tu réutiliseras." }
  ],
  modele:"Profils : 1) 58 ans, La Rode, T4 hérité, méfiant, autre agence jugée arrogante — 2) 35 ans, mutation militaire, pressé, Le Pont-du-Las — 3) veuve, maison au Pradet, en deuil (en vocal) — 4) investisseur avec 3 studios au centre, veut des chiffres — 5) couple qui a déjà signé un mandat simple ailleurs.\n\nLa plus difficile : la 3, en vocal. Débrief hors rôle : « Tu as bien fait d'écouter avant de parler prix. Ce qui m'aurait fait douter : tu as sorti tes ventes comparables trop tôt, comme si tu voulais conclure. La phrase que tu aurais dû dire : « On n'est pas obligés de parler chiffres aujourd'hui. » »\n\nPhrase apprise : « Je vous laisse mon avis de valeur écrit sous 48 h, avec les ventes réelles de la rue — et vous décidez, à votre rythme. »",
  conseil:"Refais la 3 dans une semaine. Si elle passe, tu es prêt pour décembre." },

s15:{ title:"Un document expliqué, dix mots",
  intro:"Prends un DPE ou un PV d'AG (document de formation IAD, ou un DPE public trouvé sur une annonce en ligne). Fais-le expliquer avec la structure de la séance. Colle : les 5 informations clés, ce qui devrait alerter, les questions pour un pro, et 10 mots de vocabulaire avec définition.",
  criteres:[
    { label:"Le type de document et sa source (anonymisé ou public)", test:t=>/(dpe|pv|assemblee|compromis|reglement)/.test(t) && /(public|annonce|formation|iad|anonym|masque|exemple)/.test(t), aide:"« DPE public d'une annonce à Hyères » ou « PV d'AG du support IAD »." },
    { label:"Cinq informations clés", test:t=>(t.match(/^\s*(\d[.)]|[-•])/gm)||[]).length>=5, aide:"Cinq points numérotés." },
    { label:"Ce qui devrait alerter, en citant le passage", test:t=>/(alert|attention|vigilan|point chaud)/.test(t) && /«|"/.test(t), aide:"« Alerte : « … » page 3. »" },
    { label:"Des questions pour un pro (notaire, diagnostiqueur, IAD)", test:t=>/(question)/.test(t) && /(notaire|diagnostiqueur|iad|syndic|juriste)/.test(t) && (t.match(/\?/g)||[]).length>=2, aide:"Deux questions minimum, avec le destinataire." },
    { label:"Dix mots avec définition", test:t=>(t.match(/(\s[-–:]\s|\s:\s)/g)||[]).length>=10 && /(vocabulaire|mots|definition)/.test(t), aide:"Dix lignes « mot : définition en une phrase »." }
  ],
  modele:"Document : DPE public d'un T3 à Hyères (annonce en ligne), noms masqués.\n\n5 infos clés :\n1. Classe énergie E, classe GES D\n2. Consommation estimée en kWh/m²/an et fourchette de coût annuel\n3. Chauffage électrique, isolation des murs jugée insuffisante\n4. Recommandations de travaux avec estimation de gain de classe\n5. Date de validité du diagnostic\n\nAlerte : « logement classé E — sera concerné par l'interdiction de location à partir de … » (page 2) : à vérifier, ça change le discours vendeur/acheteur investisseur.\n\nQuestions : au diagnostiqueur — quelles hypothèses pour la consommation estimée ? À IAD — comment présenter un E dans l'annonce et en visite sans minimiser ni dramatiser ?\n\nVocabulaire :\n- Classe énergie : lettre de A à G selon la consommation\n- GES : émissions de gaz à effet de serre, deuxième étiquette\n- kWh/m²/an : unité de la consommation estimée\n- Passoire thermique : logement F ou G\n- DPE opposable : engage le vendeur depuis 2021\n- Audit énergétique : document plus complet, exigé dans certains cas\n- Isolation : murs, toiture, planchers, menuiseries\n- Recommandations : travaux suggérés avec gain estimé\n- Validité : durée pendant laquelle le DPE peut être utilisé\n- ECS : eau chaude sanitaire",
  conseil:"Ce vocabulaire va dans ton fichier Règles, section DPE. Un document par semaine jusqu'en décembre : compromis, PV d'AG, règlement de copropriété, diagnostic amiante." },

  conseil:"Le Sheet de mesure est ce que tu regarderas en mars pour savoir quelle séance refaire. Tiens-le même quand c'est zéro." }

/* ===================== 2. ÉTAT ===================== */
const KEY = "iabureau_paco_v1";
const SYNC_KEY = "iabureau_sync_cfg";
const SYNC_USER = "paco";
const DEF = { xp:0, streak:0, lastDay:null, catScore:{}, chaptersDone:[], boxes:{}, examBest:0, badges:[], days:{}, ex:{}, drafts:{}, updatedAt:0 };
let S = load(); let storageOK = true;
function load(){ try{ return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){ storageOK=false; return Object.assign({},DEF); } }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK=true; }catch(e){ storageOK=false; } schedulePush(); }
function probeStorage(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storageOK=true; }catch(e){ storageOK=false; } }
function level(){ return Math.floor(S.xp/100)+1; }
function addXP(n){ S.xp+=n; save(); syncHeader(); }
function award(b){ if(!S.badges.includes(b)){ S.badges.push(b); save(); toast("🏅 "+b); } }
function touchStreak(){ const t=new Date().toDateString(); if(S.lastDay!==t){ const y=new Date(Date.now()-864e5).toDateString(); S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=t; saveLocal(); } }
function exDone(id){ return !!(S.ex&&S.ex[id]); }
function markEx(id){ if(!S.ex) S.ex={}; if(!S.ex[id]){ S.ex[id]=true; save(); addXP(15); toast("✅ Cas pratique validé · +15 XP"); } }

/* utilitaires */
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`´]/g,"'");
const shuffled=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
function go(v,...a){ window.scrollTo(0,0); v(...a); }
function syncHeader(){
  const done=Object.keys(S.days).length;
  document.getElementById("stats").innerHTML=
    `<span class="pill">Niveau <b>${level()}</b></span><span class="pill"><b>${S.xp}</b> XP</span><span class="pill">🔥 <b>${S.streak}</b></span><span class="pill">📅 <b>${done}</b>/${PROG.length}</span>`;
}
function setSyncStatus(t){ document.getElementById("syncstatus").textContent=t; }

/* ===================== 3. VUES ===================== */
function home(){
  const done=Object.keys(S.days).length;
  const nxt=PROG.find(p=>!S.days[p.id]);
  let h="";
  if(!storageOK) h+=`<div class="warn">⚠️ Le navigateur bloque la sauvegarde. Ta progression sera perdue en fermant l'onglet. Ouvre l'app depuis l'adresse en ligne, ou exporte régulièrement.</div>`;
  h+=`<div class="card"><h2>${nxt?`Prochaine séance : ${nxt.num}. ${esc(nxt.t)}`:"Parcours terminé"}</h2>
    <p class="muted" style="margin:0 0 12px">${nxt?esc(nxt.obj):"Les "+PROG.length+" séances sont validées. Continue à utiliser Mes prompts."}</p>
    <div class="bar"><i style="width:${Math.round(done/PROG.length*100)}%"></i></div>
    <div class="row">${nxt?`<button class="btn" id="go-next">${nxt.icon} ${S.ex[nxt.id+"-0"]||S.ex[nxt.id+"-m"]?"Reprendre":"Commencer"} · ${nxt.dur}</button>`:""}<button class="btn ghost" id="go-prog">Toutes les séances</button></div></div>`;
  h+=`<div class="grid">
    <div class="mode" id="m-prog"><div class="ic">📅</div><b>Programme</b><span>${PROG.length} séances de 30 min, dans l'ordre, à ton rythme.</span></div>
    <div class="mode" id="m-quiz"><div class="ic">🎯</div><b>Quiz par thème</b><span>Vérifier ce qui est retenu, thème par thème.</span></div>
    <div class="mode" id="m-cards"><div class="ic">🃏</div><b>Flashcards</b><span>12 mots à tenir. Les faibles reviennent d'abord.</span></div>
    <div class="mode" id="m-fiches"><div class="ic">📖</div><b>Fiches</b><span>Tout le contenu, à relire d'une traite.</span></div>
    <div class="mode" id="m-missions"><div class="ic">🛠️</div><b>Missions terrain</b><span>Le vrai travail, sur tes vrais dossiers. ${Object.keys(S.ex).filter(k=>k.endsWith("-m")).length}/${PROG.length} faites.</span></div>
    <div class="mode" id="m-prompts"><div class="ic">📋</div><b>Mes prompts</b><span>Les modèles à copier dans prompts.txt.</span></div>
  </div>`;
  if(S.badges.length) h+=`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Badges</h3>${S.badges.map(b=>`<span class="tag done">🏅 ${esc(b)}</span>`).join(" ")}</div>`;
  app.innerHTML=h;
  if(nxt) document.getElementById("go-next").onclick=()=>go(session,nxt.id);
  document.getElementById("go-prog").onclick=()=>go(program);
  document.getElementById("m-prog").onclick=()=>go(program);
  document.getElementById("m-quiz").onclick=()=>go(quizMenu);
  document.getElementById("m-cards").onclick=()=>go(cards);
  document.getElementById("m-fiches").onclick=()=>go(fiches);
  document.getElementById("m-missions").onclick=()=>go(missions);
  document.getElementById("m-prompts").onclick=()=>go(prompts);
}

function program(){
  let h=`<div class="card"><h2>Le programme</h2><p class="muted small" style="margin:0">Une séance = une notion, un geste dans ton outil, un résultat analysé ici, une mission sur le terrain. Les séances se débloquent dans l'ordre.</p></div>`;
  PROG.forEach((p,i)=>{
    const done=!!S.days[p.id], locked=i>0&&!S.days[PROG[i-1].id];
    const nEx=p.prac.length, nOk=p.prac.filter((_,k)=>exDone(p.id+"-"+k)).length;
    h+=`<div class="lvl ${done?"done":""} ${locked?"locked":""}" data-id="${p.id}"><div class="num">${done?"✓":p.num}</div><div class="ti">${p.icon} ${esc(p.t)}<small>${esc(p.obj)}</small><small>${p.dur} · ${nOk}/${nEx} cas pratiques · mission ${exDone(p.id+"-m")?"faite":"à faire"}</small></div></div>`;
    if(i<PROG.length-1) h+=`<div class="connector"></div>`;
  });
  h+=`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  app.innerHTML=h;
  document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".lvl:not(.locked)").forEach(el=>el.onclick=()=>go(session,el.dataset.id));
}

function session(id){
  const p=PROG.find(x=>x.id===id); const idx=PROG.indexOf(p);
  const nOk=p.prac.filter((_,k)=>exDone(p.id+"-"+k)).length, all=nOk===p.prac.length, mOk=exDone(p.id+"-m");
  let h=`<div class="card"><span class="tag">Séance ${p.num}</span><span class="tag">${p.dur}</span><span class="tag">${CATS[p.cat].icon} ${CATS[p.cat].name}</span>
    <h2 style="margin-top:10px">${p.icon} ${esc(p.t)}</h2><p class="muted" style="margin:0">${esc(p.obj)}</p></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">La notion · 8 min</h3><div class="lesson">${p.lesson.map(x=>`<p>${x}</p>`).join("")}</div></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">Cas pratiques · 20 min <span class="muted small">(${nOk}/${p.prac.length})</span></h3><div id="pracs"></div></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">Vérifier</h3><p class="muted small" style="margin:0 0 10px">${p.qids.length} questions sur cette séance.</p><button class="btn ghost sm" id="sq">🎯 Lancer les questions</button></div>`;
  h+=`<div class="card" style="border-color:var(--gold)"><h3 style="margin-top:0">🛠️ Mission terrain <span class="muted small">— sur tes vrais dossiers, hors de l'app</span></h3><div id="mission"></div></div>`;
  h+=`<div class="row"><button class="btn ghost" id="back">← Programme</button>${all&&mOk&&!S.days[p.id]?`<button class="btn gold" id="finish">Valider la séance · +30 XP</button>`:(!S.days[p.id]?`<span class="tag">${all?"Mission terrain à faire pour valider":"Cas pratiques et mission à terminer"}</span>`:"")}${S.days[p.id]?`<span class="tag done">Séance validée</span>`:""}${idx<PROG.length-1&&S.days[p.id]?`<button class="btn" id="nx">Séance suivante →</button>`:""}</div>`;
  app.innerHTML=h;
  const box=document.getElementById("pracs");
  p.prac.forEach((pr,k)=>{ const d=document.createElement("div"); d.className="card"; d.style.background="#16223a"; box.appendChild(d); renderPrac(d,pr,p.id+"-"+k,()=>go(session,id)); });
  const mEl=document.getElementById("mission"); const m=Object.assign({type:"write"},p.mission);
  renderPrac(mEl,m,p.id+"-m",()=>go(session,id));
  document.getElementById("back").onclick=()=>go(program);
  document.getElementById("sq").onclick=()=>go(quiz,p.qids,"Séance "+p.num,()=>go(session,id));
  const f=document.getElementById("finish"); if(f) f.onclick=()=>{ S.days[p.id]=true; save(); addXP(30); award("Séance "+p.num); if(Object.keys(S.days).length===PROG.length) award("Parcours complet"); go(session,id); };
  const n=document.getElementById("nx"); if(n) n.onclick=()=>go(session,PROG[idx+1].id);
}

/* ---------- moteur de cas pratiques ---------- */
function renderPrac(el,p,id,refresh){
  const done=exDone(id);
  const head=`<h3 style="margin-top:0">${done?"✅ ":""}${esc(p.title)}</h3><p class="small" style="white-space:pre-wrap;margin:0 0 10px">${esc(p.intro||p.situation||"")}</p>`;
  const R={order,classify,calc,scenario,write,compare}[p.type]; R(el,p,id,head,refresh);
}
function order(el,p,id,head,refresh){
  let cur=shuffled(p.steps); if(cur.join()===p.steps.join()) cur=[...p.steps].reverse();
  let checked=false;
  function draw(){
    el.innerHTML=head+cur.map((s,i)=>`<div class="step ${checked?(s===p.steps[i]?"ok":"ko"):""}"><div class="tx">${i+1}. ${esc(s)}</div><div class="ar"><button data-i="${i}" data-d="-1">▲</button><button data-i="${i}" data-d="1">▼</button></div></div>`).join("")
      +`<div class="row"><button class="btn sm" id="chk">Vérifier l'ordre</button>${checked&&cur.join()!==p.steps.join()?`<button class="btn ghost sm" id="sol">Voir la solution</button>`:""}</div><div id="res"></div>`;
    el.querySelectorAll(".ar button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i,j=i+ +b.dataset.d; if(j<0||j>=cur.length) return; [cur[i],cur[j]]=[cur[j],cur[i]]; checked=false; draw(); });
    el.querySelector("#chk").onclick=()=>{ checked=true; const ok=cur.join()===p.steps.join(); draw(); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?"Ordre correct.":"Les lignes en rouge ne sont pas à leur place. Réfléchis à ce qui doit précéder quoi, puis revérifie."}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
    const s=el.querySelector("#sol"); if(s) s.onclick=()=>{ cur=[...p.steps]; checked=true; draw(); };
  }
  draw();
}
function classify(el,p,id,head,refresh){
  const sel={}; let checked=false;
  function draw(){
    el.innerHTML=head+p.items.map((it,i)=>`<div class="cls ${checked?(sel[i]===it.a?"ok":"ko"):""}"><div class="tx">${esc(it.t)}</div><div class="bk">${p.buckets.map((b,j)=>`<button data-i="${i}" data-j="${j}" class="${sel[i]===j?"sel":""}">${esc(b)}</button>`).join("")}</div></div>`).join("")
      +`<div class="row"><button class="btn sm" id="chk">Vérifier</button></div><div id="res"></div>`;
    el.querySelectorAll(".bk button").forEach(b=>b.onclick=()=>{ sel[b.dataset.i]=+b.dataset.j; checked=false; draw(); });
    el.querySelector("#chk").onclick=()=>{ if(Object.keys(sel).length<p.items.length){ toast("Classe tous les éléments"); return; } checked=true; const n=p.items.filter((it,i)=>sel[i]===it.a).length; draw(); const ok=n===p.items.length; el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${n}/${p.items.length} bien classés.${ok?"":" Les rouges : relis la notion, corrige, revérifie."}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
  }
  draw();
}
function calc(el,p,id,head,refresh){
  el.innerHTML=head+`<p style="margin:0 0 8px"><b>${esc(p.question)}</b></p><input type="number" step="any" id="v" placeholder="Ta réponse"><div class="row"><button class="btn sm" id="chk">Vérifier</button></div><div id="res"></div>`;
  el.querySelector("#chk").onclick=()=>{ const v=parseFloat(String(el.querySelector("#v").value).replace(",",".")); const ok=!isNaN(v)&&Math.abs(v-p.answer)<=(p.tol||0)+1e-9; el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?`Juste : ${p.answer}.`:`Pas ça. ${esc(p.hint)}`}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
}
function scenario(el,p,id,head,refresh){
  el.innerHTML=head+p.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")+`<div id="res"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, ok=i===p.a; el.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(j===p.a) x.classList.add("correct"); else if(j===i) x.classList.add("wrong"); else x.classList.add("dim"); }); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${esc(p.e)}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,1200);} else { el.querySelector("#res").innerHTML+=`<div class="row"><button class="btn ghost sm" id="re">Réessayer</button></div>`; el.querySelector("#re").onclick=()=>scenario(el,p,id,head,refresh); } });
}
function compare(el,p,id,head,refresh){
  el.innerHTML=head+`<p class="small muted" style="margin:0">Clique sur la réponse à ne pas utiliser.</p><div class="cmp"><div class="rep" data-i="0"><b>Réponse A</b>${esc(p.a)}</div><div class="rep" data-i="1"><b>Réponse B</b>${esc(p.b)}</div></div><div id="res"></div>`;
  el.querySelectorAll(".rep").forEach(r=>r.onclick=()=>{ const i=+r.dataset.i, ok=i===p.bad; el.querySelectorAll(".rep").forEach((x,j)=>{ x.onclick=null; x.classList.add(j===p.bad?"bad":"good"); }); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?"Bien vu. ":"Non — c'est l'autre. "}${esc(p.why)}</div><div class="expl" style="margin-top:8px"><b>Les indices :</b><ul style="margin:6px 0 0 18px;padding:0">${p.tells.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,1500);} else { el.querySelector("#res").innerHTML+=`<div class="row"><button class="btn ghost sm" id="re">Réessayer</button></div>`; el.querySelector("#re").onclick=()=>compare(el,p,id,head,refresh); } });
}
function write(el,p,id,head,refresh){
  el.innerHTML=head+`<textarea id="ta" placeholder="Écris ici. Ton brouillon est conservé.">${esc(S.drafts[id]||"")}</textarea><div class="row"><button class="btn sm" id="chk">Analyser mon texte</button><span class="small muted">${p.criteres.length} critères · ${Math.ceil(p.criteres.length*0.75)} suffisent</span></div><div id="res"></div>`;
  const ta=el.querySelector("#ta"); ta.oninput=()=>{ S.drafts[id]=ta.value; saveLocal(); };
  el.querySelector("#chk").onclick=()=>{
    const txt=ta.value.trim(); if(txt.length<20){ toast("Écris d'abord quelques lignes"); return; }
    const t=nz(txt); const res=p.criteres.map(c=>({c,ok:!!c.test(t)})); const ok=res.filter(r=>r.ok).length, n=res.length, seuil=Math.ceil(n*0.75);
    el.querySelector("#res").innerHTML=`<div style="margin-top:12px">${res.map(r=>`<div class="crit"><div class="mk">${r.ok?"✅":"⬜"}</div><div>${esc(r.c.label)}${r.ok?"":`<span class="aide">${esc(r.c.aide)}</span>`}</div></div>`).join("")}</div>
      <div class="expl ${ok>=seuil?"ok":"ko"}">${ok}/${n} critères. ${ok>=seuil?"Validé.":"Complète les critères manquants, puis relance l'analyse."}</div>
      <h3>Un modèle, pour comparer</h3><div class="modele">${esc(p.modele)}</div>${p.conseil?`<div class="expl" style="margin-top:10px">💡 ${esc(p.conseil)}</div>`:""}`;
    if(ok>=seuil){ markEx(id); refresh&&setTimeout(refresh,2500); }
  };
}

/* ---------- quiz ---------- */
function quizMenu(){
  let h=`<div class="card"><h2>Quiz par thème</h2><p class="muted small" style="margin:0">8 questions au hasard par thème. 80 % de bonnes réponses = badge du thème.</p></div><div class="grid">`;
  Object.entries(CATS).forEach(([k,c])=>{ const n=Q.filter(q=>q.c===k).length, sc=S.catScore[k]; h+=`<div class="mode" data-c="${k}"><div class="ic">${c.icon}</div><b>${esc(c.name)}</b><span>${n} questions${sc!=null?` · meilleur ${sc} %`:""}</span></div>`; });
  h+=`</div><div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  app.innerHTML=h; document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{ const k=m.dataset.c; const ids=shuffled(Q.filter(q=>q.c===k).map(q=>q.id)).slice(0,8); go(quiz,ids,CATS[k].name,()=>go(quizMenu),k); });
}
function quiz(ids,title,back,cat){
  let i=0, score=0, order_=[...ids];
  function step(){
    if(i>=order_.length){ const pct=Math.round(score/order_.length*100); if(cat){ S.catScore[cat]=Math.max(S.catScore[cat]||0,pct); save(); if(pct>=80) award(CATS[cat].name); } app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${score}/${order_.length}</div><p>${pct>=80?"Solide.":pct>=60?"Ça tient. Relis les explications ratées.":"Reprends la fiche du thème avant de relancer."}</p><div class="row" style="justify-content:center"><button class="btn" id="again">Recommencer</button><button class="btn ghost" id="bk">Retour</button></div></div>`; document.getElementById("again").onclick=()=>go(quiz,shuffled(ids),title,back,cat); document.getElementById("bk").onclick=back; return; }
    const q=Q[order_[i]];
    app.innerHTML=`<div class="card"><div class="row" style="margin:0 0 10px;justify-content:space-between"><span class="tag">${esc(title)} · ${i+1}/${order_.length}</span><span class="tag">${CATS[q.c].icon} ${"●".repeat(q.d)}</span></div><div class="bar"><i style="width:${Math.round(i/order_.length*100)}%"></i></div><h2 style="margin-top:16px;font-size:17px">${esc(q.q)}</h2>${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}<div id="res"></div></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const j=+b.dataset.j, ok=j===q.a; if(ok){score++; addXP(10);} bumpBox(q.id,ok); document.querySelectorAll(".opt").forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("correct"); else if(k===j) x.classList.add("wrong"); else x.classList.add("dim"); }); document.getElementById("res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${esc(q.e)}</div><div class="row"><button class="btn" id="nx">${i+1<order_.length?"Suivante →":"Résultat"}</button></div>`; document.getElementById("nx").onclick=()=>{ i++; step(); }; });
  }
  step();
}
/* ---------- flashcards ---------- */
function bumpBox(id,ok){ const k="q"+id; S.boxes[k]=ok?Math.min(5,(S.boxes[k]||1)+1):1; save(); }
function cards(){
  const deck=CARDS.map((f,i)=>({f,i})).sort((a,b)=>((S.boxes["c"+a.i]||1)-(S.boxes["c"+b.i]||1))||Math.random()-0.5);
  let i=0, flipped=false;
  function draw(){
    if(i>=deck.length){ app.innerHTML=`<div class="card" style="text-align:center"><h2>Série terminée</h2><p class="muted">Les cartes ratées reviendront en premier la prochaine fois.</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Nouvelle série</button><button class="btn ghost" id="bk">← Accueil</button></div></div>`; document.getElementById("ag").onclick=()=>go(cards); document.getElementById("bk").onclick=()=>go(home); return; }
    const c=deck[i]; const lv=S.boxes["c"+c.i]||1;
    app.innerHTML=`<div class="row" style="margin:0 0 10px;justify-content:space-between"><span class="tag">Carte ${i+1}/${deck.length}</span><span class="tag">maîtrise ${lv}/5${lv>=4?" · acquise":""}</span></div><div class="fc" id="fc">${flipped?esc(c.f.b):`<b>${esc(c.f.f)}</b>`}<small>${flipped?"":"Toucher pour retourner"}</small></div>
      ${flipped?`<div class="row"><button class="btn ghost" id="no">Je ne savais pas</button><button class="btn" id="yes">Je savais · +5 XP</button></div>`:`<div class="row"><button class="btn ghost" id="bk">← Accueil</button></div>`}`;
    document.getElementById("fc").onclick=()=>{ flipped=!flipped; draw(); };
    const y=document.getElementById("yes"), n=document.getElementById("no"), b=document.getElementById("bk");
    if(y) y.onclick=()=>{ S.boxes["c"+c.i]=Math.min(5,lv+1); addXP(5); i++; flipped=false; draw(); };
    if(n) n.onclick=()=>{ S.boxes["c"+c.i]=1; save(); i++; flipped=false; draw(); };
    if(b) b.onclick=()=>go(home);
  }
  draw();
}

/* ---------- fiches ---------- */
function fiches(){
  app.innerHTML=`<div class="card"><h2>Fiches</h2><p class="muted small" style="margin:0">Une par thème. Le contenu du parcours, condensé.</p></div>`+CHAPTERS.map(c=>`<div class="lvl ${S.chaptersDone.includes(c.id)?"done":""}" data-id="${c.id}"><div class="num">${c.icon}</div><div class="ti">${esc(c.t)}<small>${c.lesson.length} paragraphes</small></div></div><div class="connector"></div>`).join("")+`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".lvl").forEach(el=>el.onclick=()=>go(fiche,el.dataset.id));
}
function fiche(id){
  const c=CHAPTERS.find(x=>x.id===id); const i=CHAPTERS.indexOf(c);
  app.innerHTML=`<div class="card"><h2>${c.icon} ${esc(c.t)}</h2><div class="lesson">${c.lesson.map(p=>`<p>${p}</p>`).join("")}</div></div><div class="row"><button class="btn ghost" id="back">← Fiches</button><button class="btn" id="q">🎯 Quiz du thème</button>${i<CHAPTERS.length-1?`<button class="btn ghost" id="nx">Fiche suivante →</button>`:""}</div>`;
  if(!S.chaptersDone.includes(id)){ S.chaptersDone.push(id); save(); }
  document.getElementById("back").onclick=()=>go(fiches);
  document.getElementById("q").onclick=()=>{ const ids=shuffled(Q.filter(q=>q.c===c.cat).map(q=>q.id)).slice(0,8); go(quiz,ids,c.t,()=>go(fiche,id),c.cat); };
  const n=document.getElementById("nx"); if(n) n.onclick=()=>go(fiche,CHAPTERS[i+1].id);
}

/* ---------- missions ---------- */
function missions(){
  const done=PROG.filter(p=>exDone(p.id+"-m")).length;
  let h=`<div class="card"><h2>Missions terrain</h2><p class="muted small" style="margin:0 0 10px">Une par séance, sur ton secteur, tes clients, tes réseaux. C'est le parcours ; le reste est de la préparation.</p><div class="bar"><i style="width:${Math.round(done/PROG.length*100)}%"></i></div></div>`;
  PROG.forEach((p,i)=>{ const ok=exDone(p.id+"-m"), locked=i>0&&!S.days[PROG[i-1].id]; h+=`<div class="lvl ${ok?"done":""} ${locked?"locked":""}" data-id="${p.id}"><div class="num">${ok?"✓":p.num}</div><div class="ti">${esc(p.mission.title)}<small>${esc(p.mission.intro.split(".")[0])}.</small></div></div>${i<PROG.length-1?'<div class="connector"></div>':""}`; });
  h+=`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  app.innerHTML=h; document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".lvl:not(.locked)").forEach(el=>el.onclick=()=>{ go(session,el.dataset.id); setTimeout(()=>{ const m=document.getElementById("mission"); m&&m.scrollIntoView({behavior:"smooth"}); },50); });
}

/* ---------- mes prompts ---------- */
function prompts(){
  const list=[]; PROG.forEach(p=>p.prac.forEach(pr=>{ if(pr.type==="write"&&/prompt|instructions|brief|demande/i.test(pr.title)) list.push({s:p,pr}); }));
  app.innerHTML=`<div class="card"><h2>Mes prompts</h2><p class="muted small" style="margin:0">Les modèles du parcours, à copier dans un fichier prompts.txt et à adapter. Un prompt réutilisé ne se retape jamais.</p></div>`
    +list.map((x,i)=>`<div class="card"><span class="tag">Séance ${x.s.num}</span><h3 style="margin-top:8px">${esc(x.pr.title)}</h3><div class="modele">${esc(x.pr.modele)}</div><div class="row"><button class="btn ghost sm" data-i="${i}">Copier</button></div></div>`).join("")
    +`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(list[+b.dataset.i].pr.modele); toast("Copié"); }catch(e){ toast("Sélectionnez le texte et copiez-le"); } });
}

/* ===================== 4. SYNC ===================== */
let CFG=(()=>{ try{ return Object.assign({url:"",token:"",auto:true},JSON.parse(localStorage.getItem(SYNC_KEY))||{}); }catch(e){ return {url:"",token:"",auto:true}; } })();
const syncConfigured=()=>!!(CFG.url&&CFG.token);
async function cloudLoad(){ const u=CFG.url+(CFG.url.includes("?")?"&":"?")+"action=load&user="+SYNC_USER+"&token="+encodeURIComponent(CFG.token)+"&_="+Date.now(); const j=await (await fetch(u,{method:"GET",redirect:"follow"})).json(); if(!j.ok) throw new Error(j.error||"refus"); return j.data||null; }
async function cloudSave(){ const j=await (await fetch(CFG.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",user:SYNC_USER,token:CFG.token,data:S})})).json(); if(!j.ok) throw new Error(j.error||"refus"); }
let pushT; function schedulePush(){ if(!syncConfigured()||!CFG.auto) return; clearTimeout(pushT); pushT=setTimeout(async()=>{ try{ await cloudSave(); setSyncStatus("☁️ synchronisé "+hhmm()); }catch(e){ setSyncStatus("☁️ échec (hors ligne ?)"); } },1500); }
function hasProgress(o){ return !!(o&&((o.xp||0)>0||Object.keys(o.days||{}).length||Object.keys(o.ex||{}).length)); }
async function syncOnStart(){ if(!syncConfigured()) return setSyncStatus("☁️ sync non configurée"); try{ const d=await cloudLoad(); const remote=d&&d.updatedAt?d.updatedAt:0, local=S.updatedAt||0; if(d&&hasProgress(d)&&(remote>local||!hasProgress(S))){ S=Object.assign({},DEF,d); saveLocal(); syncHeader(); go(home); toast("☁️ Progression chargée"); } else if(hasProgress(S)&&(!d||local>remote)){ await cloudSave(); } setSyncStatus("☁️ synchronisé "+hhmm()); }catch(e){ setSyncStatus("☁️ hors ligne"); } }
function cfgView(){
  app.innerHTML=`<div class="card"><h2>Synchronisation</h2><p class="muted small">Même progression sur le Mac et sur l'iPhone. Colle l'adresse et le code donnés par Thomas. Une fois, puis c'est automatique.</p>
    <label class="small muted">Adresse du script</label><input type="url" id="u" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="small muted" style="display:block;margin-top:10px">Code</label><input type="text" id="t" value="${esc(CFG.token)}" placeholder="le code reçu">
    <div class="row"><button class="btn" id="sv">Enregistrer</button><button class="btn ghost" id="test">Tester la connexion</button></div>
    <div class="row"><button class="btn ghost sm" id="ld">Charger depuis le cloud</button><button class="btn ghost sm" id="up">Envoyer vers le cloud</button></div><div id="res"></div>
    <div class="row"><button class="btn ghost" id="back">← Accueil</button></div></div>`;
  const R=m=>document.getElementById("res").innerHTML=`<div class="expl">${esc(m)}</div>`;
  const readCfg=()=>{ CFG.url=document.getElementById("u").value.trim(); CFG.token=document.getElementById("t").value.trim(); try{ localStorage.setItem(SYNC_KEY,JSON.stringify(CFG)); }catch(e){} };
  document.getElementById("sv").onclick=()=>{ readCfg(); toast("Enregistré"); syncOnStart(); };
  document.getElementById("test").onclick=async()=>{ readCfg(); try{ await cloudLoad(); R("Connexion OK."); }catch(e){ R("Échec : "+e.message+". Vérifiez l'adresse (elle finit par /exec) et le code."); } };
  document.getElementById("ld").onclick=async()=>{ readCfg(); try{ const d=await cloudLoad(); if(!d){ R("Rien dans le cloud pour l'instant."); return; } S=Object.assign({},DEF,d); saveLocal(); syncHeader(); R("Progression chargée."); }catch(e){ R("Échec : "+e.message); } };
  document.getElementById("up").onclick=async()=>{ readCfg(); try{ await cloudSave(); R("Envoyé."); setSyncStatus("☁️ synchronisé "+hhmm()); }catch(e){ R("Échec : "+e.message); } };
  document.getElementById("back").onclick=()=>go(home);
}
function exportProgress(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="progression-paco.json"; document.body.appendChild(a); a.click(); a.remove(); toast("💾 Progression exportée"); }
function importProgress(file){ const r=new FileReader(); r.onload=()=>{ try{ S=Object.assign({},DEF,JSON.parse(r.result)); save(); syncHeader(); go(home); toast("Progression importée"); }catch(e){ alert("Fichier invalide."); } }; r.readAsText(file); }

/* ===================== 5. INIT ===================== */
probeStorage(); touchStreak(); syncHeader(); home();
document.getElementById("home-link").onclick=()=>go(home);
document.getElementById("exportlink").onclick=exportProgress;
document.getElementById("importlink").onclick=()=>document.getElementById("importfile").click();
document.getElementById("importfile").onchange=e=>{ if(e.target.files[0]) importProgress(e.target.files[0]); };
document.getElementById("cfglink").onclick=()=>go(cfgView);
syncOnStart();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
window.__D={PROG,Q,CATS,CHAPTERS,CARDS,MISSIONS,get S(){return S},nz,go,home,session,cfgView,missions};
/* test de cohérence des modèles (console) */
PROG.forEach(d=>[...d.prac,d.mission].forEach((p,k)=>{ if(p.type&&p.type!=="write") return; const fails=p.criteres.filter(c=>!c.test(nz(p.modele))).map(c=>c.label); if(fails.length) console.warn("⚠ modèle "+d.id+"-"+k+" :",fails); }));
</script>
