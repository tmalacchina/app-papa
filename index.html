<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IA au bureau — Renaud</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA au bureau">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0f1726; --surface:#1b2740; --surface2:#223052; --txt:#eaf0fb; --muted:#9fb0cc;
  --line:#2c3c5e; --accent:#37a0e0; --gold:#f0c040; --teal2:#1D9E75; --red:#A32D2D; --amber:#BA7517;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1422,#14213a);color:var(--txt);line-height:1.5;margin:0;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700;cursor:pointer}
header h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.pill b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:18px 0 6px;font-size:15.5px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.gold{background:var(--gold);color:#1a1a1a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;margin:9px 0;font-size:14.5px;color:var(--txt);cursor:pointer;font-family:inherit;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:#16442f;border-color:var(--teal2)}
.opt.wrong{background:#4a1d1d;border-color:var(--red)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.expl{background:#11203a;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:14px;font-size:13.5px}
.expl.ok{border-left-color:var(--teal2)}
.expl.ko{border-left-color:var(--red)}
.bar{height:8px;background:#0c1322;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--accent));transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.18s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .ic{font-size:26px}
.mode b{display:block;margin-top:6px;font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.lvl:hover{border-color:var(--accent)}
.lvl.locked{opacity:.5;cursor:not-allowed}
.lvl .num{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lvl.done .num{background:linear-gradient(135deg,var(--teal2),var(--accent))}
.lvl .ti{flex:1}
.lvl .ti small{display:block;color:var(--muted);font-size:12.5px}
.connector{width:2px;height:14px;background:var(--line);margin-left:34px}
.lesson p{margin:0 0 12px;font-size:15px}
.lesson p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--muted);margin-right:6px}
.tag.done{background:#16442f;color:#8fe0bd}
textarea{width:100%;min-height:150px;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;line-height:1.5;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=url]{width:100%;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px}
.crit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit .mk{flex:none;width:22px;text-align:center}
.crit .aide{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.modele{white-space:pre-wrap;background:#0c1322;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0}
.step .tx{flex:1;font-size:14.5px}
.step .ar{display:flex;flex-direction:column;gap:4px}
.step .ar button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:7px;width:30px;height:24px;cursor:pointer;font-size:12px}
.step.ok{background:#16442f}
.step.ko{background:#4a1d1d}
.cls{background:var(--surface2);border-radius:12px;padding:12px;margin:8px 0}
.cls .tx{font-size:14.5px;margin-bottom:8px}
.cls .bk{display:flex;gap:6px;flex-wrap:wrap}
.cls .bk button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:inherit;font-size:13px}
.cls .bk button.sel{border-color:var(--accent);background:#11304a}
.cls.ok{background:#16442f}
.cls.ko{background:#4a1d1d}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp .rep{background:#0c1322;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;cursor:pointer;line-height:1.5}
.cmp .rep:hover{border-color:var(--accent)}
.cmp .rep b{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.cmp .rep.bad{border-color:var(--red);background:#2a1414}
.cmp .rep.good{border-color:var(--teal2);background:#12301f}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 22px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-size:17px}
.fc small{color:var(--muted);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c1322;border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.footer-note{margin-top:30px;font-size:12.5px;color:var(--muted);text-align:center}
.footer-note a{color:var(--accent);cursor:pointer;text-decoration:none}
.warn{background:#3a2a10;border:1px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.big{font-size:32px;font-weight:700;color:var(--gold)}
.next{background:#11203a;border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:14px;font-size:14px}
.next b{color:var(--gold)}
@media(max-width:560px){
  .wrap{padding:12px 12px 50px}
  .grid{grid-template-columns:1fr}
  .btn{flex:1 1 auto;justify-content:center}
  .opt{font-size:15px;padding:13px}
  .cmp{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home-link">IA au bureau <small>Parcours de Renaud · 12 séances · 12 missions</small></h1>
    <div class="stats" id="stats"></div>
  </header>
  <div id="app"></div>
  <div class="footer-note">
    <span id="syncstatus">☁️ sync non configurée</span> ·
    <a id="exportlink">exporter</a> · <a id="importlink">importer</a> · <a id="cfglink">synchro</a>
    <input type="file" id="importfile" accept="application/json" style="display:none">
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== 1. DONNÉES ===================== */
const APP_NAME = "IA au bureau";
const USER_NAME = "Renaud";

const CATS = {
  base:   { name:"Comment ça marche",   icon:"🧠" },
  prompt: { name:"Bien demander",       icon:"✍️" },
  data:   { name:"Données et cadre",    icon:"🔒" },
  mail:   { name:"Mails et agenda",     icon:"📬" },
  excel:  { name:"Excel et chiffres",   icon:"📊" },
  vocab:  { name:"Vocabulaire",         icon:"🗣️" }
};

/* Chaque séance : 30 min. Notion courte → geste dans SON outil → résultat collé et analysé → une chose à faire avant la suivante. */
const PROG = [
/* ───────────────────────── SÉANCE 1 ───────────────────────── */
{ id:"s1", num:1, t:"Ce que c'est, ce que ce n'est pas", icon:"🧠", cat:"base", dur:"30 min",
  obj:"Comprendre ce qu'une IA fait vraiment quand elle répond — et pourquoi elle peut affirmer une chose fausse avec assurance.",
  lesson:[
    "Une IA comme ChatGPT n'a pas « mémorisé toutes les connaissances ». Elle a appris, sur des milliards de textes, à prédire le mot suivant le plus probable. Quand elle répond, elle <b>compose</b> une suite de mots plausible. Le plus souvent c'est juste, parce que le plausible et le vrai coïncident. Parfois non — et rien dans le ton ne le signale.",
    "Ce phénomène a un nom : <b>l'hallucination</b>. L'IA invente un chiffre, une référence, une règle, un nom de fournisseur, avec exactement la même assurance que lorsqu'elle a raison. Ce n'est pas un bug rare, c'est une propriété du fonctionnement. On ne l'élimine pas, on l'encadre.",
    "Conséquence directe pour vous : une IA ne « sait » pas votre tarif, votre catalogue, vos conditions clients. Si vous ne lui donnez pas le document, elle complète les trous avec du vraisemblable. Un prix de RFA inventé ressemble exactement à un vrai.",
    "Deuxième conséquence : l'IA ne se connecte pas toute seule à Business Central, à votre serveur ou à votre boîte mail. Dans ChatGPT tel que vous l'utilisez, elle ne voit que ce que vous collez ou déposez dans la conversation. Les outils qui se branchent sur vos données existent, mais ce sont d'autres produits et d'autres contrats — c'est le chantier de l'entreprise, pas votre usage quotidien.",
    "La règle qui découle de tout ça, et qui vaut pour les 11 séances suivantes : <b>tout ce qui est vérifiable doit être vérifié</b>. Un chiffre, une date, une règle, un nom. Le reste — le style, la structure, l'idée — on peut le prendre tel quel."
  ],
  prac:[
    { type:"compare", title:"Deux réponses, une inventée",
      intro:"On a demandé à une IA : « Quel est le taux de RFA habituel accordé à un grossiste en pièces auto en France ? » Voici deux réponses. Laquelle est la plus dangereuse ?",
      a:"Le taux de RFA (remise de fin d'année) standard dans la distribution de pièces automobiles en France est de 3,5 % pour les grossistes, selon le barème de la FEDA 2024. Il monte à 5 % au-delà de 250 000 € de chiffre d'affaires annuel.",
      b:"Il n'existe pas de taux « habituel » : les RFA sont négociées contrat par contrat et dépendent du volume, de la catégorie de produits et de l'historique client. Pour connaître les vôtres, il faut vous référer à vos conditions commerciales. Je peux vous aider à structurer une grille si vous me donnez vos paliers.",
      bad:0,
      why:"La réponse A cite un barème précis d'une fédération, avec des chiffres et un seuil — c'est ce qui la rend crédible, et c'est exactement le signal d'alerte. Ce barème n'existe pas sous cette forme. L'IA a fabriqué une source parce que la question appelait une réponse chiffrée. La réponse B admet qu'elle ne sait pas et redirige vers vos données : c'est la bonne.",
      tells:["Un chiffre précis sans document fourni", "Une source nommée que vous ne pouvez pas ouvrir", "Un ton d'autorité sur un sujet propre à votre entreprise"] },
    { type:"classify", title:"Fiable ou à vérifier ?",
      intro:"Pour chaque réponse d'IA, dites si vous pouvez la prendre telle quelle ou si elle doit être vérifiée avant usage.",
      buckets:["Je prends tel quel","Je vérifie d'abord"],
      items:[
        {t:"Une reformulation plus polie de votre mail à un grossiste", a:0},
        {t:"Le montant de la remise que vous avez accordée l'an dernier à un client, alors que vous n'avez fourni aucun fichier", a:1},
        {t:"Un plan en 5 points pour préparer un salon régional", a:0},
        {t:"La référence exacte d'une pièce compatible avec un modèle de véhicule", a:1},
        {t:"Trois idées de mécanique promotionnelle pour septembre", a:0},
        {t:"La date limite d'une obligation réglementaire", a:1},
        {t:"Une somme calculée sur un tableau que vous avez déposé, sans que l'IA montre sa méthode", a:1}
      ] },
    { type:"scenario", title:"Le réflexe",
      situation:"Vous demandez à ChatGPT le chiffre d'affaires moyen d'un client trade chez Planet Line. Il répond « environ 42 000 € par an ». Vous n'avez rien déposé.",
      options:["C'est cohérent avec mon intuition, je le note.","Je lui demande d'où vient ce chiffre.","Je ne peux pas utiliser ce chiffre : il n'a aucune donnée de Planet Line. Je lui donne l'export CA et je redemande."],
      a:2, e:"Sans données fournies, ce chiffre est une invention plausible. Lui demander « d'où ça vient » produira une justification tout aussi inventée. La seule réponse correcte est de fournir la source." }
  ],
  next:"Avant la séance 2 : retrouvez dans ChatGPT une conversation où vous avez obtenu un chiffre ou une règle. Demandez-vous si vous l'aviez vérifiée. Notez la réponse, elle servira.",
  qids:[0,1,2,3,4,5,6]
},

/* ───────────────────────── SÉANCE 2 ───────────────────────── */
{ id:"s2", num:2, t:"Le prompt qui marche", icon:"✍️", cat:"prompt", dur:"30 min",
  obj:"Passer du prompt « qui marche parfois » au prompt qui marche à chaque fois, en quatre éléments.",
  lesson:[
    "Votre meilleur résultat jusqu'ici, ce sont les visuels de présentoir, et vous l'expliquez vous-même : « prompt clair ». Ce qui a marché là par instinct doit devenir une méthode. Un prompt efficace contient quatre choses, dans cet ordre ou un autre, mais toujours les quatre.",
    "<b>Le rôle</b> : qui doit être l'IA pour répondre. « Tu es un responsable commercial grands comptes dans la distribution de pièces auto. » Ça règle le vocabulaire et le niveau.",
    "<b>Le contexte</b> : ce que l'IA ne peut pas deviner. Qui est le client, quel est l'enjeu, ce qui s'est déjà passé. C'est la partie que tout le monde oublie et qui fait 80 % de la différence. Collez le mail précédent, décrivez le client, donnez les chiffres.",
    "<b>Le format</b> : ce que vous voulez recevoir. Un mail de 8 lignes. Un tableau à 3 colonnes. Trois options avec avantages et inconvénients. Sans ça, vous recevez de la prose générique.",
    "<b>La contrainte</b> : ce qu'il ne faut pas faire. « N'invente aucun chiffre : si une information manque, pose-moi la question. » « Pas de formule de politesse creuse. » « Maximum 120 mots. » La contrainte anti-invention devrait figurer dans presque tous vos prompts professionnels.",
    "Dernier point : la conversation. Vous discutez déjà en 10 échanges, c'est bien. Mais un prompt complet dès le départ divise ces échanges par trois. Ce n'est pas le nombre de relances qui fait la qualité, c'est la première demande."
  ],
  prac:[
    { type:"order", title:"Reconstituer un bon prompt",
      intro:"Voici les morceaux d'un prompt pour rédiger une relance à un grossiste silencieux depuis deux mois. Remettez-les dans un ordre logique : rôle, contexte, tâche, format, contrainte.",
      steps:[
        "Tu es responsable commercial grands comptes chez un distributeur de pièces auto et moto.",
        "Contexte : le client est un grossiste qui commandait 8 000 € par mois. Plus aucune commande depuis juillet. Dernier échange : il attendait une réponse sur un délai de livraison, que nous avons donnée. Je colle ci-dessous les deux derniers mails.",
        "Rédige un mail de reprise de contact.",
        "Format : 8 lignes maximum, objet inclus, une question ouverte en fin de mail.",
        "Contrainte : n'invente aucun chiffre ni aucune promesse commerciale. Ton direct, pas de formule creuse."
      ] },
    { type:"write", title:"Réécrivez un de vos prompts",
      intro:"Prenez une vraie demande que vous avez faite récemment (fiche produit, présentoir, recherche salon…) et réécrivez-la avec les quatre éléments. Collez le prompt complet ci-dessous.",
      criteres:[
        { label:"Un rôle est donné à l'IA", test:t=>/(tu es|vous etes|agis (en tant que|comme)|en tant que|role ?:)/.test(t), aide:"Commencez par « Tu es … » — un métier, un niveau, un point de vue." },
        { label:"Du contexte propre à votre situation (client, produit, chiffre, historique)", test:t=>/(client|produit|catalogue|grossiste|fournisseur|salon|promo|planet|tarif|commande|gamme|reference|€|\d{3,})/.test(t) && t.length>180, aide:"Donnez ce que l'IA ne peut pas deviner : qui, quoi, combien, ce qui s'est déjà passé. Plusieurs phrases." },
        { label:"Un format de sortie précis", test:t=>/(format|tableau|lignes? max|mots max|colonnes|liste|\d+ (points|options|lignes|mots|phrases|idees|propositions)|sous forme de|objet)/.test(t), aide:"Dites ce que vous voulez recevoir : un tableau, 3 options, un mail de 8 lignes…" },
        { label:"Une contrainte anti-invention ou une interdiction explicite", test:t=>/(n.invente|ne pas inventer|sans inventer|pose.moi (la|une|des) question|si (une information|il te) manque|ne (fais|fait) pas|interdit|pas de |maximum|au plus)/.test(t), aide:"Ajoutez « N'invente aucun chiffre ; si une information manque, pose-moi la question » ou toute autre interdiction utile." }
      ],
      modele:"Tu es chef de produit dans la distribution de pièces et accessoires auto/moto, spécialiste des fiches produits e-commerce.\n\nContexte : voici la fiche fournisseur brute d'un kit de plaquettes de frein (collée ci-dessous), destinée à notre site B2B pour des clients grossistes et plateformes. Nos fiches actuelles font 120 à 150 mots, avec un bloc caractéristiques en liste.\n\nTâche : rédige la fiche produit.\n\nFormat : un titre de 60 caractères max, un paragraphe de 80 mots, puis une liste de 5 caractéristiques techniques.\n\nContrainte : n'invente aucune caractéristique technique. Si une information manque dans la fiche fournisseur, écris [À COMPLÉTER] à sa place. Pas de superlatifs (« exceptionnel », « incroyable »).",
      conseil:"L'erreur classique : décrire la tâche en une ligne et laisser l'IA deviner tout le reste. Le contexte prend de la place. C'est normal." },
    { type:"scenario", title:"Il manque quelque chose",
      situation:"Prompt : « Fais-moi un argumentaire pour convaincre un grossiste de référencer notre nouvelle gamme d'ampoules LED. »",
      options:["Il manque le rôle","Il manque le contexte : quelle gamme, quel prix, quel grossiste, quelle concurrence","Il manque le format","Il manque les trois, mais le contexte est le trou le plus grave"],
      a:3, e:"Sans contexte, l'IA écrira un argumentaire générique valable pour n'importe quelle LED de n'importe quel distributeur — inutilisable. Rôle et format manquent aussi, mais le contexte est ce qui rend le résultat vôtre." }
  ],
  next:"Avant la séance 3 : utilisez ce prompt réécrit pour de vrai dans ChatGPT. Comparez le résultat avec celui que vous aviez obtenu la première fois.",
  qids:[7,8,9,10,11,12,13]
},

/* ───────────────────────── SÉANCE 3 ───────────────────────── */
{ id:"s3", num:3, t:"Ce qui sort, ce qui reste", icon:"🔒", cat:"data", dur:"30 min",
  obj:"Savoir en une seconde ce que vous pouvez coller dans une IA, ce qu'il faut anonymiser, et ce qui ne sort jamais.",
  lesson:[
    "Ce que vous tapez dans ChatGPT part sur les serveurs d'OpenAI. Avec un abonnement individuel, ces conversations peuvent servir à améliorer le modèle, sauf si vous désactivez l'option dans les paramètres (Paramètres → Contrôles des données → « Améliorer le modèle pour tous »). Vérifiez ce réglage aujourd'hui, c'est deux clics. Les offres entreprise (ChatGPT Business, Copilot avec Microsoft 365) s'engagent contractuellement à ne pas entraîner sur vos données — c'est la raison principale de leur existence.",
    "Planet Line a une charte d'usage de l'IA. Elle dit en substance trois choses. <b>Vert</b> : ce qui peut être collé tel quel — texte public, mails sans données sensibles, questions de méthode, brouillons. <b>Orange</b> : ce qui doit être anonymisé avant — noms de clients, chiffres individuels, conditions négociées. <b>Rouge</b> : ce qui ne sort jamais — tarifs complets, marges, données RH, contrats, accès et mots de passe.",
    "Anonymiser, concrètement : remplacer « Ets Durand » par « Client A », « 8 000 € par mois » par « un gros volume mensuel », le nom du fournisseur par « notre fournisseur principal ». L'IA travaille aussi bien avec des étiquettes qu'avec des vrais noms. Vous remettez les vrais noms à la fin, dans Word ou Outlook.",
    "Sur les fichiers déposés : un export CA avec les noms de clients et les montants, c'est orange foncé. Avant de le déposer, une colonne « Client » remplacée par des codes suffit souvent. Nico peut vous sortir l'export déjà codé.",
    "Le point que Jasper soulèvera : « et si ça fuite ? ». Réponse honnête : avec une offre individuelle, on limite le risque par ce qu'on n'y met pas. Avec une offre entreprise, le risque est contractuellement encadré. La charte existe précisément pour que la réponse ne dépende pas de la bonne volonté de chacun."
  ],
  prac:[
    { type:"classify", title:"Vert, orange, rouge",
      intro:"Pour chaque élément, décidez : je le colle tel quel, je l'anonymise d'abord, ou ça ne sort jamais.",

{ id:"s12", num:12, t:"La démo pour Jasper", icon:"🎯", cat:"vocab", dur:"30 min",
  obj:"Préparer une démonstration de dix minutes, sur un dossier de Jasper, avec un chiffre avant/après et une réponse prête à ses trois objections.",

    "La structure. <b>Une minute</b> : le chiffre. « Je passais 2 h 15 par jour dans les mails, je suis à 1 h 20. Une offre me prenait 45 minutes, elle m'en prend 12. » Vos mesures des séances 4, 5 et 10. <b>Cinq minutes</b> : le geste en direct, sur son dossier. Un mail fournisseur qu'il doit traiter, vous le collez dans le projet, le brouillon sort, vous le relisez ensemble et vous corrigez une chose devant lui. Le fait de corriger est le message. <b>Deux minutes</b> : les trois règles — on relit les chiffres, on ne donne pas les tarifs, ça n'envoie rien tout seul. <b>Deux minutes</b> : sa question. Vous avez les réponses.",
    "Ses trois objections et vos réponses. « Ça fait des erreurs » — oui, et c'est pour ça qu'on relit ; montrez la correction que vous venez de faire. « Nos données » — la charte, rouge orange vert ; et l'offre entreprise qui s'engage à ne pas entraîner dessus, que Christophe met en place. « Je ne suis pas bon en IA » — vous n'avez pas besoin de l'être, vous avez besoin d'être bon en relecture ; c'est déjà votre métier.",
    "Ce qu'il ne faut pas dire : « ça se connecte à l'ERP », « ça travaille pendant qu'on dort », « ça apprend de nos corrections ». Trois choses que vous pensiez vraies il y a six semaines, et qui sont fausses pour l'usage quotidien. Si Jasper les entend et découvre qu'elles sont fausses, vous perdez tout le crédit gagné.",
    "Après la démo, une seule demande : « Essaie sur trois mails cette semaine avec le projet que je t'ai préparé. » Un projet « Mails fournisseurs » avec ses instructions à lui, que vous créez pour lui. Le premier pas coûte zéro effort. C'est comme ça qu'on gagne quelqu'un qui « n'est pas bon » : en lui enlevant tout ce qui fait peur, sauf le résultat."
  ],
  prac:[
    { type:"order", title:"Le déroulé",
      intro:"Remettez dans l'ordre le plan de la démonstration.",
      steps:["Annoncer le chiffre avant/après en une phrase","Coller un vrai mail de son dossier dans le projet, devant lui","Relire le brouillon ensemble et corriger une chose à voix haute","Énoncer les trois règles : relire, pas de tarifs, rien ne part tout seul","Répondre à sa question","Proposer l'essai sur trois mails avec un projet préparé pour lui"] },
    { type:"write", title:"Vos chiffres",

        { label:"Au moins un temps « après » chiffré", test:t=>(t.match(/(\d+ ?h|\d+ ?min|\d+ heures?|\d+ minutes?)/g)||[]).length>=2 && /(maintenant|aujourd.hui|je suis a|desormais|elle m.en prend|depuis)/.test(t), aide:"« … je suis à 1 h 20. » Deux chiffres, pas un." },
        { label:"Une tâche précise est nommée (mails, offre, stats, promo)", test:t=>/(mail|offre|devis|stat|promo|compte.rendu|relance)/.test(t), aide:"Un gain sur une tâche nommée vaut mieux qu'un gain « en général »." },
        { label:"Deux phrases maximum", test:t=>(t.match(/[.!?]/g)||[]).length<=3, aide:"C'est une ouverture, pas un rapport." }

      conseil:"Si vous n'avez pas mesuré, dites-le honnêtement (« j'estime ») plutôt que d'arrondir vers le haut. Jasper détecte l'exagération, et c'est exactement ce qu'il craint de l'IA." },
    { type:"classify", title:"À dire, à ne pas dire",
      intro:"Devant Jasper, quelles phrases sont vraies et utiles, lesquelles sont fausses ou risquées ?",

/* s1 — base : 0-6 */
{ c:"base", d:1, q:"Quand une IA comme ChatGPT répond, elle…", o:["Cherche la réponse dans une base de connaissances vérifiée","Compose une suite de mots plausible à partir de ce qu'elle a appris","Interroge internet à chaque fois","Demande à un humain chez OpenAI"], a:1, e:"Elle prédit les mots les plus probables. Le plausible et le vrai coïncident souvent, pas toujours." },
{ c:"base", d:1, q:"On appelle « hallucination »…", o:["Un bug rare qui arrive quand le serveur est saturé","Une réponse inventée, donnée avec la même assurance qu'une réponse juste","Une réponse trop longue","Le fait que l'IA refuse de répondre"], a:1, e:"Ce n'est pas un bug, c'est une propriété du fonctionnement. On l'encadre, on ne l'élimine pas." },
{ c:"base", d:2, q:"Vous demandez à ChatGPT le CA moyen d'un client trade chez Planet Line sans rien déposer. Il répond « environ 42 000 € ». Ce chiffre est…", o:["Une estimation basée sur des données du secteur","Probablement issu de conversations précédentes","Une invention plausible : il n'a aucune donnée de votre entreprise","Fiable si vous lui demandez sa source"], a:2, e:"Sans données fournies, tout chiffre propre à votre entreprise est fabriqué. Demander la source produira une justification tout aussi inventée." },
{ c:"base", d:2, q:"Dans ChatGPT tel que vous l'utilisez, l'IA voit…", o:["Votre boîte Outlook","Business Central","Le serveur de fichiers","Uniquement ce que vous collez ou déposez dans la conversation"], a:3, e:"Sans connecteur — un autre produit, un autre contrat — l'IA ne voit que la conversation." },
{ c:"base", d:1, q:"Quel signal doit vous alerter dans une réponse d'IA ?", o:["Elle est courte","Elle cite une source précise que vous ne pouvez pas ouvrir","Elle pose une question","Elle propose plusieurs options"], a:1, e:"Une source nommée, un chiffre précis, un ton d'autorité sur un sujet propre à votre entreprise : ce sont les tells d'une invention." },
{ c:"base", d:2, q:"Ce que vous pouvez prendre tel quel sans vérifier :", o:["Une référence de pièce","Une date d'obligation réglementaire","La structure et le style d'un mail reformulé","Un montant calculé sans méthode affichée"], a:2, e:"Le style, la structure, les idées : pas de vérification. Tout ce qui est vérifiable (chiffre, date, référence, règle) doit l'être." },
{ c:"base", d:3, q:"L'IA affirme : « Le barème FEDA 2024 fixe la RFA grossiste à 3,5 % ». Réaction correcte ?", o:["Noter 3,5 %","Vérifier si ce barème existe avant tout usage — et en pratique, il n'existe pas sous cette forme","Demander à l'IA le lien vers le barème","Utiliser 3,5 % comme point de départ de négociation"], a:1, e:"Un barème précis sur vos conditions commerciales est un signal d'alerte typique. Vos RFA sont dans vos contrats, nulle part ailleurs." },
/* s2 — prompt : 7-13 */
{ c:"prompt", d:1, q:"Les quatre éléments d'un prompt qui marche :", o:["Politesse, question, merci, signature","Rôle, contexte, format, contrainte","Sujet, longueur, langue, date","Objectif, budget, délai, responsable"], a:1, e:"Rôle (qui répond), contexte (ce qu'elle ne peut pas deviner), format (ce que vous voulez recevoir), contrainte (ce qu'il ne faut pas faire)." },
{ c:"prompt", d:2, q:"L'élément le plus souvent oublié, et qui fait la plus grande différence :", o:["Le rôle","Le contexte","Le format","La politesse"], a:1, e:"Sans contexte, l'IA produit une réponse générique valable pour n'importe quelle entreprise." },
{ c:"prompt", d:1, q:"« N'invente aucun chiffre ; si une information manque, pose-moi la question. » C'est…", o:["Un rôle","Un contexte","Un format","Une contrainte"], a:3, e:"Et c'est la contrainte à mettre dans presque tous vos prompts professionnels." },
{ c:"prompt", d:2, q:"Vous obtenez de bons résultats après 10 relances. Le problème :", o:["Aucun, c'est normal","La première demande était incomplète : un prompt complet divise les échanges par trois","L'IA est lente","Il faut changer d'outil"], a:1, e:"Ce n'est pas le nombre de relances qui fait la qualité, c'est la première demande." },
{ c:"prompt", d:2, q:"« Fais-moi un argumentaire pour une gamme d'ampoules LED. » Il manque surtout…", o:["Le rôle","Le format","Le contexte : quelle gamme, quel prix, quel client, quelle concurrence","Rien, c'est suffisant"], a:2, e:"Rôle et format manquent aussi, mais le contexte est ce qui rend le résultat vôtre au lieu de générique." },
{ c:"prompt", d:1, q:"Pour obtenir un tableau à trois colonnes, vous devez…", o:["Le demander explicitement dans le prompt","Le reformater vous-même après","Utiliser un outil spécial","Poser la question deux fois"], a:0, e:"Le format se demande. Sans ça, vous recevez de la prose." },
{ c:"prompt", d:3, q:"Votre meilleur résultat (visuels de présentoir) a marché grâce à un « prompt clair ». Ce qui l'a rendu clair, probablement :", o:["Il était court","Il décrivait précisément ce que vous vouliez voir — contexte et format","Il était poli","Il était en anglais"], a:1, e:"Ce qui a marché par instinct doit devenir une méthode : contexte et format explicites, à chaque fois." },
/* s3 — data : 14-20 */
{ c:"data", d:1, q:"Avec un abonnement ChatGPT individuel, vos conversations…", o:["Ne quittent jamais votre ordinateur","Peuvent servir à améliorer le modèle, sauf si vous désactivez l'option dans les paramètres","Sont automatiquement supprimées après 24 h","Sont lues par votre entreprise"], a:1, e:"Paramètres → Contrôles des données → « Améliorer le modèle pour tous ». À désactiver." },
{ c:"data", d:1, q:"Dans la charte de Planet Line, « rouge » désigne…", o:["Ce qu'on colle tel quel","Ce qu'on anonymise","Ce qui ne sort jamais : tarifs, marges, RH, contrats, accès","Les mails urgents"], a:2, e:"Vert : tel quel. Orange : anonymiser. Rouge : jamais." },
{ c:"data", d:2, q:"L'export CA RFA avec noms de clients et montants, c'est…", o:["Vert","Orange : anonymiser (colonne client codée) avant de déposer","Rouge","Sans importance"], a:1, e:"Une colonne « Client » remplacée par des codes suffit. Nico peut sortir l'export déjà codé." },
{ c:"data", d:1, q:"Anonymiser, concrètement, c'est…", o:["Supprimer tout le contenu sensible","Remplacer les valeurs (noms, montants, taux) par des étiquettes, en gardant la structure","Écrire en anglais","Utiliser un autre compte"], a:1, e:"« Ets Durand » → « Client A », « 6 % » → « [TAUX] ». L'IA travaille aussi bien avec des étiquettes." },
{ c:"data", d:2, q:"Ce que les offres entreprise (ChatGPT Business, Copilot M365) apportent principalement :", o:["Un modèle plus intelligent","L'engagement contractuel de ne pas entraîner sur vos données","Des réponses plus rapides","La connexion automatique à l'ERP"], a:1, e:"C'est la raison principale de leur existence, et la réponse à l'objection de Jasper sur les données." },
{ c:"data", d:2, q:"Un identifiant Business Central pour que l'IA « aille voir » :", o:["Vert, c'est pratique","Orange","Rouge : les accès ne sortent jamais, et l'IA n'irait voir nulle part","Ça dépend de l'outil"], a:2, e:"Deux erreurs en une : un accès est rouge, et ChatGPT ne se connecte pas à un ERP." },
{ c:"data", d:3, q:"Pourquoi la charte existe-t-elle ?", o:["Pour interdire l'IA","Pour que la réponse à « et si ça fuite ? » ne dépende pas de la bonne volonté de chacun","Pour l'assurance","Parce que c'est obligatoire"], a:1, e:"Une règle écrite protège mieux qu'une prudence individuelle, parce que tout le monde finit par oublier une fois." },

{ c:"mail", d:1, q:"Pour copier plusieurs mails d'Outlook vers ChatGPT :", o:["Les ouvrir un par un","Sélectionner (clic, Maj + clic), Ctrl + C, coller","Les transférer à une adresse spéciale","Faire une capture d'écran"], a:1, e:"Outlook colle expéditeur, objet et début du corps. Ça suffit pour trier." },
{ c:"mail", d:2, q:"Le prompt de tri doit contenir…", o:["Seulement « trie mes mails »","Vos priorités, des catégories fixes, un format tableau avec action, et l'interdiction de déduire","La liste de vos clients","Votre mot de passe Outlook"], a:1, e:"Sans priorités, l'IA trie par urgence apparente. Sans catégories fixes, elle en invente." },
{ c:"mail", d:2, q:"Le tri classe un grossiste en renégociation en « Info seulement ». Vous…", o:["Concluez que l'outil n'est pas fiable","Corrigez et ajoutez une ligne dans le prompt : ce client est prioritaire ce mois-ci","Demandez à l'IA pourquoi","Abandonnez le tri"], a:1, e:"L'IA ne pouvait pas savoir. Le tri s'améliore en enrichissant le contexte, pas en discutant." },
{ c:"mail", d:1, q:"Le prompt de tri, vous le…", o:["Retapez chaque matin","Gardez dans un fichier prompts.txt et le collez chaque jour","Mémorisez","Demandez à l'IA de s'en souvenir"], a:1, e:"Un prompt réutilisé ne doit jamais être retapé. La mémoire de l'IA n'est pas fiable pour ça." },
{ c:"mail", d:2, q:"Copilot dans Outlook fait le tri sans copier-coller. Avantage supplémentaire :", o:["Il est gratuit","Les mails ne sortent pas de Microsoft","Il envoie les réponses tout seul","Il lit aussi l'agenda papier"], a:1, e:"C'est l'un des arguments concrets du chantier entreprise. Il n'envoie rien tout seul, et ne lit pas le papier." },
/* s5 — mail : 27-31 */
{ c:"mail", d:1, q:"Un « Projet » dans ChatGPT, c'est…", o:["Une conversation plus longue","Un dossier avec instructions permanentes et fichiers, que chaque conversation reprend","Un abonnement supplémentaire","Un mode de partage"], a:1, e:"Tout ce que vous y écrivez démarre avec ce contexte, sans le recoller." },
{ c:"mail", d:2, q:"Pour que l'IA écrive dans votre ton, le plus efficace :", o:["Décrire votre ton en dix lignes","Joindre 3 ou 4 de vos vrais mails bien écrits, anonymisés","Lui demander d'être professionnel","Écrire en majuscules"], a:1, e:"L'IA imite bien mieux qu'elle ne suit des consignes abstraites. Trois exemples valent dix lignes." },
{ c:"mail", d:1, q:"Le brouillon dit « nous vous livrerons sous 48 h ». Vous n'avez rien écrit sur le délai.", o:["C'est notre délai habituel, je laisse","Je supprime et je rends la règle anti-promesse permanente dans le projet","Je demande à l'IA de confirmer","Je change de projet"], a:1, e:"Le délai « habituel » est ce que l'IA a inventé à partir du vraisemblable. L'IA ne sait rien de votre logistique." },
{ c:"mail", d:1, q:"L'IA peut-elle envoyer le mail à votre place ?", o:["Oui dans ChatGPT","Oui dans Copilot","Non, ni l'un ni l'autre : vous relisez et cliquez toujours","Oui si vous l'autorisez"], a:2, e:"Et c'est une bonne chose — c'est la réponse à l'objection de Jasper sur les erreurs." },
{ c:"mail", d:2, q:"Un mail écrit sous le coup de l'agacement, comme exemple de style dans le projet :", o:["Bon exemple, c'est authentique","À exclure : l'IA reproduira le ton","Bon exemple si anonymisé","Sans effet"], a:1, e:"Choisissez des mails que vous trouvez bien écrits. L'IA reproduit ce qu'elle voit." },
/* s6 — mail : 32-35 */
{ c:"mail", d:1, q:"Après une réunion, le geste proposé :", o:["Rédiger le compte-rendu à la main le soir","Dicter en vrac au téléphone dans les 10 minutes, faire structurer, relire","Demander à l'IA de deviner ce qui s'est dit","Ne rien noter"], a:1, e:"Deux minutes de dictée, trente secondes de structuration, une relecture. Le compte-rendu existe." },

{ c:"mail", d:3, q:"Pourquoi le compte-rendu dicté est un bon usage à montrer à Jasper ?", o:["C'est rapide","Il n'y a rien à inventer : l'IA ne fait que ranger vos propres mots","Ça fait moderne","Ça remplace les réunions"], a:1, e:"Un usage sans invention possible répond directement à sa peur des erreurs." },

/* ===================== 2. ÉTAT ===================== */
const KEY = "iabureau_renaud_v1";
const SYNC_KEY = "iabureau_sync_cfg";
const SYNC_USER = "renaud";
const DEF = { xp:0, streak:0, lastDay:null, catScore:{}, chaptersDone:[], boxes:{}, examBest:0, badges:[], days:{}, ex:{}, drafts:{}, updatedAt:0 };
let S = load(); let storageOK = true;
function load(){ try{ return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){ storageOK=false; return Object.assign({},DEF); } }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK=true; }catch(e){ storageOK=false; } schedulePush(); }
function probeStorage(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storageOK=true; }catch(e){ storageOK=false; } }
function level(){ return Math.floor(S.xp/100)+1; }
function addXP(n){ S.xp+=n; save(); syncHeader(); }
function award(b){ if(!S.badges.includes(b)){ S.badges.push(b); save(); toast("🏅 "+b); } }
function touchStreak(){ const t=new Date().toDateString(); if(S.lastDay!==t){ const y=new Date(Date.now()-864e5).toDateString(); S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=t; saveLocal(); } }
function exDone(id){ return !!(S.ex&&S.ex[id]); }
function markEx(id){ if(!S.ex) S.ex={}; if(!S.ex[id]){ S.ex[id]=true; save(); addXP(15); toast("✅ Cas pratique validé · +15 XP"); } }

/* utilitaires */
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`´]/g,"'");
const shuffled=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
function go(v,...a){ window.scrollTo(0,0); v(...a); }
function syncHeader(){
  const done=Object.keys(S.days).length;
  document.getElementById("stats").innerHTML=
    `<span class="pill">Niveau <b>${level()}</b></span><span class="pill"><b>${S.xp}</b> XP</span><span class="pill">🔥 <b>${S.streak}</b></span><span class="pill">📅 <b>${done}</b>/12</span>`;
}
function setSyncStatus(t){ document.getElementById("syncstatus").textContent=t; }

/* ===================== 3. VUES ===================== */
function home(){
  const done=Object.keys(S.days).length;
  const nxt=PROG.find(p=>!S.days[p.id]);
  let h="";
  if(!storageOK) h+=`<div class="warn">⚠️ Le navigateur bloque la sauvegarde. Votre progression sera perdue en fermant l'onglet. Ouvrez l'app depuis l'adresse en ligne, ou exportez régulièrement.</div>`;
  h+=`<div class="card"><h2>${nxt?`Prochaine séance : ${nxt.num}. ${esc(nxt.t)}`:"Parcours terminé"}</h2>
    <p class="muted" style="margin:0 0 12px">${nxt?esc(nxt.obj):"Les 12 séances sont validées. Le mode Examen mesure ce qui reste."}</p>
    <div class="bar"><i style="width:${Math.round(done/12*100)}%"></i></div>
    <div class="row">${nxt?`<button class="btn" id="go-next">${nxt.icon} ${S.ex[nxt.id+"-0"]||S.ex[nxt.id+"-m"]?"Reprendre":"Commencer"} · ${nxt.dur}</button>`:""}<button class="btn ghost" id="go-prog">Toutes les séances</button></div></div>`;
  h+=`<div class="grid">
    <div class="mode" id="m-prog"><div class="ic">📅</div><b>Programme</b><span>12 séances de 30 min, dans l'ordre, à votre rythme.</span></div>
    <div class="mode" id="m-quiz"><div class="ic">🎯</div><b>Quiz par thème</b><span>Vérifier ce qui est retenu, thème par thème.</span></div>
    <div class="mode" id="m-cards"><div class="ic">🃏</div><b>Flashcards</b><span>12 mots à tenir. Les faibles reviennent d'abord.</span></div>
    <div class="mode" id="m-fiches"><div class="ic">📖</div><b>Fiches</b><span>Tout le contenu, à relire d'une traite.</span></div>
    <div class="mode" id="m-missions"><div class="ic">🛠️</div><b>Missions terrain</b><span>Le vrai travail, sur vos vrais dossiers. ${Object.keys(S.ex).filter(k=>k.endsWith("-m")).length}/12 faites.</span></div>
    <div class="mode" id="m-prompts"><div class="ic">📋</div><b>Mes prompts</b><span>Les modèles à copier dans prompts.txt.</span></div>
  </div>`;
  if(S.badges.length) h+=`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Badges</h3>${S.badges.map(b=>`<span class="tag done">🏅 ${esc(b)}</span>`).join(" ")}</div>`;
  app.innerHTML=h;
  if(nxt) document.getElementById("go-next").onclick=()=>go(session,nxt.id);
  document.getElementById("go-prog").onclick=()=>go(program);
  document.getElementById("m-prog").onclick=()=>go(program);
  document.getElementById("m-quiz").onclick=()=>go(quizMenu);
  document.getElementById("m-cards").onclick=()=>go(cards);
  document.getElementById("m-fiches").onclick=()=>go(fiches);
  document.getElementById("m-missions").onclick=()=>go(missions);
  document.getElementById("m-prompts").onclick=()=>go(prompts);
}

function program(){
  let h=`<div class="card"><h2>Le programme</h2><p class="muted small" style="margin:0">Une séance = une notion, un geste dans votre outil, un résultat analysé ici, une chose à faire avant la suivante. Les séances se débloquent dans l'ordre.</p></div>`;
  PROG.forEach((p,i)=>{
    const done=!!S.days[p.id], locked=i>0&&!S.days[PROG[i-1].id];
    const nEx=p.prac.length, nOk=p.prac.filter((_,k)=>exDone(p.id+"-"+k)).length;
    h+=`<div class="lvl ${done?"done":""} ${locked?"locked":""}" data-id="${p.id}"><div class="num">${done?"✓":p.num}</div><div class="ti">${p.icon} ${esc(p.t)}<small>${esc(p.obj)}</small><small>${p.dur} · ${nOk}/${nEx} cas pratiques · mission ${exDone(p.id+"-m")?"faite":"à faire"}</small></div></div>`;
    if(i<PROG.length-1) h+=`<div class="connector"></div>`;
  });
  h+=`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  app.innerHTML=h;
  document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".lvl:not(.locked)").forEach(el=>el.onclick=()=>go(session,el.dataset.id));
}

function session(id){
  const p=PROG.find(x=>x.id===id); const idx=PROG.indexOf(p);
  const nOk=p.prac.filter((_,k)=>exDone(p.id+"-"+k)).length, all=nOk===p.prac.length, mOk=exDone(p.id+"-m");
  let h=`<div class="card"><span class="tag">Séance ${p.num}</span><span class="tag">${p.dur}</span><span class="tag">${CATS[p.cat].icon} ${CATS[p.cat].name}</span>
    <h2 style="margin-top:10px">${p.icon} ${esc(p.t)}</h2><p class="muted" style="margin:0">${esc(p.obj)}</p></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">La notion · 8 min</h3><div class="lesson">${p.lesson.map(x=>`<p>${x}</p>`).join("")}</div></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">Cas pratiques · 20 min <span class="muted small">(${nOk}/${p.prac.length})</span></h3><div id="pracs"></div></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">Vérifier</h3><p class="muted small" style="margin:0 0 10px">${p.qids.length} questions sur cette séance.</p><button class="btn ghost sm" id="sq">🎯 Lancer les questions</button></div>`;
  h+=`<div class="card" style="border-color:var(--gold)"><h3 style="margin-top:0">🛠️ Mission terrain <span class="muted small">— sur vos vrais dossiers, hors de l'app</span></h3><div id="mission"></div></div>`;
  h+=`<div class="row"><button class="btn ghost" id="back">← Programme</button>${all&&mOk&&!S.days[p.id]?`<button class="btn gold" id="finish">Valider la séance · +30 XP</button>`:(!S.days[p.id]?`<span class="tag">${all?"Mission terrain à faire pour valider":"Cas pratiques et mission à terminer"}</span>`:"")}${S.days[p.id]?`<span class="tag done">Séance validée</span>`:""}${idx<PROG.length-1&&S.days[p.id]?`<button class="btn" id="nx">Séance suivante →</button>`:""}</div>`;
  app.innerHTML=h;
  const box=document.getElementById("pracs");
  p.prac.forEach((pr,k)=>{ const d=document.createElement("div"); d.className="card"; d.style.background="#16223a"; box.appendChild(d); renderPrac(d,pr,p.id+"-"+k,()=>go(session,id)); });
  const mEl=document.getElementById("mission"); const m=Object.assign({type:"write"},p.mission);
  renderPrac(mEl,m,p.id+"-m",()=>go(session,id));
  document.getElementById("back").onclick=()=>go(program);
  document.getElementById("sq").onclick=()=>go(quiz,p.qids,"Séance "+p.num,()=>go(session,id));
  const f=document.getElementById("finish"); if(f) f.onclick=()=>{ S.days[p.id]=true; save(); addXP(30); award("Séance "+p.num); if(Object.keys(S.days).length===12) award("Parcours complet"); go(session,id); };
  const n=document.getElementById("nx"); if(n) n.onclick=()=>go(session,PROG[idx+1].id);
}

/* ---------- moteur de cas pratiques ---------- */
function renderPrac(el,p,id,refresh){
  const done=exDone(id);
  const head=`<h3 style="margin-top:0">${done?"✅ ":""}${esc(p.title)}</h3><p class="small" style="white-space:pre-wrap;margin:0 0 10px">${esc(p.intro||p.situation||"")}</p>`;
  const R={order,classify,calc,scenario,write,compare}[p.type]; R(el,p,id,head,refresh);
}
function order(el,p,id,head,refresh){
  let cur=shuffled(p.steps); if(cur.join()===p.steps.join()) cur=[...p.steps].reverse();
  let checked=false;
  function draw(){
    el.innerHTML=head+cur.map((s,i)=>`<div class="step ${checked?(s===p.steps[i]?"ok":"ko"):""}"><div class="tx">${i+1}. ${esc(s)}</div><div class="ar"><button data-i="${i}" data-d="-1">▲</button><button data-i="${i}" data-d="1">▼</button></div></div>`).join("")
      +`<div class="row"><button class="btn sm" id="chk">Vérifier l'ordre</button>${checked&&cur.join()!==p.steps.join()?`<button class="btn ghost sm" id="sol">Voir la solution</button>`:""}</div><div id="res"></div>`;
    el.querySelectorAll(".ar button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i,j=i+ +b.dataset.d; if(j<0||j>=cur.length) return; [cur[i],cur[j]]=[cur[j],cur[i]]; checked=false; draw(); });
    el.querySelector("#chk").onclick=()=>{ checked=true; const ok=cur.join()===p.steps.join(); draw(); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?"Ordre correct.":"Les lignes en rouge ne sont pas à leur place. Réfléchissez à ce qui doit précéder quoi, puis revérifiez."}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
    const s=el.querySelector("#sol"); if(s) s.onclick=()=>{ cur=[...p.steps]; checked=true; draw(); };
  }
  draw();
}
function classify(el,p,id,head,refresh){
  const sel={}; let checked=false;
  function draw(){
    el.innerHTML=head+p.items.map((it,i)=>`<div class="cls ${checked?(sel[i]===it.a?"ok":"ko"):""}"><div class="tx">${esc(it.t)}</div><div class="bk">${p.buckets.map((b,j)=>`<button data-i="${i}" data-j="${j}" class="${sel[i]===j?"sel":""}">${esc(b)}</button>`).join("")}</div></div>`).join("")
      +`<div class="row"><button class="btn sm" id="chk">Vérifier</button></div><div id="res"></div>`;
    el.querySelectorAll(".bk button").forEach(b=>b.onclick=()=>{ sel[b.dataset.i]=+b.dataset.j; checked=false; draw(); });
    el.querySelector("#chk").onclick=()=>{ if(Object.keys(sel).length<p.items.length){ toast("Classez tous les éléments"); return; } checked=true; const n=p.items.filter((it,i)=>sel[i]===it.a).length; draw(); const ok=n===p.items.length; el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${n}/${p.items.length} bien classés.${ok?"":" Les rouges : relisez la notion, corrigez, revérifiez."}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
  }
  draw();
}
function calc(el,p,id,head,refresh){
  el.innerHTML=head+`<p style="margin:0 0 8px"><b>${esc(p.question)}</b></p><input type="number" step="any" id="v" placeholder="Votre réponse"><div class="row"><button class="btn sm" id="chk">Vérifier</button></div><div id="res"></div>`;
  el.querySelector("#chk").onclick=()=>{ const v=parseFloat(String(el.querySelector("#v").value).replace(",",".")); const ok=!isNaN(v)&&Math.abs(v-p.answer)<=(p.tol||0)+1e-9; el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?`Juste : ${p.answer}.`:`Pas ça. ${esc(p.hint)}`}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,900);} };
}
function scenario(el,p,id,head,refresh){
  el.innerHTML=head+p.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")+`<div id="res"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, ok=i===p.a; el.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(j===p.a) x.classList.add("correct"); else if(j===i) x.classList.add("wrong"); else x.classList.add("dim"); }); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${esc(p.e)}</div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,1200);} else { el.querySelector("#res").innerHTML+=`<div class="row"><button class="btn ghost sm" id="re">Réessayer</button></div>`; el.querySelector("#re").onclick=()=>scenario(el,p,id,head,refresh); } });
}
function compare(el,p,id,head,refresh){
  el.innerHTML=head+`<p class="small muted" style="margin:0">Cliquez sur la réponse à ne pas utiliser.</p><div class="cmp"><div class="rep" data-i="0"><b>Réponse A</b>${esc(p.a)}</div><div class="rep" data-i="1"><b>Réponse B</b>${esc(p.b)}</div></div><div id="res"></div>`;
  el.querySelectorAll(".rep").forEach(r=>r.onclick=()=>{ const i=+r.dataset.i, ok=i===p.bad; el.querySelectorAll(".rep").forEach((x,j)=>{ x.onclick=null; x.classList.add(j===p.bad?"bad":"good"); }); el.querySelector("#res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${ok?"Bien vu. ":"Non — c'est l'autre. "}${esc(p.why)}</div><div class="expl" style="margin-top:8px"><b>Les indices :</b><ul style="margin:6px 0 0 18px;padding:0">${p.tells.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`; if(ok){ markEx(id); refresh&&setTimeout(refresh,1500);} else { el.querySelector("#res").innerHTML+=`<div class="row"><button class="btn ghost sm" id="re">Réessayer</button></div>`; el.querySelector("#re").onclick=()=>compare(el,p,id,head,refresh); } });
}
function write(el,p,id,head,refresh){
  el.innerHTML=head+`<textarea id="ta" placeholder="Écrivez ici. Votre brouillon est conservé.">${esc(S.drafts[id]||"")}</textarea><div class="row"><button class="btn sm" id="chk">Analyser mon texte</button><span class="small muted">${p.criteres.length} critères · ${Math.ceil(p.criteres.length*0.75)} suffisent</span></div><div id="res"></div>`;
  const ta=el.querySelector("#ta"); ta.oninput=()=>{ S.drafts[id]=ta.value; saveLocal(); };
  el.querySelector("#chk").onclick=()=>{
    const txt=ta.value.trim(); if(txt.length<20){ toast("Écrivez d'abord quelques lignes"); return; }
    const t=nz(txt); const res=p.criteres.map(c=>({c,ok:!!c.test(t)})); const ok=res.filter(r=>r.ok).length, n=res.length, seuil=Math.ceil(n*0.75);
    el.querySelector("#res").innerHTML=`<div style="margin-top:12px">${res.map(r=>`<div class="crit"><div class="mk">${r.ok?"✅":"⬜"}</div><div>${esc(r.c.label)}${r.ok?"":`<span class="aide">${esc(r.c.aide)}</span>`}</div></div>`).join("")}</div>
      <div class="expl ${ok>=seuil?"ok":"ko"}">${ok}/${n} critères. ${ok>=seuil?"Validé.":"Complétez les critères manquants, puis relancez l'analyse."}</div>
      <h3>Un modèle, pour comparer</h3><div class="modele">${esc(p.modele)}</div>${p.conseil?`<div class="expl" style="margin-top:10px">💡 ${esc(p.conseil)}</div>`:""}`;
    if(ok>=seuil){ markEx(id); refresh&&setTimeout(refresh,2500); }
  };
}

/* ---------- quiz ---------- */
function quizMenu(){
  let h=`<div class="card"><h2>Quiz par thème</h2><p class="muted small" style="margin:0">8 questions au hasard par thème. 80 % de bonnes réponses = badge du thème.</p></div><div class="grid">`;
  Object.entries(CATS).forEach(([k,c])=>{ const n=Q.filter(q=>q.c===k).length, sc=S.catScore[k]; h+=`<div class="mode" data-c="${k}"><div class="ic">${c.icon}</div><b>${esc(c.name)}</b><span>${n} questions${sc!=null?` · meilleur ${sc} %`:""}</span></div>`; });
  h+=`</div><div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;
  app.innerHTML=h; document.getElementById("back").onclick=()=>go(home);
  document.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{ const k=m.dataset.c; const ids=shuffled(Q.filter(q=>q.c===k).map(q=>q.id)).slice(0,8); go(quiz,ids,CATS[k].name,()=>go(quizMenu),k); });
}
function quiz(ids,title,back,cat){
  let i=0, score=0, order_=[...ids];
  function step(){
    if(i>=order_.length){ const pct=Math.round(score/order_.length*100); if(cat){ S.catScore[cat]=Math.max(S.catScore[cat]||0,pct); save(); if(pct>=80) award(CATS[cat].name); } app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${score}/${order_.length}</div><p>${pct>=80?"Solide.":pct>=60?"Ça tient. Relisez les explications ratées.":"Reprenez la fiche du thème avant de relancer."}</p><div class="row" style="justify-content:center"><button class="btn" id="again">Recommencer</button><button class="btn ghost" id="bk">Retour</button></div></div>`; document.getElementById("again").onclick=()=>go(quiz,shuffled(ids),title,back,cat); document.getElementById("bk").onclick=back; return; }
    const q=Q[order_[i]];
    app.innerHTML=`<div class="card"><div class="row" style="margin:0 0 10px;justify-content:space-between"><span class="tag">${esc(title)} · ${i+1}/${order_.length}</span><span class="tag">${CATS[q.c].icon} ${"●".repeat(q.d)}</span></div><div class="bar"><i style="width:${Math.round(i/order_.length*100)}%"></i></div><h2 style="margin-top:16px;font-size:17px">${esc(q.q)}</h2>${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}<div id="res"></div></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const j=+b.dataset.j, ok=j===q.a; if(ok){score++; addXP(10);} bumpBox(q.id,ok); document.querySelectorAll(".opt").forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("correct"); else if(k===j) x.classList.add("wrong"); else x.classList.add("dim"); }); document.getElementById("res").innerHTML=`<div class="expl ${ok?"ok":"ko"}">${esc(q.e)}</div><div class="row"><button class="btn" id="nx">${i+1<order_.length?"Suivante →":"Résultat"}</button></div>`; document.getElementById("nx").onclick=()=>{ i++; step(); }; });
  }
  step();
}
/* ---------- flashcards ---------- */
function bumpBox(id,ok){ const k="q"+id; S.boxes[k]=ok?Math.min(5,(S.boxes[k]||1)+1):1; save(); }
function cards(){
  const deck=CARDS.map((f,i)=>({f,i})).sort((a,b)=>((S.boxes["c"+a.i]||1)-(S.boxes["c"+b.i]||1))||Math.random()-0.5);
  let i=0, flipped=false;
  function draw(){
    if(i>=deck.length){ app.innerHTML=`<div class="card" style="text-align:center"><h2>Série terminée</h2><p class="muted">Les cartes ratées reviendront en premier la prochaine fois.</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Nouvelle série</button><button class="btn ghost" id="bk">← Accueil</button></div></div>`; document.getElementById("ag").onclick=()=>go(cards); document.getElementById("bk").onclick=()=>go(home); return; }
    const c=deck[i]; const lv=S.boxes["c"+c.i]||1;
    app.innerHTML=`<div class="row" style="margin:0 0 10px;justify-content:space-between"><span class="tag">Carte ${i+1}/${deck.length}</span><span class="tag">maîtrise ${lv}/5${lv>=4?" · acquise":""}</span></div><div class="fc" id="fc">${flipped?esc(c.f.b):`<b>${esc(c.f.f)}</b>`}<small>${flipped?"":"Toucher pour retourner"}</small></div>
      ${flipped?`<div class="row"><button class="btn ghost" id="no">Je ne savais pas</button><button class="btn" id="yes">Je savais · +5 XP</button></div>`:`<div class="row"><button class="btn ghost" id="bk">← Accueil</button></div>`}`;
    document.getElementById("fc").onclick=()=>{ flipped=!flipped; draw(); };
    const y=document.getElementById("yes"), n=document.getElementById("no"), b=document.getElementById("bk");
    if(y) y.onclick=()=>{ S.boxes["c"+c.i]=Math.min(5,lv+1); addXP(5); i++; flipped=false; draw(); };
    if(n) n.onclick=()=>{ S.boxes["c"+c.i]=1; save(); i++; flipped=false; draw(); };
    if(b) b.onclick=()=>go(home);
  }
  draw();
}

/* ---------- fiches ---------- */

  app.innerHTML=`<div class="card"><h2>Fiches</h2><p class="muted small" style="margin:0">Une par thème. Le contenu du parcours, condensé.</p></div>`+CHAPTERS.map(c=>`<div class="lvl ${S.chaptersDone.includes(c.id)?"done":""}" data-id="${c.id}"><div class="num">${c.icon}</div><div class="ti">${esc(c.t)}<small>${c.lesson.length} paragraphes</small></div></div><div class="connector"></div>`).join("")+`<div class="row"><button class="btn ghost" id="back">← Accueil</button></div>`;

function fiche(id){

  document.getElementById("q").onclick=()=>{ const ids=shuffled(Q.filter(q=>q.c===c.cat).map(q=>q.id)).slice(0,8); go(quiz,ids,c.t,()=>go(fiche,id),c.cat); };
  const n=document.getElementById("nx"); if(n) n.onclick=()=>go(fiche,CHAPTERS[i+1].id);

/* ===================== 4. SYNC ===================== */
let CFG=(()=>{ try{ return Object.assign({url:"",token:"",auto:true},JSON.parse(localStorage.getItem(SYNC_KEY))||{}); }catch(e){ return {url:"",token:"",auto:true}; } })();
const syncConfigured=()=>!!(CFG.url&&CFG.token);
async function cloudLoad(){ const u=CFG.url+(CFG.url.includes("?")?"&":"?")+"action=load&user="+SYNC_USER+"&token="+encodeURIComponent(CFG.token)+"&_="+Date.now(); const j=await (await fetch(u,{method:"GET",redirect:"follow"})).json(); if(!j.ok) throw new Error(j.error||"refus"); return j.data||null; }
async function cloudSave(){ const j=await (await fetch(CFG.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",user:SYNC_USER,token:CFG.token,data:S})})).json(); if(!j.ok) throw new Error(j.error||"refus"); }
let pushT; function schedulePush(){ if(!syncConfigured()||!CFG.auto) return; clearTimeout(pushT); pushT=setTimeout(async()=>{ try{ await cloudSave(); setSyncStatus("☁️ synchronisé "+hhmm()); }catch(e){ setSyncStatus("☁️ échec (hors ligne ?)"); } },1500); }
function hasProgress(o){ return !!(o&&((o.xp||0)>0||Object.keys(o.days||{}).length||Object.keys(o.ex||{}).length)); }
async function syncOnStart(){ if(!syncConfigured()) return setSyncStatus("☁️ sync non configurée"); try{ const d=await cloudLoad(); const remote=d&&d.updatedAt?d.updatedAt:0, local=S.updatedAt||0; if(d&&hasProgress(d)&&(remote>local||!hasProgress(S))){ S=Object.assign({},DEF,d); saveLocal(); syncHeader(); go(home); toast("☁️ Progression chargée"); } else if(hasProgress(S)&&(!d||local>remote)){ await cloudSave(); } setSyncStatus("☁️ synchronisé "+hhmm()); }catch(e){ setSyncStatus("☁️ hors ligne"); } }
function cfgView(){
  app.innerHTML=`<div class="card"><h2>Synchronisation</h2><p class="muted small">Même progression sur le PC du bureau et sur l'iPhone. Collez l'adresse et le code donnés par Thomas. Une fois, puis c'est automatique.</p>
    <label class="small muted">Adresse du script</label><input type="url" id="u" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="small muted" style="display:block;margin-top:10px">Code</label><input type="text" id="t" value="${esc(CFG.token)}" placeholder="le code reçu">
    <div class="row"><button class="btn" id="sv">Enregistrer</button><button class="btn ghost" id="test">Tester la connexion</button></div>
    <div class="row"><button class="btn ghost sm" id="ld">Charger depuis le cloud</button><button class="btn ghost sm" id="up">Envoyer vers le cloud</button></div><div id="res"></div>
    <div class="row"><button class="btn ghost" id="back">← Accueil</button></div></div>`;
  const R=m=>document.getElementById("res").innerHTML=`<div class="expl">${esc(m)}</div>`;
  const readCfg=()=>{ CFG.url=document.getElementById("u").value.trim(); CFG.token=document.getElementById("t").value.trim(); try{ localStorage.setItem(SYNC_KEY,JSON.stringify(CFG)); }catch(e){} };
  document.getElementById("sv").onclick=()=>{ readCfg(); toast("Enregistré"); syncOnStart(); };
  document.getElementById("test").onclick=async()=>{ readCfg(); try{ await cloudLoad(); R("Connexion OK."); }catch(e){ R("Échec : "+e.message+". Vérifiez l'adresse (elle finit par /exec) et le code."); } };
  document.getElementById("ld").onclick=async()=>{ readCfg(); try{ const d=await cloudLoad(); if(!d){ R("Rien dans le cloud pour l'instant."); return; } S=Object.assign({},DEF,d); saveLocal(); syncHeader(); R("Progression chargée."); }catch(e){ R("Échec : "+e.message); } };
