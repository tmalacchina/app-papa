<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gagner du temps — Sophie</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gagner du temps">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0f1726; --surface:#1b2740; --surface2:#223052; --txt:#eaf0fb; --muted:#9fb0cc;
  --line:#2c3c5e; --accent:#37a0e0; --gold:#f0c040; --teal2:#1D9E75; --red:#A32D2D; --amber:#BA7517;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1422,#14213a);color:var(--txt);line-height:1.5;margin:0;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 -16px 18px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(15,23,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700;cursor:pointer;padding:6px 0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
header h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.navback{flex:none;width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--txt);font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.navback:hover{border-color:var(--accent)}
.navback[hidden]{display:none}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.pill b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:18px 0 6px;font-size:15.5px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.gold{background:var(--gold);color:#1a1a1a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;margin:9px 0;font-size:14.5px;color:var(--txt);cursor:pointer;font-family:inherit;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:#16442f;border-color:var(--teal2)}
.opt.wrong{background:#4a1d1d;border-color:var(--red)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.expl{background:#11203a;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:14px;font-size:13.5px}
.expl.ok{border-left-color:var(--teal2)}
.expl.ko{border-left-color:var(--red)}
.bar{height:8px;background:#0c1322;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--accent));transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.18s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .ic{font-size:26px}
.mode b{display:block;margin-top:6px;font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.lvl:hover{border-color:var(--accent)}
.lvl.locked{opacity:.5;cursor:not-allowed}
.lvl .num{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lvl.done .num{background:linear-gradient(135deg,var(--teal2),var(--accent))}
.lvl .ti{flex:1}
.lvl .ti small{display:block;color:var(--muted);font-size:12.5px}
.connector{width:2px;height:14px;background:var(--line);margin-left:34px}
.lesson p{margin:0 0 12px;font-size:15px}
.lesson p:last-child{margin-bottom:0}
.lesson h3{font-size:15.5px;margin:22px 0 8px;color:var(--gold)}
.lesson p>h3:first-child{margin-top:0}
.lesson kbd{display:inline-block;background:#0c1322;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:13.5px;line-height:1.5;margin:0 1px}
.lesson code{background:#0c1322;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:Consolas,Menlo,monospace;font-size:13.5px}
.todo{background:#1a2d1f;border:1px solid var(--teal2);border-left-width:4px;border-radius:0 12px 12px 0;padding:12px 14px;margin:6px 0 4px;font-size:14.5px}
.todo::before{content:"✋ ";}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--muted);margin-right:6px}
.tag.done{background:#16442f;color:#8fe0bd}
textarea{width:100%;min-height:150px;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;line-height:1.5;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=url]{width:100%;background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px}
.crit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit .mk{flex:none;width:22px;text-align:center}
.crit .aide{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.modele{white-space:pre-wrap;background:#0c1322;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0}
.step .tx{flex:1;font-size:14.5px}
.step .ar{display:flex;flex-direction:column;gap:4px}
.step .ar button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:7px;width:30px;height:24px;cursor:pointer;font-size:12px}
.step.ok{background:#16442f}
.step.ko{background:#4a1d1d}
.cls{background:var(--surface2);border-radius:12px;padding:12px;margin:8px 0}
.cls .tx{font-size:14.5px;margin-bottom:8px}
.cls .bk{display:flex;gap:6px;flex-wrap:wrap}
.cls .bk button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:inherit;font-size:13px}
.cls .bk button.sel{border-color:var(--accent);background:#11304a}
.cls.ok{background:#16442f}
.cls.ko{background:#4a1d1d}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp .rep{background:#0c1322;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;cursor:pointer;line-height:1.5}
.cmp .rep:hover{border-color:var(--accent)}
.cmp .rep b{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.cmp .rep.bad{border-color:var(--red);background:#2a1414}
.cmp .rep.good{border-color:var(--teal2);background:#12301f}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 22px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-size:17px}
.fc small{color:var(--muted);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c1322;border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.footer-note{margin-top:30px;font-size:12.5px;color:var(--muted);text-align:center}
.footer-note a{color:var(--accent);cursor:pointer;text-decoration:none}
.warn{background:#3a2a10;border:1px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.big{font-size:32px;font-weight:700;color:var(--gold)}
.next{background:#11203a;border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:14px;font-size:14px}
.next b{color:var(--gold)}
@media(max-width:560px){
  .wrap{padding:0 calc(12px + env(safe-area-inset-left)) calc(50px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  header{margin:0 -12px 14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  header h1 small{font-size:11.5px}
  .grid{grid-template-columns:1fr}
  .btn{flex:1 1 auto;justify-content:center}
  .opt{font-size:15px;padding:13px}
  .cmp{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="backbtn" class="navback" aria-label="Retour" hidden>←</button>
    <h1 id="home-link">Gagner du temps <small>Parcours de Sophie · 13 séances · 13 missions</small></h1>
    <div class="stats" id="stats"></div>
  </header>
  <div id="app"></div>
  <div class="footer-note">
    <span id="syncstatus">☁️ sync non configurée</span> ·
    <a id="exportlink">exporter</a> · <a id="importlink">importer</a> · <a id="cfglink">synchro</a>
    <input type="file" id="importfile" accept="application/json" style="display:none">
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== DONNÉES — SOPHIE v2 ===================== */
const APP_NAME = "Gagner du temps";
const USER_NAME = "Sophie";

const CATS = {
  gestes: { name:"Gestes qui font gagner", icon:"⚡" },
  ia:     { name:"L'IA, bien utilisée",     icon:"🧠" },
  cadre:  { name:"Données et cadre",        icon:"🔒" },
  excel:  { name:"Excel",                   icon:"📊" },
  metier: { name:"Plannings et écrits",     icon:"🏠" },
  soi:    { name:"Pour soi",                icon:"🌱" }
};

const PROG = [
/* ═══════════════════════ SÉANCE 1 ═══════════════════════ */
{ id:"s1", num:1, t:"Les gestes qui font gagner dix minutes", icon:"⚡", cat:"gestes", dur:"20 min",
  obj:"Six gestes que vous ferez dix fois par jour. À faire avec l'ordinateur allumé devant vous : chaque geste se pratique tout de suite.",
  lesson:[
    "<b>Pourquoi commencer par là, et pas par l'IA.</b> Vous avez écrit que vous aimeriez ne plus perdre de temps sur des choses simples que beaucoup de monde sait faire. Ces choses simples, les voici. Personne ne les a apprises à l'école : ceux qui les maîtrisent les ont vues faire par quelqu'un, une fois. Cette séance, c'est cette fois-là. Installez-vous devant votre ordinateur, ouvrez cette page d'un côté et un document Word de l'autre. On fait chaque geste au fur et à mesure.",

    "<h3>1. La capture d'écran — le geste que vous n'avez jamais fait</h3>Vous voulez montrer à quelqu'un ce que vous voyez à l'écran : un message d'erreur, une ligne d'un tableau, un extrait de planning, une page internet. Aujourd'hui vous le décrivez par écrit ou par téléphone. Demain vous l'envoyez en image.<br><br>Sur votre PC, appuyez en même temps sur trois touches : <kbd>Windows</kbd> (la touche avec le logo, en bas à gauche) + <kbd>Maj</kbd> (la flèche vers le haut, à gauche, qu'on appelle aussi Shift) + <kbd>S</kbd>. L'écran s'assombrit et une petite barre apparaît en haut. Votre souris devient une croix. Vous maintenez le bouton gauche enfoncé, vous dessinez un rectangle autour de ce que vous voulez capturer, vous relâchez. C'est fait : l'image est <i>copiée</i>, comme si vous aviez fait Ctrl + C dessus. Une petite notification apparaît en bas à droite — vous pouvez l'ignorer.<br><br>Maintenant, l'image est en mémoire. Pour l'utiliser, vous la <i>collez</i> : ouvrez un mail, cliquez dans le corps du message, <kbd>Ctrl</kbd> + <kbd>V</kbd>. L'image apparaît. Même chose dans Word, dans un message Teams, dans une conversation WhatsApp sur ordinateur.",

    "<div class=\"todo\">À faire maintenant : Windows + Maj + S sur cette page, dessinez un rectangle autour de ce paragraphe, puis collez dans votre document Word avec Ctrl + V. Si rien n'apparaît : vous avez probablement appuyé sur les touches l'une après l'autre au lieu d'en même temps. Recommencez en maintenant Windows et Maj enfoncées avant d'appuyer sur S.</div>",

    "Sur votre <b>iPhone</b> : appuyez en même temps sur le bouton latéral (à droite) et le bouton volume + (à gauche), puis relâchez tout de suite. L'écran clignote, une miniature apparaît en bas à gauche. La capture est dans Photos. Si votre iPhone a un bouton rond en bas de l'écran, c'est ce bouton + le bouton latéral.",

    "<h3>2. Sélectionner, copier, coller — proprement</h3>Vous vous notez 2 sur le copier-coller. Ce qui manque, ce n'est pas Ctrl + C et Ctrl + V — c'est la <i>sélection</i>, et le collage propre.<br><br><b>Sélectionner vite</b> : un double-clic sur un mot sélectionne le mot. Un triple-clic sélectionne le paragraphe entier. <kbd>Ctrl</kbd> + <kbd>A</kbd> sélectionne tout le document. Pour sélectionner du point A au point B : cliquez au début, puis maintenez <kbd>Maj</kbd> et cliquez à la fin. Plus besoin de faire glisser la souris sur trois pages en espérant ne pas déraper.<br><br><b>Copier et coller</b> : <kbd>Ctrl</kbd> + <kbd>C</kbd> copie ce qui est sélectionné, <kbd>Ctrl</kbd> + <kbd>V</kbd> le colle là où est le curseur. <kbd>Ctrl</kbd> + <kbd>X</kbd> coupe (copie puis supprime) — pour déplacer un paragraphe.<br><br><b>Coller sans la mise en forme.</b> Vous copiez un texte depuis un mail ou un site, vous le collez dans Word, et tout arrive en bleu, en police bizarre, avec des cadres. C'est parce que vous avez collé la mise en forme d'origine avec les mots. Le geste : <kbd>Ctrl</kbd> + <kbd>Maj</kbd> + <kbd>V</kbd>. Seuls les mots arrivent, dans la police de votre document. Si ce raccourci ne réagit pas dans un logiciel, faites un clic droit à l'endroit où vous voulez coller, et dans les options de collage, choisissez l'icône avec un <b>A</b> — « Conserver uniquement le texte ».",

    "<div class=\"todo\">À faire maintenant : sélectionnez ce paragraphe d'un triple-clic, Ctrl + C, puis collez-le deux fois dans Word : une fois avec Ctrl + V, une fois avec Ctrl + Maj + V. Regardez la différence.</div>",

    "<h3>3. Le PDF — pour tout ce qui sort de l'établissement</h3>Un document Word ou Excel envoyé tel quel peut s'ouvrir différemment chez le destinataire (mise en page décalée, police remplacée) et peut être modifié. Un PDF est une photographie figée du document : il s'ouvre partout pareil, et personne ne le modifie par erreur. Menu de la semaine pour les familles, compte-rendu pour la direction, courrier pour un prestataire : en PDF.<br><br>Deux façons. <b>La première</b>, dans Word ou Excel : Fichier → Enregistrer sous → choisissez l'emplacement → dans la liste déroulante « Type » sous le nom du fichier, choisissez <b>PDF</b> → Enregistrer. Vous avez maintenant deux fichiers : le .docx que vous pouvez continuer à modifier, et le .pdf que vous envoyez. <b>La deuxième</b>, qui marche dans n'importe quel logiciel, même ceux qui ne proposent pas PDF : <kbd>Ctrl</kbd> + <kbd>P</kbd> (imprimer), et dans la liste des imprimantes, choisissez « <b>Microsoft Print to PDF</b> ». Au lieu d'imprimer sur papier, Windows vous demande où enregistrer le PDF.",

    "<div class=\"todo\">À faire maintenant : votre document Word avec les paragraphes collés → Fichier → Enregistrer sous → type PDF. Puis ouvrez le PDF en double-cliquant dessus : il s'ouvre dans votre navigateur ou dans un lecteur PDF. Vous voyez qu'on ne peut pas y taper.</div>",

    "<h3>4. Annuler, enregistrer, retrouver</h3><kbd>Ctrl</kbd> + <kbd>Z</kbd> annule la dernière action. Une colonne supprimée par erreur, un paragraphe écrasé, une mise en forme qui a tout cassé : Ctrl + Z, et c'est comme avant. Ça marche dans tous les logiciels, et vous pouvez l'appuyer plusieurs fois de suite pour remonter plusieurs actions en arrière. C'est le raccourci qui enlève la peur de faire des bêtises : rien n'est irrémédiable tant que vous n'avez pas fermé le fichier.<br><br><kbd>Ctrl</kbd> + <kbd>S</kbd> enregistre. L'habitude à prendre : l'appuyer toutes les deux minutes, sans y penser, comme on regarde dans le rétroviseur. Un fichier Excel qui se ferme sans enregistrer, c'est une heure de travail perdue — et c'est arrivé à tout le monde exactement une fois, la fois où on a pris l'habitude.<br><br><kbd>Ctrl</kbd> + <kbd>F</kbd> ouvre une petite fenêtre de recherche : vous tapez un mot, le logiciel le surligne partout. Dans un document de dix pages, un tableau de 300 lignes, une page internet, un long mail. Vous ne lisez plus pour chercher.",

    "<div class=\"todo\">À faire maintenant : dans Word, supprimez un paragraphe entier (triple-clic, touche Suppr), puis Ctrl + Z. Il revient. Puis Ctrl + S. Puis Ctrl + F, tapez « rectangle », regardez le mot se surligner.</div>",

    "<h3>5. Passer d'une fenêtre à l'autre</h3>Vous avez souvent trois choses ouvertes : un mail, un tableau, un logiciel métier. <kbd>Alt</kbd> + <kbd>Tab</kbd> : maintenez Alt, appuyez sur Tab, une vignette de chaque fenêtre ouverte apparaît ; chaque appui sur Tab en sélectionne une autre ; relâchez Alt pour y aller. Et pour mettre deux fenêtres côte à côte (un mail à gauche, le tableau à droite pour recopier des chiffres) : <kbd>Windows</kbd> + <kbd>←</kbd> sur la première, <kbd>Windows</kbd> + <kbd>→</kbd> sur la seconde. L'écran se partage en deux.",

    "<h3>Ce que vous emportez</h3>Six raccourcis : <b>Windows + Maj + S</b> (capture), <b>Ctrl + Maj + V</b> (coller propre), <b>Ctrl + P → PDF</b>, <b>Ctrl + Z</b> (annuler), <b>Ctrl + S</b> (enregistrer), <b>Ctrl + F</b> (chercher). Écrivez-les sur un post-it collé sous l'écran. Dans une semaine, vous l'enlèverez : ils seront dans les doigts."
  ],
  prac:[
    { type:"order", title:"Envoyer un extrait de planning à une collègue",
      intro:"Vous voulez lui envoyer par mail une image de la partie du planning qui la concerne. Remettez les gestes dans l'ordre.",
      steps:[
        "Ouvrir le planning à l'écran, faire défiler jusqu'à la partie voulue",
        "Windows + Maj + S : l'écran s'assombrit",
        "Dessiner un rectangle autour de la partie à envoyer, relâcher",
        "Ouvrir Outlook et cliquer sur Nouveau message",
        "Cliquer dans le corps du mail, puis Ctrl + V",
        "Écrire une phrase d'explication au-dessus de l'image, puis Envoyer"
      ] },
    { type:"classify", title:"Quel raccourci ?",
      intro:"Pour chaque situation, quel geste utilisez-vous ?",
      buckets:["Windows + Maj + S","Ctrl + Maj + V","Ctrl + Z","Ctrl + F","Enregistrer en PDF"],
      items:[
        {t:"Montrer à la maintenance le message d'erreur affiché par le logiciel", a:0},
        {t:"Coller un texte dans Word sans qu'il arrive avec une police bizarre", a:1},
        {t:"Vous venez de supprimer une colonne par erreur dans Excel", a:2},
        {t:"Retrouver le nom d'un fournisseur dans un tableau de 300 lignes", a:3},
        {t:"Envoyer le menu de la semaine à une famille sans qu'elle puisse le modifier", a:4},
        {t:"Montrer une ligne du tableau de stocks dans un message Teams", a:0},
        {t:"Envoyer un compte-rendu à la direction, mise en page garantie", a:4},
        {t:"Vous avez collé un tableau et tout est arrivé en bleu souligné", a:1},
        {t:"Vous avez écrasé le mauvais paragraphe dans un document", a:2},
        {t:"Vérifier si un mot apparaît dans un long mail", a:3}
      ] },
    { type:"scenario", title:"Ça ne se colle pas",
      situation:"Vous faites Windows + Maj + S, vous dessinez votre rectangle, puis Ctrl + V dans le mail : rien n'apparaît.",
      options:["La capture d'écran ne marche pas sur cet ordinateur.","J'ai probablement cliqué ailleurs entre les deux, ou fait un autre Ctrl + C qui a remplacé l'image en mémoire. Je refais la capture et je colle tout de suite.","Il faut redémarrer l'ordinateur."],
      a:1, e:"La mémoire de copie ne contient qu'une chose à la fois : le dernier élément copié. Si vous copiez autre chose entre la capture et le collage, l'image est remplacée. Capture, puis collage immédiat." },
    { type:"scenario", title:"Le fichier fermé sans enregistrer",
      situation:"Vous avez travaillé une heure sur un tableau Excel, vous cliquez sur la croix, une fenêtre demande « Voulez-vous enregistrer les modifications ? » et, dans la précipitation, vous cliquez sur « Ne pas enregistrer ».",
      options:["Tout est perdu, il faut recommencer.","Excel garde parfois une version récupérée : Fichier → Informations → Gérer le classeur → Récupérer. Mais ce n'est pas garanti — et c'est exactement pour ça qu'on fait Ctrl + S toutes les deux minutes.","Ctrl + Z va tout remettre."],
      a:1, e:"La récupération existe et sauve parfois. Ctrl + Z ne fonctionne plus une fois le fichier fermé. La vraie protection, c'est l'habitude de Ctrl + S." },

{ id:"s2", num:2, t:"L'IA : ce qu'elle fait vraiment", icon:"🧠", cat:"ia", dur:"20 min",
  obj:"Comprendre pourquoi une réponse très précise peut être complètement fausse, apprendre à le repérer en une seconde, et savoir ce qu'on peut lui confier sans risque.",
  lesson:[
    "<b>Ce que vous avez écrit.</b> L'IA sert à « obtenir rapidement la réponse la plus précise possible ». Vous vous en servez déjà pour des conseils, de la culture générale, des projets — et ça marche. La première moitié de votre phrase est juste : c'est rapide. La deuxième est le piège. Cette séance existe pour que le piège se referme sur quelqu'un d'autre.",

    "<h3>1. Comment ça marche, en vrai</h3>Quand vous posez une question à ChatGPT, il ne va pas chercher la réponse dans une encyclopédie vérifiée. Il n'a pas de bibliothèque de réponses. Ce qu'il a, c'est un entraînement sur une quantité gigantesque de textes — livres, articles, forums, sites — à partir desquels il a appris une seule chose : <b>prédire le mot qui a le plus de chances de venir ensuite</b>. Quand il vous répond, il compose une suite de mots plausible, mot après mot, en fonction de ce qu'il a vu passer des milliards de fois.<br><br>Une image pour le garder en tête : c'est un collègue extrêmement cultivé, qui a lu tout ce qui existe, qui parle avec assurance sur n'importe quel sujet — et qui ne vérifie jamais avant de parler. Il ne ment pas : il ne sait pas quand il ne sait pas. La plupart du temps, ce qu'il dit est juste, parce que le plausible et le vrai se rejoignent. Parfois non. Et rien dans sa voix ne change.",

    "<h3>2. L'hallucination</h3>Ce phénomène a un nom : l'<b>hallucination</b>. L'IA invente un chiffre, une date, un article de loi, une référence de produit, le nom d'une norme, une étude, avec exactement le même aplomb que quand elle a raison. Elle est même souvent <i>plus</i> précise quand elle invente — parce que la précision est ce qui rend une réponse crédible, et qu'elle a appris que les réponses crédibles sont précises. Une température exacte, un numéro d'arrêté, une date : ce sont des habits de vérité, pas des preuves.<br><br>Ce n'est pas un défaut qu'une mise à jour va corriger. C'est la façon dont ces outils fonctionnent. Les versions récentes se trompent moins, elles se trompent toujours. On ne l'élimine pas : on l'encadre.",

    "<div class=\"todo\">À faire maintenant, sur votre téléphone : demandez à ChatGPT « Quelle est la population exacte de Vienne (Isère) au dernier recensement ? ». Il vous donnera un chiffre précis, peut-être une année. Puis vérifiez sur le site de l'INSEE ou de la ville. Regardez l'écart. Ce n'est pas une question de gravité — c'est pour sentir, une fois, l'assurance d'un chiffre qui n'est pas relié à une source.</div>",

    "<h3>3. Ce que ça change dans votre métier</h3>Dans un EHPAD, les faits ne sont pas décoratifs. Un dosage de désinfectant, une température de conservation, une durée de garde d'un plat témoin, un délai légal de conservation d'un document, une règle sur les repos entre deux services : si l'IA vous le donne et que vous ne l'avez pas vérifié, vous ne pouvez pas l'utiliser. Ce ne serait pas l'IA qui aurait tort devant la direction ou devant un contrôle — ce serait vous.<br><br>Ce qui fait foi chez vous : les procédures de l'établissement (HACCP, plan de nettoyage, protocoles), la fiche technique du fabricant, votre référent qualité, votre direction, et pour les questions de droit du travail, la convention collective et les RH. L'IA n'est pas dans cette liste, et elle n'y sera jamais.",

    "<h3>4. Le tri en une seconde : vérifiable ou pas</h3>Vérifier ne veut pas dire relire chaque réponse avec méfiance. Ça veut dire repérer, en une seconde, les éléments <b>vérifiables</b> — et ne vérifier que ceux-là. Un élément est vérifiable quand il peut être vrai ou faux : un chiffre, une date, une règle, un nom, une référence, une distance, un article de loi, un « selon une étude ». Tout le reste n'est pas vérifiable parce que ce n'est pas une question de vrai ou faux : la tournure d'une phrase, la structure d'un document, une idée d'animation, une façon d'expliquer, un plan en cinq points. Ça, vous le prenez tel quel, et l'IA y est excellente.<br><br>La règle, valable pour toutes les séances suivantes et pour le reste de votre vie avec ces outils : <b>ce qui est vérifiable se vérifie, ce qui est de la forme se prend</b>.",

    "<h3>5. Les signaux d'alerte</h3>Trois choses doivent vous faire lever un sourcil. <b>Un chiffre précis sur un sujet propre à votre métier ou à votre établissement</b> — l'IA ne connaît pas votre établissement ; si elle répond précisément, elle compose. <b>Une source nommée que vous ne pouvez pas ouvrir</b> — « selon l'arrêté du 12 mars 2019 », « d'après une étude de l'ANSES » : demandez-vous si vous pouvez l'ouvrir ; si non, ça ne vaut rien tant que vous ne l'avez pas trouvé vous-même. <b>Un ton d'autorité sur un sujet où vous, vous n'êtes pas sûre</b> — l'assurance de l'IA ne doit jamais remplacer la vôtre.<br><br>Et une question qui marche : « <b>Es-tu sûr, ou est-ce une estimation ?</b> » Posée directement, l'IA répond honnêtement — elle sait souvent dire qu'elle n'est pas certaine, à condition qu'on le lui demande. Ça ne remplace pas la vérification. Ça vous dit où regarder en premier.",

    "<h3>6. Ce que vous pouvez lui confier les yeux fermés</h3>Pour que cette séance ne vous laisse pas avec l'envie de tout jeter : voici où elle est vraiment bonne, et sans risque. Reformuler un mail pour qu'il soit plus diplomate. Structurer un compte-rendu en trois parties. Trouver dix idées d'animation pour l'automne. Expliquer ce qu'est une formule Excel, un tableau croisé, un fichier PDF, un mot que vous ne connaissez pas. Traduire. Résumer un long texte que vous lui donnez. Vous faire répéter une explication trois fois sans s'impatienter. Tout ça, c'est de la forme et de l'explication — pas des faits sur votre établissement. C'est là que vous allez gagner du temps, et c'est là que les séances suivantes vous emmènent."
  ],

/* ═══════════════════════ SÉANCE 3 ═══════════════════════ */
{ id:"s3", num:3, t:"Bien demander", icon:"✍️", cat:"ia", dur:"20 min",
  obj:"Obtenir du premier coup ce que vous voulez, au lieu de reformuler cinq fois. Quatre éléments, une méthode, trois exercices sur vos vrais sujets.",
  lesson:[
    "<b>Le constat.</b> Vous demandez déjà des choses à ChatGPT. Quand la réponse ne convient pas, vous reformulez, vous précisez, vous relancez. Ça finit par marcher, mais au bout de cinq échanges. Ce qui suit ne change pas votre usage : il le rend trois fois plus rapide, et — vous y êtes sensible — trois fois plus sobre.<br><br>Une demande à une IA s'appelle un <b>prompt</b>. Vous entendrez ce mot partout ; il veut juste dire « ce que vous tapez ». Une demande efficace contient quatre choses. Elles peuvent être dans n'importe quel ordre, mais elles doivent y être toutes les quatre.",

    "<h3>1. Le rôle — qui doit répondre</h3>« Tu es responsable hébergement en EHPAD, habituée à encadrer des équipes de service et de lingerie. » Une phrase, et vous réglez le vocabulaire, le niveau et le point de vue de la réponse. Sans rôle, l'IA répond à tout le monde en général, donc à personne en particulier : un mail « professionnel » sans savoir quel métier, un conseil de management pour une entreprise de bureau.<br><br>Le rôle peut aussi décrire à qui elle s'adresse : « Tu expliques à quelqu'un qui débute sur Excel. » C'est ce qui évite le jargon.",

    "<h3>2. Le contexte — ce qu'elle ne peut pas deviner</h3>C'est la partie que tout le monde saute, et c'est celle qui fait la différence entre une réponse générique et une réponse utilisable. L'IA ne connaît ni votre établissement, ni votre équipe, ni ce qui s'est passé la semaine dernière. Tout ce qu'elle ne sait pas, elle le remplira avec du plausible — vous connaissez le risque depuis la séance 2.<br><br>Donnez-lui : la situation (quoi, avec qui, depuis quand), ce qui s'est déjà passé (« je lui en ai déjà parlé une fois de façon informelle »), ce que vous voulez obtenir au final (« un entretien ferme mais pas humiliant »), et ce qui vous gêne (« je ne veux pas m'excuser platement »). Le contexte prend plusieurs phrases. Si votre demande fait trois lignes, il en manque.<br><br>Un repère : quand vous expliquez la situation à une collègue de confiance, vous lui donnez naturellement le contexte. Écrivez-le comme vous le lui diriez.",

    "<h3>3. Le format — ce que vous voulez recevoir</h3>Sans format, vous recevez un pavé de vingt lignes qu'il faudra retailler. Dites ce que vous voulez : « un mail de huit lignes maximum, avec un objet », « un tableau à trois colonnes », « trois options, avec pour chacune un avantage et un inconvénient », « une liste de cinq étapes, avec pour chaque étape la phrase exacte que je peux dire », « explique-moi en quatre paragraphes courts ».<br><br>Le format inclut la longueur. « 100 mots maximum » ou « pas plus de dix lignes » : l'IA respecte les longueurs demandées, et ça vous évite de lire trois paragraphes de politesse avant d'arriver au point.",

    "<h3>4. La contrainte — ce qu'il ne faut pas faire</h3>La contrainte est ce qui protège. « N'invente aucun chiffre ni aucune règle : si tu as besoin d'une information, pose-moi la question. » « Pas de nom de résident. » « Pas de jargon administratif. » « Pas de formule de politesse creuse. » « Ne propose rien qui suppose du personnel supplémentaire. »<br><br>Cette contrainte anti-invention — <i>n'invente rien, pose-moi la question</i> — devrait figurer dans presque toutes vos demandes professionnelles. C'est votre garde-fou de la séance 2, transformé en habitude. Et quand l'IA vous pose effectivement une question en retour au lieu de deviner, c'est le signe que la demande était bien faite.",

    "<div class=\"todo\">À faire maintenant : prenez une question que vous avez vraiment posée à ChatGPT ces dernières semaines. Relisez-la. Combien des quatre éléments contenait-elle ? La plupart des demandes en contiennent un — la tâche — et c'est pour ça qu'il faut cinq relances.</div>",

    "<h3>5. Un exemple complet, sur votre métier</h3><b>Avant</b> : « Aide-moi à répondre à une famille qui se plaint du linge. »<br><br><b>Après</b> : « Tu es responsable hébergement dans un EHPAD, habituée à écrire aux familles. Contexte : la fille d'une résidente m'a écrit pour se plaindre que le linge de sa mère revient parfois mélangé avec celui d'une autre résidente. C'est arrivé deux fois en trois semaines. Nous travaillons avec une blanchisserie externe et j'ai déjà signalé le problème au prestataire. La famille est inquiète et un peu agacée, mais la relation est bonne. Rédige ma réponse. Format : un mail de dix lignes maximum, avec un objet. Contraintes : reconnaître le problème sans me justifier longuement, dire ce qui est fait concrètement, aucune promesse de délai que je n'ai pas donnée, pas de jargon. N'invente aucune procédure : si tu as besoin d'une information, pose-moi la question. »<br><br>La deuxième version fait dix lignes. Elle donne une réponse utilisable du premier coup, dans laquelle vous changerez trois mots. La première version donne une lettre type qui pourrait venir de n'importe quel hôtel.",

{ id:"s4", num:4, t:"Résidents, données, et l'écologie", icon:"🔒", cat:"cadre", dur:"20 min",
  obj:"Savoir exactement ce que vous pouvez écrire dans une IA, comment anonymiser en trois secondes, ce que dit le RGPD pour votre métier, et quoi penser de l'impact écologique.",
  lesson:[
    "<b>Vos deux inquiétudes</b>, traitées ensemble parce qu'elles ont la même réponse : ce n'est pas tout ou rien, c'est une question d'usage. Et sur les deux, votre instinct est bon — il manque juste les règles précises.",

    "<h3>1. Où vont vos mots</h3>Ce que vous tapez dans ChatGPT ne reste pas sur votre téléphone. Ça part sur des serveurs de l'entreprise qui fait l'outil (OpenAI pour ChatGPT), à l'étranger. Avec un compte personnel — le vôtre —, vos conversations peuvent en plus servir à améliorer le modèle, c'est-à-dire être relues par des systèmes et parfois par des personnes, sauf si vous désactivez l'option.<br><br>Le geste, sur l'application ChatGPT : votre photo ou vos initiales en haut → Réglages → Contrôles des données → « <b>Améliorer le modèle pour tous</b> » → désactivez. Deux touches, une fois. Ça ne change rien à la qualité des réponses.",

    "<div class=\"todo\">À faire maintenant : ouvrez ChatGPT sur votre iPhone et désactivez cette option. Si vous ne trouvez pas le menu (les applications changent), tapez dans ChatGPT lui-même : « Où se trouve le réglage pour ne pas utiliser mes conversations pour l'entraînement ? » — c'est une question de méthode, pas un fait de votre métier : il répondra bien.</div>",

    "<h3>1 bis. Copilot au travail : ce qui change</h3>Dans votre futur poste, l'établissement vous fournira Copilot avec un compte professionnel. C'est différent de votre ChatGPT personnel sur un point essentiel : avec un compte pro Microsoft 365, ce que vous tapez reste dans l'espace de l'établissement, n'est pas utilisé pour entraîner le modèle, et est couvert par le contrat entre l'établissement et Microsoft. C'est une protection que votre compte perso n'a pas.<br><br>Ça ne veut pas dire que tout devient permis. Ce que vous pouvez y mettre dépend de la règle que l'établissement écrira — demandez-la, et si elle n'existe pas encore, appliquez les trois couleurs ci-dessous jusqu'à ce qu'elle existe. Le principe simple : <b>ChatGPT perso pour ce qui est vert, Copilot pro pour le vert et l'orange, et le rouge ne va nulle part</b> tant qu'une règle écrite ne dit pas le contraire. Un extrait de Netsoins — le dossier de soins — reste rouge partout, Copilot ou pas.<h3>2. Le RGPD, pour vous</h3>On ne vous a jamais formée au RGPD, et vous manipulez souvent des informations sur les résidents. Voici l'essentiel, en langage courant.<br><br>Une <b>donnée personnelle</b>, c'est toute information qui permet d'identifier une personne : nom, prénom, date de naissance, numéro de chambre associé à un nom, photo, adresse d'une famille, numéro de téléphone. Certaines sont dites <b>sensibles</b> et sont protégées plus fort : tout ce qui touche à la santé (pathologie, traitement, régime alimentaire médical, degré de dépendance), à la religion, à la vie privée. Dans un EHPAD, presque tout ce qui concerne un résident est sensible.<br><br>Le principe : ces informations ne servent qu'à ce pour quoi elles ont été confiées — le soin et l'accompagnement — et ne circulent que vers les personnes qui en ont besoin pour ça. Un prestataire de blanchisserie a besoin du numéro de chambre et du marquage, pas de la pathologie. Une IA n'a besoin de rien de tout cela.<br><br>Et les <b>salariés</b> ont les mêmes droits que les résidents : un arrêt de travail, une situation personnelle, un conflit nominatif, une évaluation, sont des données personnelles, parfois sensibles. Votre planning avec les noms en est un.",

    "<h3>3. Les trois couleurs</h3>La règle que vous appliquerez sans réfléchir dans une semaine.<br><br><b>Vert — vous collez tel quel</b> : une question de méthode (« comment structurer un plan d'action ? »), un brouillon sans nom, une idée d'animation, une explication Excel, un texte public, une consigne générale à l'équipe.<br><br><b>Orange — vous anonymisez d'abord</b> : un mail d'une famille (le nom devient « la fille d'une résidente »), une situation d'équipe (« une agente de service » plutôt que le prénom), une réclamation, un échange avec un prestataire qui cite un résident. Le contenu est utile pour que l'IA vous aide ; l'identité ne l'est pas.<br><br><b>Rouge — jamais</b> : nom, prénom, numéro de chambre associé à une personne, pathologie, régime, degré de dépendance, extrait du dossier de soins, photo, planning avec les noms, arrêt de travail, évaluation d'un salarié, extrait d'un logiciel de l'établissement, et de manière générale tout document que vous n'enverriez pas à un inconnu.",

    "<h3>4. Anonymiser en trois secondes</h3>Anonymiser ne veut pas dire supprimer le contenu. Ça veut dire remplacer les <i>identités</i> par des <i>rôles</i>. « Madame Durand, chambre 12 » devient « une résidente ». « Sa fille Nathalie » devient « sa fille ». « Karine, ASH du 2e » devient « une agente de service ». Le reste de l'histoire — le linge mélangé deux fois, la famille agacée, le prestataire déjà relancé — reste tel quel, parce que c'est ça dont l'IA a besoin pour vous aider.<br><br>Ce qui change dans la réponse : rien. L'IA écrit exactement aussi bien « Madame » que « Madame Durand ». Vous remettez le vrai nom à la fin, dans Outlook, en trois secondes. Et si vous copiez un mail reçu, relisez-le avant de coller : les noms se cachent dans les signatures, les objets, les « Bonjour Nathalie ».",

    "<div class=\"todo\">À faire maintenant : prenez mentalement le dernier mail délicat que vous avez reçu au travail. Repérez tout ce qui identifie quelqu'un. Comptez. C'est ce que vous remplacerez par un rôle avant de le coller.</div>",

    "<h3>5. L'écologie : ce qui est vrai, ce qui est actionnable</h3>Votre inquiétude est fondée. Entraîner ces modèles et faire tourner les serveurs qui répondent consomme de l'électricité, et de l'eau pour refroidir les centres de données. Le secteur numérique dans son ensemble est en croissance rapide, et l'IA y contribue.<br><br>Les chiffres qui circulent — « une question = tant de litres d'eau », « tant de fois plus qu'une recherche Google » — varient énormément selon ce qu'on mesure, où, et avec quel modèle. Je ne vous en donnerai pas : vous savez depuis la séance 2 pourquoi un chiffre précis sans source ne vaut rien, et ce serait malhonnête de vous en inventer un pour vous rassurer ou vous inquiéter.<br><br>Ce qui est sûr et sur lequel vous avez prise : une requête n'est pas gratuite, et la plus grande partie du gaspillage vient de l'<i>usage</i>. Quatre gestes sobres. <b>Demander bien, une fois</b> — la séance 3 est aussi une séance d'écologie : une demande complète, c'est cinq requêtes de moins. <b>Ne pas demander à l'IA ce qu'un outil simple fait mieux</b> : une date de jour férié, une conversion, un calcul — un calendrier, une calculatrice, Excel. Plus fiable, et sans serveur. <b>Ne pas générer pour jeter</b> : quinze images pour en garder une, dix versions d'un mail par curiosité. <b>Utiliser l'outil quand il remplace vraiment du temps ou du papier</b>, pas par réflexe.<br><br>Un usage sobre et utile est un choix cohérent avec votre inquiétude. Ce n'est pas un compromis, c'est la bonne façon de s'en servir."
  ],

{ id:"s5", num:5, t:"Excel — comprendre la logique", icon:"📊", cat:"excel", dur:"20 min",
  obj:"Arrêter de subir Excel. Comprendre comment il pense, construire un tableau propre, et savoir reconnaître Copilot quand il est là. Excel ouvert devant vous.",
  lesson:[
    "<b>Le constat.</b> Excel est l'outil qui vous fait perdre le plus de temps, et vous savez pourquoi : manque de maîtrise. La bonne nouvelle, c'est que 90 % de ce dont vous avez besoin tient dans cette séance et les deux suivantes. Vous savez déjà trier et filtrer un peu. Il manque la logique de base — celle que personne n'explique parce que ceux qui la connaissent ne se souviennent plus de l'avoir apprise.<br><br>Ouvrez Excel, fichier vide. On construit ensemble, geste par geste.",

    "<h3>1. Une cellule a une adresse</h3>Regardez la grille. Les colonnes portent des lettres en haut (A, B, C…), les lignes des numéros à gauche (1, 2, 3…). Chaque case est une <b>cellule</b>, et elle a une adresse : la case à l'intersection de la colonne B et de la ligne 4 s'appelle <b>B4</b>. Cliquez dedans : vous voyez « B4 » s'afficher dans la petite zone en haut à gauche, sous le ruban. C'est tout le secret.<br><br>Pourquoi c'est important : quand vous écrirez une formule, vous ne direz pas « additionne 12 et 8 », vous direz « additionne ce qu'il y a dans B4 et dans B5 ». Si demain vous changez le 12 en 15, le résultat se recalcule tout seul. Un tableau construit comme ça se met à jour chaque semaine sans que vous refassiez rien — c'est exactement ce qui vous manque sur vos contrôles et vos commandes.",

    "<div class=\"todo\">À faire maintenant : cliquez dans plusieurs cellules et lisez leur adresse dans la zone en haut à gauche. Puis tapez 12 dans B4, 8 dans B5, et dans B6 tapez exactement <code>=B4+B5</code> puis Entrée. Vous voyez 20. Changez B4 en 15 : B6 passe à 23 tout seul. Vous venez d'écrire votre première formule.</div>",

    "<h3>2. Texte ou nombre : Excel fait la différence</h3>Excel distingue deux sortes de contenus : les <b>nombres</b>, qu'il peut calculer, et le <b>texte</b>, qu'il affiche sans rien en faire. Le repère visuel, à retenir absolument : un nombre se cale <b>à droite</b> de sa cellule, un texte se cale <b>à gauche</b>.<br><br>Si vous tapez 12 et qu'il se cale à gauche, Excel l'a pris pour du texte, et une somme dessus donnera 0 ou une erreur. C'est la cause la plus fréquente et la plus déroutante des « Excel qui ne calcule pas ». Causes habituelles : un espace tapé avant le chiffre, un point à la place de la virgule (en Excel français, la virgule est le séparateur décimal : 12,5 et non 12.5), ou une unité écrite dans la cellule (« 12 kg »). Le kg va dans le titre de la colonne, pas dans la cellule.",

    "<div class=\"todo\">À faire maintenant : dans C4 tapez « 12 » avec un espace avant. Il se cale à gauche. Dans C5 tapez 12,5. À droite. Dans C6 tapez 12.5 avec un point. Regardez ce qu'Excel en fait — souvent une date ou du texte. Vous venez de voir les trois pièges.</div>",

    "<h3>3. Un tableau propre : quatre règles</h3>La plupart des ennuis avec Excel viennent de tableaux mal construits — pas de formules compliquées. Quatre règles, et 80 % des problèmes disparaissent.<br><br><b>Une seule ligne d'en-têtes, tout en haut, en ligne 1.</b> Les titres de colonnes : Date, Secteur, Produit, Quantité… Pas de titre général au-dessus (« Contrôle du linge 2026 »), pas de ligne vide entre le titre et les données. Si vous voulez un titre, mettez-le dans le nom de l'onglet en bas, ou dans le nom du fichier.<br><br><b>Une ligne = un élément.</b> Une commande, un contrôle, une agente, une semaine. Jamais deux choses sur la même ligne, jamais une chose répartie sur deux lignes.<br><br><b>Une colonne = une information, et une seule.</b> Pas « Nom et prénom » dans la même colonne : deux colonnes. Pas « Quantité » avec « 12 kg », « 8 kg », « environ 5 » : une colonne « Quantité (kg) » avec 12, 8, 5. Pas de commentaire dans une colonne de nombres.<br><br><b>Pas de cellules fusionnées, pas de lignes vides au milieu.</b> Une ligne vide coupe votre tableau en deux : à partir d'elle, Excel considère que c'est un autre tableau, et tris, filtres et totaux s'arrêtent là. Les cellules fusionnées (deux cases collées en une) cassent les tris et empêchent Copilot de lire le tableau. Si vous voulez aérer, changez la hauteur des lignes ou la couleur — jamais une ligne vide.",

    "<h3>4. Mettre « sous forme de tableau »</h3>Un geste que presque personne ne connaît et qui change tout. Cliquez dans n'importe quelle cellule de votre tableau, puis onglet <b>Insertion → Tableau</b> (ou Accueil → Mettre sous forme de tableau). Excel encadre vos données, vous cochez « Mon tableau comporte des en-têtes », OK. Vos données se colorent en bandes, des flèches de filtre apparaissent sur chaque titre, et le tableau prend un nom.<br><br>Ce que ça apporte : quand vous ajoutez une ligne en bas, elle rejoint automatiquement le tableau, avec les mêmes formules et la même mise en forme. Les tris et filtres sont déjà là. Les totaux se mettent à jour. Et c'est <b>obligatoire pour que Copilot puisse travailler sur vos données</b> — on y vient.",

    "<div class=\"todo\">À faire maintenant : en A1, B1, C1 tapez Date, Produit, Quantité. Remplissez cinq lignes en dessous (dates, noms de produits, quantités). Cliquez dans le tableau, Insertion → Tableau, cochez les en-têtes, OK. Regardez les bandes et les flèches. Tapez une sixième ligne juste en dessous : elle se colore toute seule.</div>",

    "<h3>5. Copilot dans Excel : l'avoir, ou pas</h3>Dans votre futur établissement, vous aurez Copilot. Il existe en deux versions, et il faut savoir laquelle vous aurez. Regardez le ruban d'Excel, tout à droite de l'onglet Accueil : s'il y a un bouton <b>Copilot</b> (une icône colorée), vous avez la licence complète, et Copilot peut lire votre tableau, proposer des formules, ajouter des colonnes, faire des graphiques. S'il n'y a pas de bouton dans Excel, vous avez Copilot Chat — une fenêtre de conversation à part, dans Edge ou l'application Microsoft 365 — qui vous <i>explique</i> comment faire mais ne touche pas au fichier.<br><br>Dans les deux cas, ces trois séances valent : avec le bouton, Copilot fait le geste et vous contrôlez ; sans le bouton, il vous dit comment et vous faites. Deux conditions pour que le bouton fonctionne : le fichier doit être enregistré sur <b>OneDrive ou SharePoint</b> (le petit interrupteur « Enregistrement automatique » en haut à gauche doit être activé), et vos données doivent être <b>sous forme de tableau</b> — celui de la partie 4. Sans ces deux choses, le bouton est grisé, et beaucoup de gens en concluent que « Copilot ne marche pas ».",

    "<h3>6. L'IA comme professeur d'Excel</h3>Que ce soit Copilot Chat ou ChatGPT, l'IA est un excellent professeur d'Excel : disponible le soir, jamais impatiente quand vous reposez la même question, capable de réexpliquer autrement. La bonne façon de lui demander, séance 3 appliquée : décrivez votre tableau (les titres de colonnes avec leurs lettres, deux lignes d'exemple), dites ce que vous voulez obtenir, et ajoutez « <b>explique-moi comme à quelqu'un qui débute, étape par étape, pour Excel en français</b> ». Elle ne touchera pas à votre fichier — elle vous explique, vous faites. Et en faisant, vous apprenez : c'est votre façon.<br><br>Ce qu'il faut toujours vérifier : le résultat, sur une ligne, à la main. Ce que vous pouvez prendre tel quel : l'explication. Une explication de ce qu'est une somme ou un filtre n'est pas un fait de votre métier, c'est de la connaissance générale — là, l'IA est fiable."

/* ═══════════════════════ SÉANCE 6 ═══════════════════════ */
{ id:"s6", num:6, t:"Excel — les calculs", icon:"🧮", cat:"excel", dur:"20 min",
  obj:"Faire un tableau de calcul — ce que vous avez toujours voulu savoir faire. Somme, différence, pourcentage, recopie. Et obtenir n'importe quelle formule sans la connaître, par Copilot ou par ChatGPT.",
  lesson:[
    "<b>Le point de départ.</b> Vous avez écrit que vous aimeriez savoir créer un tableau de calcul. C'est cette séance. Trois formules suffisent pour l'essentiel de votre travail — et pour tout le reste, vous saurez demander. Ouvrez le tableau que vous avez construit à la séance 5.",

    "<h3>1. Le signe égal</h3>Une formule commence <b>toujours</b> par <code>=</code>. C'est ce signe qui dit à Excel « calcule ce qui suit » au lieu de « affiche ce que je tape ». Sans le égal, <code>B4+B5</code> est un texte ; avec, c'est un calcul. Quand vous tapez le égal, Excel passe en mode formule : vous pouvez cliquer sur des cellules à la souris et il écrit leur adresse à votre place.<br><br>Les quatre opérations : <code>+</code> additionne, <code>-</code> soustrait, <code>*</code> (l'étoile, sur le pavé numérique ou Maj + le signe du clavier) multiplie, <code>/</code> divise. <code>=B4*2</code>, <code>=B4-B5</code>, <code>=B4/B5</code>.",

    "<h3>2. La somme</h3>Pour additionner une colonne entière, on n'écrit pas <code>=B2+B3+B4+B5+B6…</code>. On utilise la fonction SOMME. Cliquez dans la cellule où vous voulez le total (sous la colonne), tapez <code>=SOMME(</code>, puis sélectionnez à la souris les cellules à additionner en les faisant glisser, tapez <code>)</code>, Entrée. Excel a écrit quelque chose comme <code>=SOMME(C2:C23)</code> — les deux points veulent dire « de C2 jusqu'à C23 ».<br><br>Le raccourci qui fait la même chose en une seconde : cliquez dans la cellule sous la colonne et appuyez sur <kbd>Alt</kbd> + <kbd>=</kbd>. Excel devine la plage et écrit la somme. Entrée pour valider.<br><br>Si votre tableau est « sous forme de tableau » (séance 5), il y a mieux : cliquez dedans, onglet <b>Création de tableau</b> → cochez <b>Ligne des totaux</b>. Une ligne de total apparaît en bas, avec une petite flèche par colonne pour choisir : somme, moyenne, nombre… Et elle reste en bas quand vous ajoutez des lignes.",

    "<div class=\"todo\">À faire maintenant : sous votre colonne de montants, Alt + =, Entrée. Regardez le total. Changez un montant dans la colonne : le total bouge. Si vous êtes sous forme de tableau, essayez plutôt Ligne des totaux.</div>",

    "<h3>3. La différence et le pourcentage</h3>Dans une nouvelle colonne, la différence entre deux colonnes : <code>=C2-B2</code> (le reçu moins le commandé, le réel moins le prévu). Tapez le égal, cliquez sur C2, tapez le moins, cliquez sur B2, Entrée.<br><br>Le pourcentage demande de comprendre une chose : pour Excel, un pourcentage est un nombre entre 0 et 1, que l'on <i>affiche</i> avec un signe %. 7,5 % c'est 0,075. Donc l'écart en pourcentage du commandé : <code>=(C2-B2)/B2</code> — la parenthèse d'abord, puis la division. Le résultat affiche 0,075 ; sélectionnez la cellule et cliquez sur le bouton <b>%</b> dans le ruban Accueil : ça devient 7,5 %. Vous n'avez pas multiplié par 100 : vous avez changé l'affichage.<br><br>Vous n'avez pas besoin de retenir ces formules par cœur. Vous avez besoin de savoir qu'elles existent, et de savoir les demander — partie 5.",

    "<h3>4. Recopier une formule</h3>C'est là que le temps se gagne vraiment. Vous écrivez la formule une fois, dans la première ligne. Puis vous cliquez sur la cellule, vous attrapez le <b>petit carré en bas à droite</b> de la cellule (le curseur devient une croix noire fine), et vous tirez vers le bas jusqu'à la dernière ligne. Excel recopie la formule en adaptant les numéros de ligne : <code>=C2-B2</code> devient <code>=C3-B3</code>, <code>=C4-B4</code>… Une formule écrite une fois, appliquée à 200 lignes.<br><br>Plus rapide encore : double-cliquez sur le petit carré, Excel recopie jusqu'en bas tout seul, tant qu'il y a des données à côté. Et sous forme de tableau, c'est automatique : dès que vous validez la formule dans la première ligne, toute la colonne se remplit.",

    "<div class=\"todo\">À faire maintenant : ajoutez une colonne « Part du total » : dans la première ligne, tapez = puis cliquez sur le montant, tapez /, cliquez sur le total, Entrée. Puis bouton %. Tirez vers le bas… et regardez : ça donne des erreurs ou des zéros à partir de la deuxième ligne. C'est normal, et c'est le sujet du point suivant.</div>",

    "<h3>5. Le dollar, ou pourquoi la recopie casse parfois</h3>Quand vous recopiez <code>=C2/C24</code> vers le bas, Excel adapte <i>les deux</i> adresses : <code>=C3/C25</code>, <code>=C4/C26</code>… Or le total est en C24 et ne doit pas bouger. Pour dire à Excel « cette adresse-là, ne la change pas », on met des dollars : <code>=C2/$C$24</code>. Le $ devant la lettre bloque la colonne, le $ devant le numéro bloque la ligne. Astuce : quand vous cliquez sur C24 en écrivant la formule, appuyez sur la touche <kbd>F4</kbd> : les dollars s'ajoutent tout seuls.<br><br>C'est le point précis où la plupart des gens abandonnent Excel, parce que « ça marche pas et je ne sais pas pourquoi ». Vous, vous savez maintenant pourquoi.",

    "<h3>6. Demander une formule — Copilot ou ChatGPT</h3><b>Avec le bouton Copilot dans Excel</b> : cliquez dans votre tableau, bouton Copilot, et écrivez en français ce que vous voulez : « Ajoute une colonne qui calcule l'écart entre Reçu et Commandé, en pourcentage du commandé. » Copilot propose une colonne avec la formule, et l'explique. Vous cliquez sur Insérer. Puis vous vérifiez une ligne à la main — Copilot se trompe rarement sur une formule simple, mais il se trompe, et c'est votre tableau.<br><br><b>Sans le bouton — Copilot Chat ou ChatGPT</b> : la méthode exacte. Décrivez vos colonnes avec leurs lettres (« A = Produit, B = Quantité commandée, C = Quantité reçue »), donnez deux lignes d'exemple, dites le résultat voulu et dans quelle cellule (« je veux en D2 l'écart en nombre, en E2 l'écart en pourcentage »), et précisez <b>« en français, pour Excel »</b>. C'est essentiel : les noms de fonctions changent selon la langue, et <code>SUM</code> collé dans votre Excel affichera une erreur là où <code>SOMME</code> marche. Ajoutez « explique-moi ce que fait chaque partie » : vous copiez la formule, et vous la comprenez.<br><br>Puis, toujours : vérifiez sur une ligne à la main avant de recopier. Si le résultat est faux, donnez le cas précis à l'IA — « pour la ligne 4, ça donne 95, j'attendais 92 » — et elle corrige en un échange."
  ],

/* ═══════════════════════ SÉANCE 7 ═══════════════════════ */
{ id:"s7", num:7, t:"Excel — trier, filtrer, faire ressortir", icon:"🔎", cat:"excel", dur:"20 min",
  obj:"Retrouver une ligne en deux secondes dans un tableau de contrôle, et faire apparaître les anomalies toutes seules. Puis un premier graphique.",
  lesson:[
    "<b>Le point de départ.</b> Vous triez et filtrez déjà un peu. On solidifie, on ajoute l'outil qui va le plus vous servir sur vos contrôles — la mise en forme conditionnelle — et on termine par un graphique en deux clics. Toujours sur votre tableau des séances 5 et 6.",

    "<h3>1. Le filtre</h3>Si votre tableau est sous forme de tableau, les flèches de filtre sont déjà sur chaque en-tête. Sinon : cliquez dans le tableau, onglet <b>Données → Filtrer</b>, et elles apparaissent. Cliquez sur la flèche d'une colonne : une liste de toutes les valeurs de cette colonne s'affiche avec des cases à cocher. Décochez « Sélectionner tout », cochez ce que vous voulez voir, OK. Les autres lignes sont <i>masquées</i> — pas supprimées. Les numéros de lignes à gauche deviennent bleus et sautent : c'est le signe qu'un filtre est actif.<br><br>Les filtres se cumulent. Dans un suivi du circuit du linge : flèche « Étage », cochez 2 ; puis flèche « Résultat », cochez « Non conforme ». Deux clics, et vous avez exactement les lignes qui posent problème au 2e étage. Pour tout réafficher : la flèche, puis « Effacer le filtre », ou Données → Effacer.<br><br>Dans la liste des valeurs, il y a aussi une zone de recherche : tapez trois lettres d'un produit, la liste se réduit. Et sur une colonne de nombres ou de dates, « Filtres numériques » ou « Filtres chronologiques » proposent « supérieur à », « ce mois-ci », « entre ». Vous n'avez pas besoin de les connaître, seulement de savoir qu'ils sont là.",

    "<div class=\"todo\">À faire maintenant : sur votre tableau, flèche de la colonne catégorie, ne cochez qu'une catégorie, OK. Comptez les lignes restantes. Puis Données → Effacer. Puis sur la colonne montants : flèche → Filtres numériques → Supérieur à → tapez un seuil. Regardez ce qui reste.</div>",

    "<h3>2. Le tri, et son piège</h3>Même flèche : « Trier de A à Z », « Trier du plus petit au plus grand », « Trier du plus ancien au plus récent ». Le tableau entier se réorganise, les lignes restent solidaires.<br><br>Le piège, qui a fait perdre des heures à beaucoup de monde : si vous <b>sélectionnez une colonne</b> (clic sur la lettre en haut) avant de trier, Excel ne trie que cette colonne et vos lignes se désolidarisent — le nom de la chambre 12 se retrouve en face des données de la chambre 30, sans aucun message. Si ça vous arrive : <kbd>Ctrl</kbd> + <kbd>Z</kbd> immédiatement. Pour trier sans risque : cliquez dans <b>une seule cellule</b> du tableau et laissez Excel repérer l'ensemble, ou utilisez la flèche du filtre. Et rappel de la séance 5 : une ligne vide au milieu, et Excel s'arrête là.",

    "<h3>3. La mise en forme conditionnelle</h3>C'est l'outil qui vous fera gagner le plus de temps sur un contrôle. Elle colore automatiquement les cellules selon leur contenu — et elle continue de le faire pour les lignes que vous saisirez demain.<br><br>Le geste : sélectionnez la colonne concernée (clic sur la première cellule, puis Maj + clic sur la dernière), onglet <b>Accueil → Mise en forme conditionnelle → Règles de mise en surbrillance des cellules</b>. Vous choisissez : « Supérieur à… », « Inférieur à… », « Égal à… », « Texte qui contient… ». Une petite fenêtre s'ouvre : vous tapez le seuil ou le mot, vous choisissez la couleur (« Remplissage rouge clair avec texte rouge foncé » est parfait), OK.<br><br>Trois règles pour votre métier. Sur une colonne de stock : <i>Inférieur à</i> le seuil de réapprovisionnement → rouge. Sur une colonne « Résultat » de contrôle : <i>Texte qui contient</i> « Non conforme » → rouge, et une deuxième règle « Conforme » → vert. Sur une colonne d'échéances : <i>Inférieur à</i> la date du jour → orange (tapez <code>=AUJOURDHUI()</code> dans la fenêtre, Excel comprend « la date d'aujourd'hui, quelle qu'elle soit »).<br><br>Vous ouvrez le fichier, vous voyez les couleurs, vous savez où agir. Vous ne cherchez plus les anomalies : elles se signalent. C'est exactement ce que fait la collègue « douée en informatique » : la même chose que vous, en plus court et plus lisible.",

    "<div class=\"todo\">À faire maintenant : sélectionnez votre colonne de montants, Accueil → Mise en forme conditionnelle → Règles de mise en surbrillance → Supérieur à → un seuil → rouge → OK. Puis ajoutez une ligne en bas avec un montant au-dessus du seuil : elle passe en rouge toute seule.</div>",

    "<h3>4. Un graphique en deux clics</h3>Pour une réunion ou une présentation à la direction, un graphique parle plus qu'un tableau. Sélectionnez deux colonnes (par exemple catégorie et montant — cliquez sur l'en-tête de la première, Ctrl + clic sur celui de la seconde), puis onglet <b>Insertion → Graphiques recommandés</b>. Excel propose trois ou quatre graphiques adaptés à vos données ; vous choisissez, OK. Le graphique apparaît sur la feuille, vous pouvez le déplacer et le redimensionner par les coins. Cliquez sur le titre pour le changer.<br><br>Pour l'envoyer : cliquez sur le graphique, Ctrl + C, et Ctrl + V dans un mail ou un Word. Ou capture d'écran, séance 1.",

    "<h3>5. Avec Copilot</h3>Si vous avez le bouton : « Colore en rouge les résultats non conformes », « Filtre sur le 2e étage », « Fais un graphique du nombre de non-conformités par étage », « Quel étage a le plus de non-conformités ce mois-ci ? ». Copilot propose, montre, et vous validez. Sur les questions de comptage et de comparaison, il calcule vraiment, à partir du tableau — c'est fiable, à condition que le tableau soit propre (séance 5) et que vous vérifiiez un chiffre à la main la première fois.<br><br>Sans le bouton : la demande à Copilot Chat ou ChatGPT, comme à la séance 6 — « explique-moi étape par étape comment colorer en rouge les cellules contenant « Non conforme », pour Excel en français ». Il vous décrit le menu, vous suivez. La deuxième fois, vous n'aurez plus besoin de demander."
  ],
  prac:[
    { type:"order", title:"Trouver les non-conformités d'un étage",
      intro:"Votre tableau de contrôle du linge contient 300 lignes : date, étage, chambre, type de contrôle, résultat. Vous voulez voir uniquement les non-conformités du 2e étage, puis tout réafficher. Remettez les gestes dans l'ordre.",
      steps:[
        "Cliquer dans une cellule du tableau",
        "Vérifier que les flèches de filtre sont là (sinon Données → Filtrer)",
        "Flèche de la colonne « Étage », décocher tout, cocher « 2 », OK",
        "Flèche de la colonne « Résultat », décocher tout, cocher « Non conforme », OK",
        "Lire les lignes restantes et agir",

      ] },
    { type:"scenario", title:"Le tri qui casse tout",
      situation:"Vous voulez trier votre tableau de stocks par quantité croissante. Vous sélectionnez la colonne « Quantité » d'un clic sur sa lettre, puis vous triez. Les quantités se rangent bien, mais les noms de produits en face n'ont plus rien à voir.",
      options:["C'est normal, il faut retrier la colonne des noms aussi.","Excel n'a trié que la colonne sélectionnée : les lignes sont désolidarisées. Ctrl + Z immédiatement, puis cliquer dans une seule cellule et retrier.","Le tableau est perdu."],
      a:1, e:"Ctrl + Z vous sauve. Ensuite, une seule cellule sélectionnée, et Excel trie le tableau entier en gardant les lignes solidaires." },
    { type:"classify", title:"Quelle règle de couleur ?",
      intro:"Pour chaque besoin, la bonne règle de mise en forme conditionnelle.",
      buckets:["Inférieur à… (nombre)","Texte qui contient…","Inférieur à =AUJOURDHUI()"],
      items:[
        {t:"Stocks sous le seuil de réapprovisionnement en rouge", a:0},
        {t:"Contrôles « Non conforme » en rouge", a:1},
        {t:"Échéances de plan d'action dépassées en orange", a:2},
        {t:"Fournisseur « Blanchisserie » en jaune pour le repérer", a:1},
        {t:"Températures de frigo en dessous du minimum", a:0},
        {t:"Dates de péremption déjà passées", a:2}
      ] },
    { type:"scenario", title:"Le filtre oublié",
      situation:"Une collègue vous dit que « la moitié du tableau a disparu ». Vous regardez : les numéros de lignes à gauche sont bleus et sautent de 12 à 47.",
      options:["Les lignes ont été supprimées, il faut les ressaisir.","Un filtre est actif : les lignes sont masquées, pas supprimées. Données → Effacer.","Le fichier est cassé."],
      a:1, e:"Numéros bleus qui sautent = filtre actif. Rien n'est perdu. C'est la question la plus fréquente qu'on vous posera quand vous serez celle qui sait." },
    { type:"write", title:"Vos trois règles de couleur",
      intro:"Pour un de vos vrais fichiers de suivi (contrôles, stocks, plans d'action), écrivez les trois règles de mise en forme conditionnelle que vous mettriez en place : la colonne, la condition, la couleur, et ce que ça vous fait voir en ouvrant le fichier.",
      criteres:[
        { label:"Trois règles distinctes", test:t=>(t.match(/(rouge|orange|vert|jaune)/g)||[]).length>=3, aide:"Trois règles, trois couleurs ou trois conditions." },
        { label:"Chaque règle nomme sa colonne", test:t=>(t.match(/(colonne|sur la colonne|dans la colonne)/g)||[]).length>=2 || (t.match(/(resultat|stock|quantite|echeance|date|temperature|statut)/g)||[]).length>=3, aide:"« Colonne Résultat », « colonne Échéance »…" },
        { label:"Chaque règle a une condition précise (seuil, texte, date)", test:t=>/(inferieur|superieur|contient|egal|aujourd)/.test(t) && (t.match(/(inferieur|superieur|contient|egal|aujourd|seuil|\d+)/g)||[]).length>=3, aide:"« Inférieur à 10 », « Texte qui contient Non conforme », « Inférieur à =AUJOURDHUI() »." },
        { label:"Ce que vous verrez en ouvrant le fichier", test:t=>/(je vois|d.un coup d.oeil|en ouvrant|tout de suite|saute aux yeux|sans chercher)/.test(t), aide:"« En ouvrant le fichier, je vois en rouge les contrôles à reprendre. »" }
      ],
      modele:"Fichier : suivi des contrôles du circuit du linge.\n\n1. Colonne Résultat — Texte qui contient « Non conforme » → rouge. Colonne Résultat — Texte qui contient « Conforme » → vert.\n2. Colonne Date de reprise — Inférieur à =AUJOURDHUI() et pas encore traité → orange.\n3. Colonne Stock draps — Inférieur à 40 → rouge.\n\nEn ouvrant le fichier le lundi, je vois d'un coup d'œil les contrôles à reprendre, ceux dont la date est passée, et les stocks à recommander — sans chercher.",
      conseil:"Mettez-les en place pour de vrai quand vous aurez reconstruit ce fichier (séance 9). Ce texte, c'est le plan." }
  ],
  quiz:[
    { d:1, q:"Le filtre (Données → Filtrer) :", o:["Supprime les lignes","Masque les lignes non cochées sans les supprimer","Trie","Colore"], a:1, e:"Numéros de lignes bleus qui sautent = filtre actif. Données → Effacer réaffiche." },
    { d:2, q:"Vous triez après avoir sélectionné une seule colonne. Résultat :", o:["Parfait","Les lignes se désolidarisent — Ctrl + Z, puis une seule cellule sélectionnée et retrier","Excel refuse","Rien ne change"], a:1, e:"Sans message d'alerte. Le nom de la chambre 12 en face des données de la chambre 30." },
    { d:1, q:"La mise en forme conditionnelle sert à…", o:["Rendre joli","Colorer automatiquement les cellules selon leur contenu, y compris celles saisies demain","Trier","Additionner"], a:1, e:"Les anomalies se signalent seules." },
    { d:2, q:"Pour colorer les échéances déjà passées :", o:["Inférieur à 0","Inférieur à =AUJOURDHUI()","Texte qui contient « passé »","Impossible"], a:1, e:"Excel comprend « la date d'aujourd'hui, quelle qu'elle soit ». La règle reste juste tous les jours." },
    { d:1, q:"Pour colorer les « Non conforme » :", o:["Inférieur à","Texte qui contient…","Supérieur à","Égal à 0"], a:1, e:"Règles de mise en surbrillance → Texte qui contient → « Non conforme » → rouge." },
    { d:2, q:"Deux filtres sur deux colonnes (étage = 2, résultat = non conforme) :", o:["Impossible","Se cumulent : seules les lignes qui remplissent les deux conditions restent","S'annulent","Il faut deux tableaux"], a:1, e:"Deux clics, et vous avez exactement les lignes qui posent problème." },
    { d:1, q:"Un graphique en deux clics :", o:["Insertion → Graphiques recommandés","Fichier → Imprimer","Données → Filtrer","Accueil → Couleur"], a:0, e:"Sélectionnez deux colonnes, Insertion → Graphiques recommandés, choisissez." },
    { d:2, q:"Copilot répond « l'étage 2 a 14 non-conformités ce mois-ci ». Vous…", o:["Le notez","Vérifiez une fois à la main avec un filtre — puis vous lui faites confiance sur ce tableau","Le contestez","Recommencez"], a:1, e:"Sur un tableau propre, il calcule vraiment. La première fois, on contrôle." }

/* ═══════════════════════ SÉANCE 8 ═══════════════════════ */
{ id:"s8", num:8, t:"Les plannings et les remplacements", icon:"📅", cat:"metier", dur:"20 min",
  obj:"Voir ce que l'IA peut et ne peut pas faire sur votre sujet numéro un, ce que fait Octime, et écrire vos règles de remplacement — pour qu'elles ne reposent plus uniquement sur vous.",
  lesson:[
    "<b>Le sujet.</b> Vous avez répondu que si l'IA pouvait faire une seule chose pour vous, ce serait gérer les plannings. Et gérer les remplacements est la tâche que vous détestez le plus. Il faut être honnête sur ce qui est possible, et précis sur ce qui va vraiment vous soulager.",

    "<h3>1. Ce que l'IA ne fera pas</h3>Elle ne fera pas votre planning. Elle ne connaît ni vos contrats, ni les temps partiels, ni qui ne peut pas travailler le mercredi, ni les règles de repos applicables, ni les préférences, ni les tensions. Et elle ne doit pas les connaître : un planning nominatif est une donnée de salariés — rouge, séance 4. Si vous lui demandez « fais-moi le planning de mes 18 agents », elle produira un tableau plausible, joli, et inutilisable, en inventant les contraintes. C'est la séance 2 appliquée à votre sujet le plus sensible.<br><br>Elle ne vous dira pas non plus le délai légal de prévenance pour modifier un planning, ni les règles de repos entre deux services : elle vous donnera un chiffre, plausible, et vous ne saurez pas s'il est juste. Ça, c'est la convention collective, l'accord d'établissement, et les RH.",

    "<h3>2. Octime, et ce qu'il fait à votre place</h3>Dans votre futur poste, le planning vit dans <b>Octime</b>. C'est un logiciel dédié : il connaît les contrats, compte les heures, applique les règles de repos paramétrées par l'établissement, et signale les dépassements. Tout ce que vous auriez pu vouloir construire dans Excel pour « totaliser les heures et alerter », Octime le fait déjà — mieux, parce qu'il a les règles.<br><br>Ce que ça change pour vous : votre travail n'est plus de calculer, c'est de <i>décider</i>. Qui remplace qui, dans quel ordre on sollicite, ce qu'on fait quand personne ne répond. Et c'est là que l'IA aide — pas sur le planning, sur les règles et sur les messages.<br><br>Deux usages d'Excel restent utiles autour d'Octime. <b>L'export</b> : la plupart des logiciels de planning permettent d'exporter un tableau vers Excel ; avec vos filtres et vos couleurs (séance 7), vous pouvez alors regarder ce qu'Octime ne montre pas d'un coup — combien de fois chaque secteur a été en sous-effectif ce trimestre, quels créneaux sont les plus souvent à découvert. Demandez au support Octime ou à un collègue comment exporter ; c'est un menu, pas une compétence. <b>Le suivi des sollicitations</b> : un petit tableau à vous, sans nom — date, créneau, nombre de personnes sollicitées, délai avant de trouver, solution finale — qui vous dira au bout de deux mois où ça coince structurellement.",

    "<h3>3. Les règles de remplacement — le vrai gain</h3>Ce qui vous coûte dans un remplacement, ce n'est pas le calcul. C'est la décision, prise seule, à chaud, et les appels qui suivent. Et cette décision, aujourd'hui, repose sur des règles qui n'existent que dans votre tête : qui vous appelez d'abord, qui est volontaire pour des heures, ce que vous ne faites jamais, ce que vous faites quand la liste est épuisée.<br><br>Écrire ces règles, en une page, change trois choses. <b>Vous décidez plus vite</b>, parce que vous appliquez au lieu de réinventer. <b>Une collègue peut les appliquer à votre place</b> le jour où vous n'êtes pas là — et le jour où vous êtes là mais où vous avez autre chose à faire. <b>Le sujet cesse de reposer uniquement sur vous.</b> Des règles écrites se partagent, se discutent avec la direction, s'améliorent. Une tête ne se partage pas. C'est de la protection, pour vous et pour l'établissement.<br><br>L'IA sert ici à <b>structurer ce que vous dictez</b>. Ouvrez ChatGPT sur votre téléphone, appuyez sur le micro, et racontez pendant deux minutes comment vous faites vraiment quand quelqu'un manque — sans aucun nom. Puis : « Structure ça en une page : ordre de sollicitation, critères, ce qu'on ne fait jamais, et que faire si personne ne répond. N'ajoute rien que je n'ai pas dit ; si un point manque, pose-moi la question. » Vous relisez, vous complétez, vous faites valider par la direction.",

    "<div class=\"todo\">À faire maintenant, cinq minutes : dictez vos règles de remplacement telles que vous les appliquez, sans nom, dans ChatGPT en mode vocal. Vous n'êtes pas obligée d'être complète. C'est le premier jet, et c'est la mission de cette séance.</div>",

    "<h3>4. Les messages de recherche de remplaçant</h3>Deuxième usage concret : les messages. Trouver un remplaçant, c'est souvent envoyer six fois le même message en changeant le prénom, sur un téléphone, en courant. L'IA vous prépare <b>trois versions</b> — neutre, pressante, avec une porte de sortie — que vous gardez dans les notes de votre téléphone et que vous adaptez en dix secondes. « Tu es responsable hébergement en EHPAD. Rédige trois versions courtes d'un message pour proposer un remplacement à une agente : une neutre, une plus pressante quand c'est urgent, une qui laisse clairement le choix. Format : trois messages de 3 lignes maximum, tutoiement, pas de culpabilisation. »<br><br>Le choix de la version se fait selon la personne et la situation, pas selon votre stress du moment. C'est aussi ce qu'une règle écrite permet : « en dessous de deux heures avant le service, version pressante ; sinon, neutre ».",

    "<h3>5. Annoncer un changement à l'équipe</h3>Dernier usage, le plus délicat : annoncer à 18 personnes un changement d'organisation — nouveaux horaires, nouveau roulement, nouvelle règle. L'IA est bonne pour ça, à condition de lui donner le contexte : ce qui change, pourquoi, à partir de quand, ce que l'équipe risque de mal prendre, et ce qui ne change pas. Elle vous propose un message qui anticipe les objections au lieu de les subir. Et elle peut vous aider à préparer la réunion : « Quelles sont les cinq questions que l'équipe va me poser, et comment y répondre sans promettre ce que je ne contrôle pas ? »<br><br>Le vrai gain sur les plannings n'est donc pas « l'IA fait le planning ». C'est : Octime calcule, vos règles écrites décident, l'IA rédige ce qu'il faut envoyer. Moins spectaculaire, beaucoup plus solide."
  ],
