{ id:"s9", num:9, t:"Le répétitif : modèles et fichiers annuels", icon:"🔁", cat:"metier", dur:"20 min",
  obj:"Faire une fois ce que vous refaites chaque semaine, et ne plus le refaire. Modèles Word et Excel, fichier annuel filtrable, plan de table — et constituer le dossier que vous emporterez.",
  lesson:[
    "<b>Le constat.</b> Vous refaites chaque semaine à l'identique : les plans de table, les contrôles, le suivi des plans d'action. « À l'identique » est le mot important. Tout ce qui se refait à l'identique n'a pas à être refait : il a à être <b>dupliqué</b>. Cette séance transforme trois de vos corvées hebdomadaires en trois fichiers que vous ouvrirez et remplirez.",

    "<h3>1. Le modèle : la copie neuve garantie</h3>Vous connaissez le problème : un fichier « Plan de table » que vous modifiez chaque semaine, et un jour vous écrasez la version de la semaine dernière, ou vous vous retrouvez avec « Plan de table - copie - v2 - final - VRAI final ». Le modèle règle ça.<br><br>Construisez le fichier une fois, proprement, vide de données mais avec sa structure, ses en-têtes, ses formules et ses couleurs. Puis <b>Fichier → Enregistrer sous</b> → dans la liste « Type », choisissez <b>Modèle Excel (*.xltx)</b> ou <b>Modèle Word (*.dotx)</b>. Excel propose alors de le ranger dans un dossier spécial « Modèles Office personnalisés » ; acceptez, ou choisissez votre propre dossier « Modèles » dans Documents.<br><br>Ce qui change : quand vous double-cliquez sur un modèle, Excel n'ouvre pas le modèle — il ouvre une <b>copie neuve</b>, sans nom (« Classeur1 »). Vous la remplissez, vous l'enregistrez sous le nom de la semaine. L'original reste intact, toujours vide, toujours prêt. Vous ne pouvez plus l'écraser par erreur, parce que vous n'êtes jamais dedans.",

    "<div class=\"todo\">À faire maintenant : ouvrez votre tableau des séances 5-7, supprimez les données (gardez la ligne d'en-têtes, les formules de la ligne des totaux, les couleurs), Fichier → Enregistrer sous → type Modèle Excel (.xltx) → dossier Modèles. Fermez tout. Double-cliquez sur le modèle : regardez le nom en haut de la fenêtre. Ce n'est pas le modèle, c'est une copie.</div>",

    "<h3>2. Le fichier annuel filtrable</h3>Pour les contrôles et les plans d'action, il y a mieux qu'un modèle par semaine : <b>un seul fichier pour l'année</b>, une ligne par contrôle ou par action, avec les colonnes de la séance 5 et les filtres de la séance 7.<br><br>Pourquoi : quand la direction demande « combien de non-conformités sur le linge ce trimestre ? », avec douze fichiers mensuels, c'est douze ouvertures et une addition à la main. Avec un fichier annuel, c'est deux clics de filtre — et le total en bas se met à jour tout seul. Quand un inspecteur demande l'historique d'une chambre, c'est un filtre sur la colonne Chambre. Quand vous voulez savoir si les non-conformités baissent, c'est un graphique en deux clics.<br><br>Les colonnes d'un fichier de contrôles : Date, Secteur (ou Étage), Chambre ou Zone, Type de contrôle, Résultat (Conforme / Non conforme), Action décidée, Responsable (la fonction, pas le nom), Échéance, Statut (À faire / En cours / Terminé), Commentaire. Mise sous forme de tableau. Mises en forme conditionnelles : Non conforme en rouge, échéance dépassée et statut différent de Terminé en orange, Terminé en vert.<br><br>Le suivi des plans d'action — la tâche que vous détestez suivre — se construit exactement pareil : Date, Origine (audit, réclamation, incident, réunion), Action, Responsable, Échéance, Statut, Commentaire. Et une cellule au-dessus qui compte les actions en retard, avec une formule que l'IA vous expliquera : <code>=NB.SI.ENS(...)</code>. Vous ouvrez le fichier le lundi, le chiffre est là.",

    "<h3>3. Le plan de table</h3>La structure ne change pas d'une semaine à l'autre : ce sont les places qui bougent. Dans Excel, une feuille avec une ligne par table et une colonne par place. Vous tapez les prénoms (ce fichier reste dans l'établissement — c'est du rouge pour l'IA, séance 4, mais du normal pour Excel). Pour l'imprimer lisiblement en salle : sélectionnez la zone, onglet Accueil → Bordures → Toutes les bordures ; taille de police 14 ; Mise en page → Orientation → Paysage ; Fichier → Imprimer, et cochez « Ajuster la feuille à une page ». Ça suffit, et ça évite de repasser par Publisher — chaque changement d'outil pour un même document ajoute du temps.<br><br>Enregistré en modèle : chaque semaine, double-clic, vous déplacez trois prénoms, vous imprimez. Trois minutes au lieu de vingt.",

    "<h3>4. L'IA construit les modèles, elle ne les remplit pas</h3>Pour chaque fichier, une seule demande à Copilot Chat ou ChatGPT, une seule fois : « Je suis responsable hébergement en EHPAD et je veux créer un modèle Excel de suivi des plans d'action. Aujourd'hui je le refais à la main et je perds du temps à suivre les échéances. Propose-moi les colonnes, avec une ligne d'exemple fictive (aucune donnée réelle). Ajoute les mises en forme conditionnelles et les formules utiles : échéances dépassées en rouge, actions terminées en vert, un compteur d'actions en retard. Explique-moi comment mettre tout ça en place étape par étape, en français, pour Excel, comme à quelqu'un qui ne maîtrise pas encore Excel. »<br><br>Vous passez vingt minutes une fois. Vous gagnez vingt minutes chaque semaine. Et avec le bouton Copilot dans Excel : « Crée un tableau de suivi des plans d'action avec ces colonnes, une ligne d'exemple, et colore en rouge les échéances dépassées » — il le fait sous vos yeux, vous ajustez.",

    "<div class=\"todo\">À faire maintenant : faites cette demande, pour de vrai, pour le fichier qui vous coûte le plus (contrôles ou plans d'action). Lisez la réponse. Vous n'avez pas à tout construire ce soir — c'est la mission — mais lisez : vous verrez que ce sont des menus que vous connaissez maintenant.</div>",

    "<h3>5. Le dossier que vous emportez</h3>Un dossier « Modèles » sur votre ordinateur, et une copie sur une clé USB. Dedans, d'ici la reprise : le suivi des contrôles (fichier annuel, vide, avec ses colonnes, ses filtres, ses couleurs), le suivi des plans d'action (idem, avec son compteur), le plan de table (modèle), et tout ce que vous ajouterez — suivi des commandes, inventaire de lingerie, liste des prestataires avec leurs contacts et leurs délais.<br><br>Une responsable qui arrive dans un établissement avec ce dossier fait gagner des semaines. Ce n'est pas un détail : c'est un argument, et c'est le sujet de la séance 13. Chaque modèle que vous construisez d'ici là est une pièce de ce dossier."

{ id:"s10", num:10, t:"Écrire : mails délicats et comptes-rendus", icon:"✉️", cat:"metier", dur:"20 min",
  obj:"Passer de vingt minutes à cinq sur un mail difficile, avec vos mots et sans rien promettre de travers. Copilot dans Outlook et Word, et un projet ChatGPT en secours.",
  lesson:[
    "<b>Le constat.</b> Un mail délicat vous prend entre cinq et vingt minutes. Ce ne sont pas les mots qui coûtent, c'est le dosage : reconnaître sans se justifier, être ferme sans être sèche, engager l'établissement sans promettre ce qu'on ne tiendra pas. C'est exactement le type de tâche où l'IA fait gagner le plus — à une condition : qu'elle connaisse votre ton, et qu'elle n'invente rien.",

    "<h3>1. Copilot dans Outlook</h3>Dans votre futur établissement, Outlook aura Copilot. Deux gestes.<br><br><b>Résumer</b> : sur un long échange de mails (une famille qui a écrit quatre fois, un prestataire qui répond en cascade), un bouton « Résumer » en haut de la conversation vous donne l'essentiel en cinq lignes : qui demande quoi, ce qui a été répondu, ce qui reste ouvert. Vous ne relisez plus vingt mails pour retrouver où on en est.<br><br><b>Rédiger</b> : dans un nouveau mail ou une réponse, un bouton Copilot « Brouillon avec Copilot ». Vous tapez votre demande en français — les quatre éléments de la séance 3 : « Réponds à cette famille : reconnaître le problème de linge mélangé sans me justifier longuement, dire que le prestataire a été relancé, aucune promesse de délai, ton chaleureux, dix lignes. » Copilot lit le mail reçu (il a le contexte) et propose un brouillon. Vous pouvez demander « plus court », « plus chaleureux », « plus direct ». Puis vous relisez, vous corrigez, et c'est vous qui cliquez sur Envoyer.<br><br>Ce que Copilot ne fait pas : envoyer à votre place. Ni Copilot, ni ChatGPT, ni aucun outil. Vous relisez toujours, vous cliquez toujours. C'est une bonne chose — c'est ce qui garantit qu'aucune promesse inventée ne part.",

    "<h3>2. La règle de relecture</h3>Un brouillon d'IA se relit en cherchant une seule chose : <b>ce qui engage</b>. Un délai (« sous 48 h », « dès la semaine prochaine »), une action (« nous mettrons en place un contrôle quotidien »), un geste (« nous prendrons en charge »), un chiffre. Si vous ne l'avez pas écrit dans votre demande, l'IA l'a comblé avec du vraisemblable — séance 2. Envoyée, cette phrase engage l'établissement devant une famille. Vous la supprimez ou vous la remplacez par ce qui est vrai.<br><br>Le ton, la structure, les tournures : vous les prenez. Les engagements : vous les vérifiez un par un. Ça prend trente secondes, et c'est ce qui rend l'usage sûr.",

    "<div class=\"todo\">À faire maintenant, sur votre ChatGPT perso en attendant Copilot : collez ce mail fictif — « Bonjour, je suis la fille d'une résidente. Pour la deuxième fois en trois semaines, le linge de ma mère est revenu mélangé avec celui de quelqu'un d'autre. Je trouve ça inadmissible. Qu'est-ce que vous comptez faire ? » — et demandez une réponse avec les quatre éléments. Puis relisez le brouillon en cherchant uniquement ce qui engage. Comptez.</div>",

    "<h3>3. Le projet : votre ton, une fois pour toutes</h3>Pour vos écrits personnels et pour tout ce que Copilot ne couvre pas, ChatGPT propose les <b>projets</b>. Dans l'application, menu de gauche, « Nouveau projet ». Un projet est un dossier avec des <b>instructions permanentes</b> : tout ce que vous y écrivez démarre avec ce contexte, sans le recoller à chaque fois.<br><br>Créez-en un, appelé « Mes écrits pro », avec quatre choses. <b>Qui vous êtes et où</b> : responsable hébergement en EHPAD, équipe de service, lingerie et restauration, écrits aux familles, aux prestataires, à l'équipe, à la direction. <b>Votre ton</b> : direct, chaleureux sans être familier, vouvoiement, phrases courtes, pas de jargon administratif, pas de formule de politesse creuse. <b>Vos règles absolues</b> : jamais de nom de résident, de famille ou de salarié ; jamais de promesse de délai, d'action ou de geste que vous n'avez pas écrite — à la place, [À COMPLÉTER]. <b>Le format</b> : 8 à 12 lignes, un objet proposé en première ligne, et « tu produis un brouillon que je relis et que j'envoie moi-même ».<br><br>Et ajoutez-y <b>trois de vos vrais mails</b> que vous trouvez bien tournés, anonymisés. L'IA imite infiniment mieux qu'elle ne suit des consignes abstraites : trois exemples valent dix lignes de description. C'est ce qui fera que le brouillon vous ressemble au lieu de ressembler à une lettre type.",

    "<h3>4. Le geste quotidien</h3>Vous ouvrez le projet, vous collez le mail reçu (anonymisé), vous ajoutez une ou deux lignes de contexte — « c'est la deuxième fois, la relation est bonne, je ne veux pas m'excuser platement » — et vous obtenez un brouillon. Relecture : ce qui engage. Vous corrigez ce qui ne sonne pas comme vous. Vous collez dans Outlook, vous remettez le vrai nom, vous envoyez. Vous ne partez plus jamais d'une page blanche, et c'est là que les quinze minutes disparaissent.<br><br>Avec Copilot dans Outlook, c'est la même chose sans copier-coller, et sans anonymiser — le mail reste dans l'établissement. Mais les règles de relecture sont identiques.",

    "<h3>5. Word : le compte-rendu et le courrier</h3>Dans Word, Copilot rédige aussi : un bouton en haut du document, « Rédiger avec Copilot ». Pour un courrier officiel, une note de service, un compte-rendu — même méthode, quatre éléments. Et surtout : Copilot peut <b>relire</b>. Sélectionnez votre texte, demandez « rends ce paragraphe plus clair sans changer le sens » ou « raccourcis de moitié ». Ça, c'est de la forme : vous prenez.",

    "<h3>6. Les réunions : dicter, structurer</h3>Vos listes et vos briefings sont sur papier, et c'est très bien : le papier va plus vite dans un couloir. Ce qui coûte, c'est la mise au propre. Après une réunion, ouvrez ChatGPT sur votre iPhone, appuyez sur le micro, et racontez en vrac pendant deux minutes ce qui s'est dit, sans nom. Puis : « Structure ça en trois blocs — décisions prises, actions avec qui (par fonction) et pour quand, points en suspens. N'ajoute rien que je n'ai pas dit. » Vous obtenez un compte-rendu propre en trente secondes.<br><br>Une règle pour la relecture : une <b>décision</b> a un responsable et une date. « On est d'accord qu'il faudrait revoir le circuit du linge » n'est pas une décision, c'est un point en suspens. L'IA les confond parfois ; vous, plus maintenant."
  ],

      modele:"Tu m'aides à écrire mes courriers et mes mails professionnels. Je suis responsable hébergement dans un EHPAD et j'encadre une équipe de service, lingerie et restauration. J'écris à des familles de résidents, à des prestataires, à mon équipe et à ma direction.\n\nTon : direct, chaleureux sans être familier, vouvoiement, phrases courtes, aucun jargon administratif, pas de formule de politesse creuse.\n\nRègles absolues : ne mets jamais de nom de résident, de famille ou de salarié — j'utilise « une résidente », « une agente », et je remets les vrais noms moi-même à la fin. Ne promets jamais un délai, une action ou un geste que je n'ai pas indiqués ; si tu en as besoin, écris [À COMPLÉTER].\n\nFormat : 8 à 12 lignes, un objet proposé en première ligne.\n\nTu produis un brouillon. Je relis, je corrige et j'envoie moi-même.",

    { type:"write", title:"Du vrac au compte-rendu",

/* ═══════════════════════ SÉANCE 11 ═══════════════════════ */
{ id:"s11", num:11, t:"Pour vous : apprendre et créer", icon:"🌱", cat:"soi", dur:"20 min",
  obj:"Apprendre un sujet avec l'IA comme professeur particulier, et faire enfin ce montage vidéo. Cette séance ne parle pas d'EHPAD.",
  lesson:[
    "<b>Pourquoi cette séance.</b> Vous avez répondu que dans votre vie personnelle, ce que vous voudriez, c'est apprendre quelque chose. Et que vous avez toujours voulu savoir faire un montage vidéo. Cette séance est pour vous, pas pour l'établissement. Et elle utilise l'IA là où elle est la meilleure et la plus sûre.",

    "<h3>1. L'IA comme professeur particulier</h3>C'est son meilleur usage, et le moins risqué : quand elle explique un sujet de connaissance générale — comment fonctionne une pompe à chaleur, ce qu'est la photosynthèse, pourquoi le pain lève, comment marche un prêt immobilier, ce que veut dire un mot — elle se trompe beaucoup moins que sur des faits précis de votre métier, parce que ces connaissances sont dans des milliers de livres et de cours qu'elle a lus. Et vous pouvez l'interrompre, la faire répéter, lui dire « je n'ai pas compris » autant de fois que vous voulez, sans gêne. Une IA ne soupire jamais. C'est précisément ce qui manque quand on n'ose pas demander.",

    "<h3>2. La demande qui en fait un cours</h3>Une demande ordinaire — « explique-moi la photosynthèse » — donne un exposé : trois paragraphes qu'on lit et qu'on oublie. La demande qui en fait un cours particulier contient cinq choses.<br><br><b>Le sujet précis</b> : « je veux comprendre comment fonctionne une pompe à chaleur ». <b>Votre niveau de départ</b> : « je ne connais rien au départ, à part le mot » ou « j'ai quelques notions ». Ça règle tout le niveau de la réponse. <b>Un format progressif</b> : « en cinq étapes, en partant de zéro, avec un exemple concret ou une image à chaque étape ». <b>L'interrogation</b> : « après chaque étape, pose-moi une question simple pour vérifier que j'ai compris, et attends ma réponse avant de continuer ». C'est cette phrase qui transforme l'exposé en cours : elle vous fait participer, et l'IA adapte la suite à ce que vous avez répondu. <b>Pas de jargon</b> : « n'utilise aucun terme technique sans l'expliquer juste après ».<br><br>Et la phrase qui vaut de l'or, à utiliser sans aucune gêne : « <b>Je n'ai pas compris, réexplique autrement, avec une image.</b> » Elle trouvera une comparaison différente. Puis une autre. Jusqu'à ce que ça passe.",

    "<div class=\"todo\">À faire maintenant, dix minutes : choisissez un sujet qui vous trotte dans la tête — n'importe lequel — et faites la demande complète dans ChatGPT. Répondez aux questions qu'elle pose. Si une étape ne passe pas, dites-le. Vous verrez la différence avec un exposé.</div>",

    "<h3>3. Ce qui reste à vérifier, même là</h3>Sur la connaissance générale, l'IA est fiable sur le <i>mécanisme</i> — comment ça marche — et moins sur les <i>chiffres</i> — combien ça coûte, quel rendement, quelle date. Si elle vous dit « une pompe à chaleur divise la facture par trois », c'est un chiffre : vérifiable, donc à vérifier, ou à prendre comme un ordre de grandeur et pas comme une promesse. Le mécanisme, vous le prenez. Le chiffre, vous le traitez comme à la séance 2.",

    "<h3>4. Le montage vidéo</h3>Vous avez un iPhone, donc vous avez déjà tout ce qu'il faut. L'application <b>iMovie</b> est gratuite (si elle n'est pas déjà sur votre téléphone, l'App Store la propose) et suffit très largement pour ce que vous voulez faire : un film de trois minutes pour une fête des familles, un anniversaire, un souvenir de vacances.<br><br>Les gestes, dans l'ordre. Ouvrez iMovie, appuyez sur <b>Nouveau projet → Film</b>. Votre pellicule s'affiche : touchez les vidéos et photos que vous voulez utiliser (une coche apparaît sur chacune), puis <b>Créer un film</b> en bas. Vos clips sont alignés sur une ligne de temps en bas de l'écran, dans l'ordre où vous les avez choisis.<br><br><b>Réordonner</b> : appuyez longuement sur un clip, il se soulève, faites-le glisser à sa nouvelle place. <b>Couper</b> : touchez un clip, il s'entoure de jaune ; tirez sur la poignée jaune du début ou de la fin pour raccourcir. Le début qui tremble, la fin où on entend « c'est bon, j'arrête », disparaissent. <b>Un titre</b> : touchez le premier clip, en bas une icône « T », choisissez un style, tapez votre texte. <b>Une musique</b> : le bouton <b>+</b> à gauche de la ligne de temps → Audio → Bandes-son : iMovie propose des musiques libres de droits, intégrées. Choisissez, la musique se cale sur la durée du film.<br><br><b>Exporter</b> : appuyez sur OK en haut à gauche, puis sur l'icône de partage (le carré avec une flèche), Enregistrer la vidéo. Elle est dans Photos, prête à être envoyée ou montrée.",

    "<div class=\"todo\">À faire maintenant, si vous avez votre iPhone : ouvrez iMovie, faites un film de trente secondes avec trois clips ou photos, coupez-en un, ajoutez un titre. Ne cherchez pas à faire beau — cherchez à faire une fois. La deuxième fois prendra dix minutes.</div>",

    "<h3>5. L'IA pour accompagner le montage</h3>Quand vous bloquez — « je ne trouve pas comment couper », « la musique est trop forte » —, demandez à ChatGPT : « Explique-moi, étape par étape, comment [ce que vous voulez] dans iMovie sur iPhone, comme à quelqu'un qui débute. » Elle décrit les boutons, vous les cherchez à l'écran, vous apprenez en faisant. Les applications changent un peu d'une version à l'autre ; si un bouton n'est pas exactement où elle dit, cherchez à côté, il y est.",

    "<h3>6. Les droits, en deux phrases</h3>Si la vidéo est montrée dans un établissement — fête des familles, écran d'accueil —, deux règles. Une <b>musique connue</b> ne peut pas être utilisée librement, même sans but commercial : utilisez les bandes-son intégrées d'iMovie, qui sont libres. Et l'<b>image des résidents et du personnel</b> relève des autorisations de droit à l'image de l'établissement — elles existent partout, vous les connaissez mieux que moi. Pour une vidéo personnelle, aucune de ces contraintes."
  ],

{ id:"s12", num:12, t:"Votre système", icon:"⚙️", cat:"soi", dur:"20 min",
  obj:"Ranger ce qui marche, mesurer ce que vous avez gagné, et savoir le transmettre. Onze séances condensées en un système qui tient sans y penser.",
  lesson:[
    "<b>Où vous en êtes.</b> Onze séances. Vous savez faire une capture d'écran, coller proprement, sortir un PDF, construire un tableau qui calcule et qui se colore tout seul, filtrer 300 lignes en deux clics, demander une formule, écrire un mail délicat en cinq minutes, structurer une réunion dictée, et apprendre un sujet avec un professeur particulier disponible à minuit. Ce qui reste, c'est de transformer ça en <b>système</b> — c'est-à-dire en choses rangées à un endroit précis, qu'on retrouve sans chercher.",

    "<h3>1. Les six raccourcis</h3>Ils sont dans les doigts ou presque. <kbd>Windows</kbd>+<kbd>Maj</kbd>+<kbd>S</kbd> capture, <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>V</kbd> colle propre, <kbd>Ctrl</kbd>+<kbd>P</kbd> puis PDF, <kbd>Ctrl</kbd>+<kbd>Z</kbd> annule, <kbd>Ctrl</kbd>+<kbd>S</kbd> enregistre, <kbd>Ctrl</kbd>+<kbd>F</kbd> cherche. Si le post-it est encore sous l'écran, gardez-le une semaine de plus. Ce n'est pas un échec : c'est comme ça que tout le monde les a appris.",

    "<h3>2. Le dossier « Modèles »</h3>Un dossier dans Documents, une copie sur clé USB. Dedans, tout ce qui se refait à l'identique : le suivi des contrôles (fichier annuel, colonnes, filtres, couleurs), le suivi des plans d'action avec son compteur, le plan de table, et ce que vous ajouterez — commandes, inventaire lingerie, liste des prestataires. Chaque fichier en .xltx ou .dotx, donc impossible à écraser.<br><br>La règle pour l'alimenter : <b>la deuxième fois que vous refaites quelque chose à l'identique, vous en faites un modèle</b>. Pas la première — la première, on ne sait pas encore si ça va se répéter. Pas la cinquième — vous avez déjà perdu quatre fois le temps.",

    "<h3>3. Le projet et le fichier « Mes demandes »</h3>Le projet « Mes écrits pro » dans ChatGPT, avec vos instructions et vos trois exemples, pour tout ce qui s'écrit. Et un simple fichier texte sur le Bureau, « Mes demandes », où vous collez les formulations qui ont bien marché : le mail à une famille, la demande de formule Excel, la construction d'un modèle, la structuration d'une réunion dictée, le cours particulier. Cinq à dix demandes suffisent pour couvrir 90 % de vos usages.<br><br>Une demande réutilisée ne se retape jamais. Vous l'ouvrez, vous copiez, vous changez deux mots, vous collez. Ce fichier grandit tout seul : chaque fois qu'une demande donne un très bon résultat, elle y va. Dans six mois, c'est votre vraie boîte à outils — et ce que vous montrerez à une collègue qui débute.",

    "<h3>4. La règle qui résume tout</h3>Si vous oubliez tout le reste, gardez celle-ci : <b>ce qui est vérifiable se vérifie, ce qui est de la forme se prend</b>.<br><br>Vérifiable : un chiffre, une date, une règle, un dosage, une température, un délai légal, une référence, un nom, un engagement dans un mail. Ça se contrôle dans les procédures, chez le fabricant, auprès du référent qualité, des RH, de la direction.<br><br>De la forme : une tournure de phrase, la structure d'un compte-rendu, une idée d'animation, une explication de ce qu'est un filtre, un plan en cinq points, un brouillon à corriger. Ça se prend tel quel.<br><br>Cette phrase couvre ChatGPT, Copilot, et tous les outils qui viendront après. Elle ne se périme pas.",

    "<h3>5. Mesurer</h3>Vous vouliez pouvoir dire, dans trois mois : « je sais faire ça », « je ne perds plus de temps à ça ». Complétez-la maintenant, précisément, avec ce que vous avez constaté — pas ce que vous espérez.<br><br>Un mail délicat qui prenait vingt minutes et en prend sept. Un bilan de contrôles qui prenait une heure et prend dix minutes. Un plan de table refait en trois minutes au lieu de vingt. Une formule Excel obtenue en deux minutes au lieu d'être abandonnée.<br><br>Écrivez ces chiffres quelque part — dans le fichier « Mes demandes », en haut. Pourquoi : parce que dans six semaines, une semaine difficile vous donnera l'impression de ne pas avoir avancé, et ce sera faux. Les chiffres, eux, ne changent pas d'humeur. Et parce que ce sont exactement ceux que vous direz en entretien, séance 13.",

    "<h3>6. Transmettre — et ce qu'il faut savoir sur ce point</h3>Vous avez répondu « pourquoi pas » à l'idée de montrer à vos collègues. Voilà la bonne façon de le faire : <b>ne montez pas une formation</b>. Montrez un seul geste, à une seule personne, au moment exact où elle en a besoin. La capture d'écran quand quelqu'un décrit péniblement un bug au téléphone. Le filtre quand une collègue fait défiler 300 lignes avec la molette. Ctrl + Z quand quelqu'un se lamente d'avoir tout effacé. Dix secondes, un geste, et c'est acquis — c'est comme ça que vous les avez appris vous-même.<br><br>Et un mot sur ce que vous avez écrit à la fin de votre questionnaire : ces « choses simples que beaucoup de monde sait faire et que je ne maîtrise toujours pas ». Personne ne les a apprises à l'école. Ceux qui les maîtrisent les ont vues faire par quelqu'un, une fois, par-dessus l'épaule. C'est tout ce qui vous séparait d'eux : pas une aptitude, une occasion. Vous venez de la prendre, et vous êtes maintenant celle qui peut la donner."
  ],

{ id:"s13", num:13, t:"Préparer la suite", icon:"🧭", cat:"soi", dur:"20 min",
  obj:"Arriver dans le prochain poste avec vos outils, vos questions et vos conditions. Ce que vous apportez, ce que vous demandez, ce que vous ne voulez plus — formulé pour être dit.",
  lesson:[
    "<b>De quoi il s'agit.</b> Vous préparez une reprise dans un autre établissement, avec Word, Excel, Octime, Netsoins et Copilot. Cette séance sert à y arriver en position de force : avec quelque chose à apporter, des questions précises à poser, et des conditions formulées de façon qu'on puisse les entendre.",

    "<h3>1. Ce que vous apportez</h3>Faites la liste, elle est plus longue que vous ne pensez. Un dossier « Modèles » avec des fichiers prêts : suivi annuel des contrôles filtrable, suivi des plans d'action avec compteur d'échéances dépassées, plan de table, et ce que vous aurez ajouté. Des règles de remplacement écrites en une page, applicables par quelqu'un d'autre. Une méthode d'écriture qui divise par trois le temps passé sur un mail difficile. Et six gestes informatiques que beaucoup de responsables n'ont pas.<br><br>Ce n'est pas un détail dans une négociation. Une responsable hébergement qui arrive avec un système organisé fait gagner des semaines à un établissement : le suivi est lisible dès le premier mois, la direction a ses chiffres sans les redemander, et l'organisation ne repose pas sur une seule tête. Formulez ça en dix lignes sobres, sans jargon, que vous puissiez dire à l'oral aussi bien qu'écrire.",

    "<h3>2. Les questions à poser</h3>Vous savez maintenant ce qui fait perdre du temps et ce qui use. Transformez chaque point en question. Ce sont des questions de professionnelle, pas de candidate inquiète — et les réponses vous disent où vous mettez les pieds.<br><br><b>Sur les outils</b> : quelle version de Copilot exactement — le bouton est-il dans Excel, Word et Outlook, ou est-ce le chat seul ? (Vous savez le reconnaître, séance 5.) Les fichiers sont-ils sur OneDrive ou SharePoint ? Puis-je installer mes propres modèles Excel sur le poste ? Qui administre Octime et qui saisit les plannings ? Y a-t-il une formation Netsoins prévue à l'arrivée ?<br><br><b>Sur l'organisation</b> : combien de personnes à encadrer, sur quels secteurs ? Qui gère les remplacements aujourd'hui, et avec quelles règles écrites ? Qui décide quand personne ne répond ? Qui prend l'astreinte ? Comment sont suivis les plans d'action, et par qui ?<br><br><b>Sur le cadre</b> : y a-t-il une charte ou une consigne écrite sur l'usage de l'IA, et que dit-elle sur les données de résidents dans Copilot ? Une formation RGPD est-elle prévue ? Ces deux questions vous placent immédiatement comme quelqu'un qui connaît le sujet — et elles vous protègent, parce que sans règle écrite, c'est vous qui portez la responsabilité de ce que vous tapez.",

    "<h3>3. Préparer avec l'IA, sans rien de nominatif</h3>Décrivez votre métier et ce que votre expérience vous a appris, sans nommer aucun établissement ni aucune personne, et demandez : « Aide-moi à préparer mes questions pour un entretien de responsable hébergement en EHPAD, classées par thème, et pour chacune ce que la réponse m'apprendrait. » Vous obtenez une grille, vous gardez ce qui vous parle.<br><br>Puis la simulation : « Joue le directeur d'un EHPAD associatif qui me reçoit pour un poste de responsable hébergement. Pose-moi les questions d'un entretien de trente minutes, une par une, en réagissant à mes réponses. Reste dans le rôle. Quand je dirai stop, sors du rôle et dis-moi ce qui t'a convaincu, ce qui a manqué, et la question à laquelle j'ai le moins bien répondu. » Faites-la deux ou trois fois. La suivante sera la vraie, et vous aurez déjà entendu les questions difficiles une fois — celle sur la gestion d'un conflit dans l'équipe, celle sur un désaccord avec une direction, celle sur ce qui vous a fait partir.",

    "<div class=\"todo\">À faire maintenant, dix minutes : lancez une simulation. Arrêtez-la après cinq questions et demandez le débrief. Ce n'est pas confortable, et c'est exactement pour ça que ça sert.</div>",

    "<h3>4. Ce que vous ne voulez plus</h3>C'est la partie la plus utile et la plus difficile à formuler. La règle : <b>pas de reproches sur le passé, des conditions pour l'avenir</b>. Un reproche met mal à l'aise et donne à penser qu'on le fera aussi sur le prochain établissement. Une condition formulée positivement est une marque de sérieux et de connaissance du métier.<br><br>« La direction ne nous soutenait pas » devient « je veux savoir qui arbitre quand aucun remplaçant n'est trouvé ». « Je passais mes soirées sur les plannings » devient « je veux un planning outillé et des règles de remplacement écrites et validées ». « On changeait tout sans prévenir » devient « je veux être associée aux décisions qui concernent l'organisation de mon secteur ».<br><br>Faites l'exercice pour chaque chose que vous ne voulez plus revivre : une phrase, au présent, tournée vers ce que vous voulez. L'IA peut vous y aider — « reformule ceci en une condition positive pour un entretien, sans mentionner le passé » — à condition, comme toujours, de ne nommer personne.",

    "<h3>5. Le premier mois</h3>Une dernière chose, pour quand vous y serez. Les trois premières semaines, n'installez rien : regardez. Comment ils font les plannings, où sont les fichiers, ce que la direction demande et à quelle fréquence, ce qui coince. Puis proposez <b>un</b> outil, celui qui répond à un problème qu'ils ont nommé eux-mêmes — le suivi des plans d'action si la direction se plaint de ne pas avoir de visibilité, le fichier annuel de contrôles si les bilans prennent des heures. Un outil adopté vaut mieux que cinq imposés. Le reste suivra tout seul quand ils auront vu le premier marcher."
  ],

    "Apprendre : sujet précis, niveau de départ, cinq étapes avec exemples, « pose-moi une question après chaque étape et attends ma réponse », pas de jargon. Et « je n\'ai pas compris, réexplique autrement, avec une image ». Fiable sur les mécanismes, à vérifier sur les chiffres.",
    "iMovie : Nouveau projet → Film, choisir les clips, réordonner en glissant, couper aux poignées jaunes, titre avec le T, bande-son intégrée avec le +, exporter. Musique libre obligatoire si la vidéo est montrée dans l\'établissement.",
    "Votre système : six raccourcis, dossier Modèles (+ clé USB), projet d\'écriture, fichier « Mes demandes », chiffres avant/après. Transmettre : un geste, à une personne, au moment où elle en a besoin.",
    "Préparer la suite : ce que vous apportez en dix lignes ; les questions par thème (outils, organisation, cadre IA et RGPD) ; ce que vous ne voulez plus, reformulé en conditions positives ; une simulation d\'entretien. Le premier mois : regarder trois semaines, puis proposer UN outil."
  ]}
];
const MISSIONS = {
s1:{ title:"Six gestes, faits pour de vrai",
  intro:"Sur votre ordinateur : une capture d'écran collée dans un mail que vous vous envoyez ; un document enregistré en PDF ; un texte collé avec Ctrl + Maj + V ; un Ctrl + Z après une suppression ; un Ctrl + F pour trouver un mot. Sur l'iPhone : une capture. Racontez ce que vous avez fait et ce qui a résisté.",
  criteres:[
    { label:"La capture d'écran faite et collée dans un mail", test:t=>/(capture)/.test(t) && /(mail|envoy|coll)/.test(t), aide:"« Capture faite avec Windows + Maj + S, collée dans un mail que je me suis envoyé. »" },
    { label:"Le PDF créé", test:t=>/pdf/.test(t), aide:"« Enregistré en PDF depuis Word » ou « Ctrl + P → Microsoft Print to PDF »." },
    { label:"Le collage sans mise en forme testé", test:t=>/(sans mise en forme|maj ?\+? ?v|ctrl ?\+? ?maj)/.test(t), aide:"« Ctrl + Maj + V testé : le texte est arrivé propre. »" },
    { label:"Ctrl + Z et Ctrl + F essayés", test:t=>/(ctrl ?\+? ?z|annul)/.test(t) && /(ctrl ?\+? ?f|cherch|recherch)/.test(t), aide:"« Ctrl + Z a fait revenir le paragraphe. Ctrl + F a surligné le mot. »" },
    { label:"La capture sur iPhone", test:t=>/(iphone|telephone|volume|lateral)/.test(t), aide:"« Sur l'iPhone : latéral + volume haut, la capture est dans Photos. »" },
    { label:"Ce qui a résisté, honnêtement (ou « rien »)", test:t=>/(resist|difficile|pas reussi|bloqu|du mal|rien|facile|premiere fois|essai|cherche)/.test(t), aide:"« Le PDF : j'ai cherché le menu deux minutes. » Ou « rien, tout a marché »." }
  ],
  modele:"Capture faite avec Windows + Maj + S sur une page internet, collée dans un mail que je me suis envoyé : l'image est bien arrivée.\nPDF : un document Word enregistré sous → type PDF, ouvert ensuite, la mise en page est identique et on ne peut pas taper dedans.\nCtrl + Maj + V : un texte copié d'un site collé dans Word, arrivé dans ma police, sans les cadres bleus.\nCtrl + Z : j'ai supprimé un paragraphe, il est revenu. Ctrl + F : tapé « rectangle », le mot s'est surligné partout.\nSur l'iPhone : latéral + volume haut, la capture est dans Photos.\n\nCe qui a résisté : la capture, j'ai appuyé sur Windows + S au lieu de Windows + Maj + S deux fois. Maintenant c'est bon.",
  conseil:"Refaites la capture d'écran demain matin, une fois, sans regarder. Après trois jours, c'est dans les doigts." },

s2:{ title:"Un chiffre, vérifié",
  intro:"Demandez à ChatGPT un chiffre vérifiable (population d'une commune, date d'un événement, prix moyen de quelque chose). Notez sa réponse exacte. Puis vérifiez à la source. Racontez l'écart — ou l'absence d'écart. Ajoutez un chiffre qu'une IA vous avait déjà donné et que vous n'aviez pas vérifié.",
  criteres:[
    { label:"La question posée et la réponse exacte de l'IA", test:t=>/(j.ai demande|question|j.ai pose|demande a)/.test(t) && /\d/.test(t) && t.length>150, aide:"Recopiez la réponse telle qu'elle était, avec le chiffre." },
    { label:"La source de vérification, nommée", test:t=>/(insee|site|officiel|gouv|mairie|wikipedia|encyclopedie|notice|fabricant|catalogue|journal|dictionnaire)/.test(t), aide:"Où vous avez vérifié : le site de l'INSEE, celui de la ville, une notice…" },
    { label:"Le résultat de la vérification", test:t=>/(ecart|juste|exact|faux|different|correspond|pareil|proche|meme)/.test(t), aide:"« L'écart était de X » ou « c'était juste »." },
    { label:"Un chiffre pris autrefois sans vérifier", test:t=>/(je n.avais pas verifie|je l.avais pris|sans verifier|autrefois|une fois|l.autre jour|avant)/.test(t), aide:"Un chiffre d'une conversation précédente que vous aviez pris tel quel." }
  ],
  modele:"J'ai demandé : « Quelle est la population de Vienne en Isère au dernier recensement ? » Réponse : « Vienne compte environ 30 800 habitants au recensement de 2021. »\n\nVérifié sur le site de l'INSEE : le chiffre n'était pas exactement celui-là, et l'année de référence n'était pas la bonne. Pas grave dans ce cas, mais le ton était le même que si c'était juste.\n\nUn chiffre que j'avais pris sans vérifier : il y a quelques semaines, j'avais demandé des idées de sortie et on m'a donné un tarif de groupe précis pour un musée. Je l'avais noté. Je n'avais pas pensé à vérifier sur le site du musée.",
  conseil:"Ce n'est pas une question de gravité : c'est pour sentir une fois l'assurance d'un chiffre qui n'est relié à rien." },

s3:{ title:"La même demande, avant et après",
  intro:"Reprenez une question que vous avez posée récemment à ChatGPT et qui avait demandé plusieurs relances. Reformulez-la avec les quatre éléments, posez-la, et comparez. Collez la demande complète, ce qui a changé, et le nombre d'échanges.",
  criteres:[
    { label:"La demande complète avec ses quatre éléments", test:t=>/(tu es|agis|en tant que)/.test(t) && /(format|tableau|lignes|mots|liste|etapes?|idees)/.test(t) && /(n.invente|pose.moi|pas de |sans |aucun)/.test(t) && t.length>250, aide:"La demande en entier, pas un résumé. Rôle, contexte, format, contrainte." },
    { label:"Du contexte propre à votre situation", test:t=>/(ehpad|residen|equipe|agent|famille|prestataire|direction|animation|planning|excel|maison|perso)/.test(t), aide:"Ce que l'IA ne pouvait pas deviner." },
    { label:"Ce qui a changé dans la réponse", test:t=>/(chang|differ|mieux|plus (precis|utile|concret|court)|moins (generique|long)|avant|d.habitude|cette fois)/.test(t), aide:"« Avant j'obtenais… Cette fois… »" },
    { label:"Le nombre d'échanges", test:t=>/(\d+ (echange|relance|message|essai)|un seul|du premier coup|sans relance)/.test(t), aide:"« Du premier coup » ou « 2 échanges au lieu de 6 »." }
  ],
  modele:"Demande : Tu es responsable hébergement en EHPAD, habituée à organiser des animations. Contexte : je prépare la semaine du goût pour une quarantaine de résidents, dont plusieurs avec des textures modifiées, avec une équipe de service déjà chargée. Propose-moi 5 idées réalisables sans matériel particulier. Format : pour chaque idée, une ligne de description, ce qu'il faut préparer, et le temps que ça prend à l'équipe. Contrainte : rien qui suppose du personnel supplémentaire, et pose-moi la question si tu as besoin d'une information.\n\nCe qui a changé : d'habitude, « donne-moi des idées d'animation » me donnait des listes valables pour n'importe quelle maison de retraite, avec des ateliers cuisine impossibles chez nous. Là, cinq idées faisables, avec le temps pour l'équipe. La contrainte a tout changé. Elle m'a même demandé combien de personnes participaient d'habitude.\n\nÉchanges : du premier coup, plus une relance pour préciser une idée.",
  conseil:"Collez cette demande dans un fichier « Mes demandes » sur le Bureau. C'est la première de votre boîte à outils." },

s4:{ title:"Votre réglage, et vos trois couleurs",
  intro:"Désactivez « Améliorer le modèle pour tous » dans les réglages de ChatGPT. Puis écrivez vos trois listes — vert, orange, rouge — pour votre métier, avec vos vrais documents. Confirmez le réglage.",
  criteres:[
    { label:"Le réglage est confirmé", test:t=>/(desactiv|reglage|controle des donnees|ameliorer le modele|decoche)/.test(t), aide:"« Réglage désactivé. »" },
    { label:"Trois blocs identifiables", test:t=>/(vert|tel quel)/.test(t) && /(orange|anonym)/.test(t) && /(rouge|jamais)/.test(t), aide:"Vert / Orange / Rouge." },
    { label:"Les données de résidents et de salariés en rouge", test:t=>{ const r=Math.max(t.indexOf("rouge"),t.indexOf("jamais")); return r>=0 && /(residen|salarie|agent|soins|sante|chambre|netsoins|planning)/.test(t.slice(r)); }, aide:"Noms, chambres, santé, dossier de soins, planning nominatif, données de salariés : bloc rouge." },
    { label:"Au moins six documents réels à vous, répartis", test:t=>(t.match(/(plan de table|controle|linge|planning|commande|stock|famille|prestataire|animation|plans? d.action|reclamation|menu|briefing|inventaire|netsoins|octime)/g)||[]).length>=6, aide:"Vos documents : plan d'action, contrôle du linge, mail à une famille, planning, menu…" },
    { label:"Une ligne sur Copilot pro", test:t=>/copilot/.test(t), aide:"« Avec Copilot pro : le vert et l'orange, et le rouge reste rouge tant qu'il n'y a pas de règle écrite. »" }
  ],
  modele:"Réglage « Améliorer le modèle pour tous » désactivé ce soir.\n\nVert — tel quel : questions de méthode, idées d'animation, brouillons de mails sans nom, explications Excel, structure d'un compte-rendu, modèle de plan de table vide, menu de la semaine.\n\nOrange — anonymiser : mail d'une famille (« la fille d'une résidente »), situation d'équipe (« une agente de service »), réclamation, échange avec un prestataire qui cite un résident, briefing du matin.\n\nRouge — jamais : nom, prénom, chambre, pathologie, régime, dossier Netsoins, planning nominatif Octime, arrêt de travail, évaluation d'une agente, photo de résident.\n\nAvec Copilot pro au travail : le vert et l'orange peuvent y aller, les données restent dans l'établissement. Le rouge reste rouge tant qu'il n'y a pas de règle écrite qui dit le contraire — et je la demanderai à l'arrivée.",
  conseil:"Gardez cette liste dans une note sur votre téléphone. Elle servira aussi le jour où une collègue vous demandera « on a le droit ? »." },

s5:{ title:"Votre premier tableau propre",
  intro:"Construisez pour de vrai, dans Excel, le tableau que vous avez décrit : un sujet à vous (dépenses, courses, rendez-vous), colonnes claires, aucune ligne vide, mis sous forme de tableau. Décrivez ce que vous avez fait, et vérifiez l'alignement des nombres.",
  criteres:[
    { label:"Le sujet et au moins quatre colonnes", test:t=>/(depense|course|rendez|controle|commande|stock|budget|suivi)/.test(t) && (t.match(/\b[a-h] ?[:=]|colonne [a-h]/g)||[]).length>=4, aide:"« A : date, B : catégorie, C : montant, D : commentaire »." },
    { label:"Le nombre de lignes saisies", test:t=>/(\d+ lignes)/.test(t), aide:"« 18 lignes saisies. »" },
    { label:"Une ligne d'en-têtes, aucune ligne vide, rien de fusionné", test:t=>/(en.t[eê]te)/.test(t) && /(ligne vide|fusionn)/.test(t), aide:"Dites-le explicitement." },
    { label:"La vérification de l'alignement des nombres", test:t=>/(align|droite|gauche)/.test(t), aide:"« Les montants sont alignés à droite, donc reconnus comme nombres. »" },
    { label:"Mis sous forme de tableau (Insertion → Tableau)", test:t=>/(sous forme de tableau|insertion ?→? ?tableau|mettre sous forme)/.test(t), aide:"« Insertion → Tableau, coché les en-têtes : les bandes et les flèches sont apparues. »" }
  ],
  modele:"Tableau : dépenses du mois de septembre. Une ligne = une dépense.\nA : date, B : catégorie (courses, essence, santé, loisirs), C : montant (€), D : commentaire.\n22 lignes saisies. Une seule ligne d'en-têtes en ligne 1, pas de ligne vide, rien de fusionné.\n\nAlignement : les montants de la colonne C sont à droite — sauf deux que j'avais tapés avec un espace avant, ils étaient à gauche. Retapés, c'est bon.\n\nInsertion → Tableau, coché « Mon tableau comporte des en-têtes » : les bandes de couleur et les flèches de filtre sont apparues. J'ai ajouté une 23e ligne en dessous, elle s'est colorée toute seule.",
  conseil:"Gardez ce fichier : les séances 6 et 7 travaillent dessus." },

s6:{ title:"Votre première formule, contrôlée",
  intro:"Dans le tableau de la séance 5 : ajoutez un total (Alt + = ou ligne des totaux), puis une colonne calculée. Demandez la formule à l'IA si besoin. Collez la formule telle qu'elle est dans Excel, le total obtenu, et votre contrôle sur une ligne à la main.",
  criteres:[
    { label:"Une formule Excel, en français, commençant par =", test:t=>/=\s*(somme|si|moyenne|\(|\$?[a-z]\$?\d+ ?[-+*\/])/.test(t), aide:"Copiez la cellule : « =SOMME(C2:C23) » ou « =C2/$C$24 »." },
    { label:"Le total obtenu", test:t=>/(total)/.test(t) && /\d/.test(t), aide:"« Total : 612,40 €. »" },
    { label:"Une colonne calculée en plus du total", test:t=>/(colonne)/.test(t) && /(part|ecart|difference|pourcentage|%|calcul)/.test(t), aide:"Une part du total, un écart, une différence entre deux colonnes." },
    { label:"Le contrôle à la main sur une ligne", test:t=>/(main|manuel|calcul|verif|controle|calculatrice)/.test(t) && /(ok|identique|meme|juste|pareil|correspond)/.test(t), aide:"« Contrôle ligne 5 : 48,90 / 612,40 = 8 % — Excel affiche 8 % — OK. »" },
    { label:"La formule recopiée vers le bas", test:t=>/(recopi|tire|glisse|petit carre|toutes les lignes|jusqu.en bas|double.clic)/.test(t), aide:"« Recopiée en tirant le petit carré jusqu'à la ligne 23. »" }
  ],
  modele:"Total de la colonne montants avec Alt + = : =SOMME(C2:C23), total 612,40 €.\n\nColonne E « part du total » : =C2/$C$24, affichée en % avec le bouton %. Recopiée en tirant le petit carré jusqu'à la ligne 23.\n\nAu début j'avais écrit =C2/C24 sans les dollars : la première ligne était juste, les suivantes donnaient n'importe quoi. J'ai compris en relisant la séance, et la touche F4 ajoute les dollars toute seule.\n\nContrôle ligne 5 à la main : 48,90 / 612,40 = 0,0799, soit 8 % — Excel affiche 8 % — OK.",
  conseil:"Le dollar que vous venez de comprendre est le point où la plupart des gens abandonnent Excel. Vous l'avez passé." },

s7:{ title:"Filtrer et colorer",
  intro:"Toujours sur votre tableau : activez le filtre et affichez une seule catégorie, puis un filtre numérique ; ajoutez une mise en forme conditionnelle ; faites un graphique. Décrivez chaque geste et ce que vous voyez.",
  criteres:[
    { label:"Le filtre utilisé, avec le nombre de lignes restantes", test:t=>/(filtr)/.test(t) && /(\d+ lignes)/.test(t), aide:"« Coché uniquement « courses » : 9 lignes restent. »" },
    { label:"Un filtre numérique ou chronologique essayé", test:t=>/(superieur|inferieur|filtres? numerique|entre|ce mois)/.test(t), aide:"« Filtres numériques → Supérieur à 50 »." },
    { label:"Une règle de mise en forme conditionnelle avec seuil et couleur", test:t=>/(conditionnelle)/.test(t) && /(superieur|inferieur|contient|aujourd|\d+)/.test(t) && /(rouge|orange|vert|jaune)/.test(t), aide:"« Supérieur à 50 € → rouge. »" },
    { label:"Le test : une ligne ajoutée qui se colore toute seule", test:t=>/(ajout|test|nouvelle ligne|saisi)/.test(t) && /(tout de suite|toute seule|automatiquement|direct|aussitot)/.test(t), aide:"« J'ai ajouté une ligne à 62 € : rouge immédiatement. »" },
    { label:"Un graphique créé", test:t=>/(graphique)/.test(t), aide:"« Insertion → Graphiques recommandés, choisi un histogramme. »" },
    { label:"Le filtre effacé ensuite", test:t=>/(effac|reaffich|selectionner tout|enlev)/.test(t), aide:"« Données → Effacer pour tout réafficher. »" }
  ],
  modele:"Filtre : flèche sur « catégorie », coché uniquement « courses » : 9 lignes restent, les numéros de lignes sont devenus bleus. Puis Filtres numériques sur les montants → Supérieur à 50 : 4 lignes. Données → Effacer pour tout réafficher.\n\nMise en forme conditionnelle sur la colonne montants : Accueil → Mise en forme conditionnelle → Règles de mise en surbrillance → Supérieur à 50 € → rouge. Quatre cellules sont passées en rouge d'elles-mêmes. J'ai ajouté une ligne à 62 € pour tester : rouge tout de suite.\n\nGraphique : sélectionné catégorie et montant, Insertion → Graphiques recommandés, choisi l'histogramme. Je l'ai copié dans un mail avec Ctrl + C / Ctrl + V pour voir : ça marche.",
  conseil:"Transposez : sur un tableau de contrôle, « Non conforme » en rouge. Même menu, règle « Texte qui contient »." },

s8:{ title:"Vos règles de remplacement, version finale",
  intro:"Dictez vos règles dans ChatGPT en mode vocal, sans aucun nom, faites-les structurer, relisez. Ajoutez la liste des tâches reportables quand personne ne répond. Relisez le tout comme si une collègue devait l'appliquer demain sans vous.",
  criteres:[
    { label:"L'ordre de sollicitation, numéroté", test:t=>/(1\.|1\)|d.abord|en premier)/.test(t) && /(2\.|2\)|ensuite|puis)/.test(t), aide:"Un ordre clair, numéroté." },
    { label:"Des critères concrets", test:t=>/(volontaire|temps partiel|heures|interim|disponib|repos|secteur|forme|quota)/.test(t), aide:"Sur quoi vous vous basez pour choisir qui solliciter." },
    { label:"Ce qu'on ne fait jamais — au moins deux interdits", test:t=>(t.match(/(jamais|en aucun cas|interdit|ne pas)/g)||[]).length>=2, aide:"Deux interdits explicites." },
    { label:"Le cas « personne ne répond » avec les tâches reportables listées", test:t=>/(personne (ne repond|n.est disponible)|si aucun|dernier recours|a defaut)/.test(t) && /(report|differ|remis|decal)/.test(t) && (t.match(/^\s*[-•*]/gm)||[]).length>=3, aide:"« Si personne ne répond : … Tâches reportables : - … - … - … »" },
    { label:"Les tâches non reportables aussi", test:t=>/(non reportable|pas reportable|jamais report|prioritaire|critique)/.test(t), aide:"Repas, réfection des chambres occupées, circuit du linge des résidents." },
    { label:"Aucun prénom ni nom", test:t=>!/(madame [a-z]|monsieur [a-z]|mme [a-z]|mr [a-z])/.test(t), aide:"Des rôles, pas des personnes." },
    { label:"Une mention de validation ou de partage", test:t=>/(valid|direction|partag|affich|classeur|transmis|collegue)/.test(t), aide:"« À faire valider par la direction, puis dans le classeur de l'office. »" }
  ],
  modele:"Règles de remplacement — service et hébergement (à faire valider par la direction, puis dans le classeur de l'office)\n\nOrdre de sollicitation :\n1. Agents ayant déclaré vouloir des heures (liste mise à jour chaque trimestre)\n2. Temps partiels souhaitant compléter, en commençant par ceux qui ont le moins d'heures ce mois-ci\n3. Agents de l'autre secteur formés au poste\n4. Intérim, après accord de la direction\n\nCritères : ne jamais solliciter quelqu'un qui a dépassé son quota d'heures du mois, ni deux fois de suite la même personne dans la semaine.\n\nOn ne fait jamais : solliciter un agent sur son repos hebdomadaire ; laisser un étage sans agent de service ; modifier un planning affiché sans prévenir la personne directement.\n\nSi personne ne répond : prévenir la direction avant la fin de la journée. Tâches reportables au lendemain :\n- Nettoyage des parties communes non prioritaires\n- Inventaire et rangement de la lingerie\n- Contrôles non réglementaires du jour\n- Préparation des animations\nTâches non reportables : distribution des repas, réfection des chambres occupées, circuit du linge des résidents.\n\nMessages : moins de deux heures avant le service, version pressante ; sinon, version neutre.",
  conseil:"Ce document part avec vous dans le prochain poste. C'est un des premiers que vous montrerez." },

s9:{ title:"Votre premier modèle",
  intro:"Construisez, dans Excel, le fichier que vous avez décrit (plans d'action, contrôles, plan de table ou commandes), avec ses colonnes, ses couleurs automatiques et son compteur si besoin. Enregistrez-le en .xltx dans un dossier « Modèles ». Testez le double-clic.",
  criteres:[
    { label:"Le document choisi et ses colonnes", test:t=>/(plans? d.action|controle|linge|plan de table|planning|stock|commande|inventaire|temperature)/.test(t) && (t.match(/(date|secteur|etage|chambre|type|resultat|action|responsable|echeance|statut|origine|produit|quantite)/g)||[]).length>=4, aide:"Au moins quatre colonnes nommées." },
    { label:"Au moins une mise en forme conditionnelle", test:t=>/(conditionnelle|rouge|vert|orange)/.test(t), aide:"« Échéances dépassées en rouge, terminé en vert. »" },
    { label:"Une formule ou un compteur", test:t=>/(formule|compteur|total|somme|nb\.si|compte)/.test(t), aide:"« Un compteur d'actions en retard en haut. »" },
    { label:"Enregistré en .xltx dans un dossier Modèles", test:t=>/(xltx|modele excel|type modele)/.test(t) && /(dossier|modeles)/.test(t), aide:"« Enregistrer sous → Modèle Excel (.xltx), dans Documents/Modèles. »" },
    { label:"Le test du double-clic", test:t=>/(double.clic|copie neuve|nouveau fichier|classeur1|sans nom)/.test(t), aide:"« Double-clic : Excel ouvre une copie neuve, l'original est intact. »" }
  ],
  modele:"Document : suivi des plans d'action.\nColonnes : A date, B origine (audit, réclamation, incident, réunion), C action, D responsable (fonction, pas nom), E échéance, F statut (à faire / en cours / terminé), G commentaire.\n\nMise en forme conditionnelle : échéance inférieure à =AUJOURDHUI() → rouge ; statut « terminé » → vert.\nCompteur : une cellule en haut qui compte les actions en retard, avec une formule NB.SI.ENS que l'IA m'a expliquée pas à pas.\n\nEnregistré sous → Modèle Excel (.xltx) dans Documents/Modèles, et copié sur ma clé USB.\n\nTest : double-clic sur le modèle, Excel ouvre « Classeur1 » avec ma structure et rien dedans. L'original n'a pas bougé.",
  conseil:"Un modèle par semaine d'ici la reprise. Vous arriverez avec un dossier complet — séance 13." },

s10:{ title:"Le projet existe, un mail est écrit",
  intro:"Créez le projet « Mes écrits pro » dans ChatGPT avec vos instructions et trois anciens mails anonymisés. Rédigez un mail délicat (réel ou reconstitué, anonymisé) avec. Collez les instructions, le brouillon, ce que vous avez corrigé, et le temps que ça a pris.",
  criteres:[
    { label:"Les instructions réelles du projet", test:t=>/(responsable|hebergement|ehpad)/.test(t) && /(ton|vouvoie|direct|court)/.test(t) && /(jamais|n.invente|ne promet|a completer)/.test(t) && t.length>350, aide:"Le texte enregistré dans le projet, pas une description." },
    { label:"Trois exemples joints", test:t=>/(trois|3) (anciens? |vrais? )?(mails?|exemples?)/.test(t), aide:"« Trois anciens mails anonymisés joints. »" },
    { label:"Le brouillon obtenu, sans nom", test:t=>/(brouillon|objet)/.test(t) && !/(madame [a-z]{3,}|monsieur [a-z]{3,})/.test(t) && t.length>600, aide:"Le brouillon complet, avec « la fille d'une résidente » et non un nom." },
    { label:"Une correction précise sur ce qui engage", test:t=>/(corrig|supprim|enlev|modifi|remplac)/.test(t) && /(promet|delai|engage|sous 48|cette semaine|quotidien)/.test(t), aide:"« Le brouillon promettait un contrôle quotidien, supprimé. »" },
    { label:"Le temps que ça a pris", test:t=>/(\d+ ?(min|minutes?))/.test(t), aide:"« 6 minutes, relecture comprise. »" }
  ],
  modele:"Instructions du projet :\nTu m'aides à écrire mes courriers professionnels. Je suis responsable hébergement en EHPAD, j'encadre une équipe de service, lingerie et restauration. J'écris aux familles, prestataires, équipe et direction. Ton direct, chaleureux sans familiarité, vouvoiement, phrases courtes, pas de jargon. Jamais de nom de résident, de famille ou de salarié. Ne promets jamais un délai, une action ou un geste que je n'ai pas indiqués — écris [À COMPLÉTER]. 8 à 12 lignes, un objet proposé. Tu produis un brouillon, je relis et j'envoie.\nTrois anciens mails anonymisés joints comme exemples.\n\nBrouillon obtenu (réponse à la fille d'une résidente, linge mélangé) :\nObjet : Votre message concernant le linge de votre mère\nMadame,\nMerci pour votre message. Vous avez raison de nous le signaler : le linge de votre mère ne doit pas revenir mélangé, et c'est arrivé deux fois, ce qui n'est pas acceptable. J'ai transmis le problème à notre blanchisserie dès votre premier signalement et je le relance ce jour. Nous vérifions également le marquage du linge de votre mère. Je reviens vers vous [À COMPLÉTER]. N'hésitez pas à me joindre directement.\nBien cordialement,\n\nCorrection : le brouillon disait « nous mettrons en place un contrôle quotidien » — je n'ai rien décidé de tel, supprimé et remplacé par « nous vérifions le marquage ». Le [À COMPLÉTER] : rempli par « d'ici la fin de semaine ».\nTemps : 6 minutes, relecture comprise. D'habitude, 20.",
  conseil:"La correction que vous avez faite, ajoutez-la aux instructions si elle risque de revenir. Le projet s'améliore par vos règles, pas tout seul." },

s11:{ title:"Un sujet appris, une vidéo montée",
  intro:"Faites une vraie séance d'apprentissage avec l'IA sur un sujet de votre choix, en vous laissant interroger et en demandant au moins une fois de réexpliquer autrement. Puis montez une vidéo d'une minute dans iMovie avec vos propres images. Racontez les deux.",
  criteres:[
    { label:"Le sujet appris et une chose retenue", test:t=>/(sujet|appris|compris|retenu)/.test(t) && t.length>200, aide:"« Sujet : … Ce que j'ai retenu : … »" },
    { label:"Vous avez été interrogée et avez répondu", test:t=>/(question|interrog|repondu|verifi)/.test(t), aide:"« Elle m'a posé une question après chaque étape. »" },
    { label:"Vous avez demandé une réexplication", test:t=>/(reexpliqu|pas compris|autrement|image|comparaison|redemand)/.test(t), aide:"« Je n'ai pas compris l'étape 3, j'ai demandé une image : elle a comparé à… »" },
    { label:"La vidéo : ce qui a été monté", test:t=>/(imovie|video|montage)/.test(t) && /(coup|titre|musique|export|enregistr|clip|poignee)/.test(t), aide:"« 4 clips, coupés aux poignées jaunes, un titre, une bande-son, exportée. »" },
    { label:"La durée de la vidéo et le temps de montage", test:t=>(t.match(/(\d+ ?(min|minutes?|secondes?))/g)||[]).length>=2, aide:"« Vidéo d'1 min 05, montage en 40 minutes. »" }
  ],
  modele:"Sujet : comment fonctionne une pompe à chaleur, parce qu'on nous en propose une. Cinq étapes, avec l'exemple du réfrigérateur à l'envers. Elle m'a posé une question après chaque étape ; j'ai raté celle sur le fluide et j'ai demandé de réexpliquer avec une image : elle a comparé à une éponge qu'on presse dehors et qu'on relâche dedans. Là ça a marché. Retenu : ça ne crée pas de chaleur, ça la déplace.\n\nVidéo : iMovie, 5 clips du jardin et du chat, coupés aux poignées jaunes, remis dans l'ordre, un titre « Septembre », une bande-son intégrée. Vidéo d'1 min 05. Montage : 40 minutes la première fois, dont 15 à chercher comment couper — j'ai demandé à ChatGPT, il fallait toucher le clip puis tirer la poignée jaune.",
  conseil:"La deuxième vidéo prendra dix minutes. Faites-la cette semaine, avant d'oublier les gestes." },

s12:{ title:"Votre système, rangé",
  intro:"Créez le fichier « Mes demandes » sur votre ordinateur avec au moins cinq demandes qui ont marché pendant le parcours. Vérifiez que votre dossier « Modèles » existe et qu'il est copié sur clé USB. Collez le contenu du fichier, la liste de ce que vous gardez, et vos chiffres avant/après.",
  criteres:[
    { label:"Au moins cinq demandes, séparées et titrées", test:t=>(t.match(/^\s*(#+|\d+[.)]|[-•*]|[A-ZÉ][^\n]{2,40} ?:)/gm)||[]).length>=5 && t.length>800, aide:"Cinq blocs titrés : « Mail à une famille », « Formule Excel »…" },
    { label:"Chaque demande contient un rôle ou une contrainte", test:t=>(t.match(/(tu es|n.invente|pose.moi|a completer|en francais|explique|attends ma reponse)/g)||[]).length>=5, aide:"Des demandes complètes, pas des mémos." },
    { label:"La liste de ce que vous gardez", test:t=>/(je garde|ce que je garde|a garder|mes outils|mon systeme)/.test(t) && (t.match(/(raccourci|capture|projet|modele|filtre|regles?|mise en forme|fichier|cle usb)/g)||[]).length>=4, aide:"Les raccourcis, le projet, le dossier Modèles, les règles, la règle vérifiable/forme." },
    { label:"Vos chiffres avant / après", test:t=>(t.match(/(\d+ ?(min|minutes?|h|heures?))/g)||[]).length>=2 && /(avant|au lieu de|d.habitude|maintenant)/.test(t), aide:"« Un mail délicat : 20 minutes avant, 7 maintenant. »" },
    { label:"Où tout est enregistré", test:t=>/(bureau|documents|dossier|cle usb|drive)/.test(t), aide:"« Fichier sur le Bureau, dossier Modèles dans Documents + clé USB. »" }
  ],
  modele:"Fichier « Mes demandes.txt » sur le Bureau. Dossier « Modèles » dans Documents, copié sur clé USB.\n\n1. Mail à une famille : Tu es responsable hébergement en EHPAD… [contexte anonymisé]… 10 lignes, un objet, ne promets rien que je n'ai pas écrit, [À COMPLÉTER] si besoin.\n2. Formule Excel : Dans Excel en français, mon tableau a les colonnes A…, B…, C… Je veux en D… Donne-moi la formule pour D2 et explique chaque partie comme à une débutante, et comment la recopier.\n3. Construire un modèle : Propose-moi les colonnes, une ligne d'exemple fictive, les mises en forme conditionnelles utiles, et explique étape par étape en français pour Excel.\n4. Compte-rendu : Structure ce que je viens de dicter en trois blocs — décisions, actions avec qui et pour quand, points en suspens. N'ajoute rien.\n5. Apprendre : Je veux comprendre X, je pars de zéro. Cinq étapes, un exemple à chaque fois, pose-moi une question après chaque étape et attends ma réponse.\n\nCe que je garde : les six raccourcis, le projet « Mes écrits pro », le dossier Modèles (contrôles, plans d'action, plan de table), les règles de remplacement validées, et la règle : vérifiable = je vérifie, forme = je prends.\n\nChiffres : un mail délicat, 20 minutes avant, 7 maintenant. Le bilan de contrôles, 1 h avant, 10 minutes avec le filtre. Le plan de table, 20 minutes avant, 3 avec le modèle.",
  conseil:"Ce fichier grandit. Chaque demande qui marche bien y va. Dans six mois, c'est votre vraie boîte à outils." },

s13:{ title:"Vos questions, ce que vous apportez, vos conditions",
  intro:"Préparez, avec l'IA et sans rien de nominatif : vos questions pour le futur établissement classées par thème, votre texte « ce que j'apporte » relu à voix haute, et vos conditions pour l'avenir. Faites au moins une simulation d'entretien et racontez ce qu'elle vous a appris.",
  criteres:[

    { label:"Une question sur le cadre IA ou RGPD", test:t=>/(ia|copilot|rgpd|donnees|charte|consigne)/.test(t) && /\?/.test(t), aide:"« Y a-t-il une consigne écrite sur l'usage de l'IA et les données de résidents ? »" },
    { label:"Le texte « ce que j'apporte »", test:t=>/(j.apporte|ce que j.apporte|j.arrive avec)/.test(t) && /(modele|regles?|suivi|outil)/.test(t), aide:"Le texte du cas pratique, relu et ajusté." },
    { label:"Au moins deux conditions positives pour l'avenir", test:t=>(t.match(/(je (veux|souhaite|tiens a|demande)|il me faut|j.attache)/g)||[]).length>=2, aide:"« Je veux des règles de remplacement écrites et validées. » Deux minimum." },
    { label:"La simulation et ce qu'elle a appris", test:t=>/(simulation|joue|entretien simule|debrief)/.test(t) && /(appris|manque|mal repondu|convaincu|prepare)/.test(t), aide:"« La question sur le conflit d'équipe : je n'avais pas d'exemple concret prêt. »" },
    { label:"Aucun nom d'établissement ni de personne", test:t=>!/(korian|orpea|domusvi|colisee|emera|habitat et humanisme|madame [a-z]{3,}|monsieur [a-z]{3,})/.test(t), aide:"Aucun nom, ancien ou futur." }
  ],
  modele:"Questions — outils :\n- Le bouton Copilot est-il présent dans Excel, Word et Outlook, ou est-ce le chat seul ? → me dit si je peux travailler directement dans mes fichiers.\n- Les fichiers sont-ils sur OneDrive ou sur un serveur ? Puis-je installer mes modèles Excel sur le poste ?\n- Qui administre Octime et qui saisit les plannings ? Une formation Netsoins est-elle prévue à l'arrivée ?\n\nQuestions — organisation :\n- Combien de personnes à encadrer, sur quels secteurs ?\n- Qui gère les remplacements, avec quelles règles écrites ? → me dit si le sujet repose sur une seule personne.\n- Qui décide quand aucun remplaçant n'est trouvé ? Qui prend l'astreinte ?\n- Comment sont suivis les plans d'action, et par qui ?\n\nQuestions — cadre :\n- Y a-t-il une consigne écrite sur l'usage de l'IA et les données de résidents dans Copilot ? Une formation RGPD est-elle prévue ?\n\nCe que j'apporte : responsable hébergement depuis plusieurs années… j'arrive avec un suivi annuel des contrôles et des plans d'action filtrable, des modèles de plans de table, et des règles de remplacement écrites que l'équipe peut appliquer en mon absence. Un suivi lisible dès le premier mois, de la visibilité pour la direction, une organisation qui ne repose pas sur une seule personne.\n\nConditions : je veux des règles de remplacement écrites et validées par la direction. Je veux être associée aux décisions qui concernent l'organisation de mon secteur.\n\nSimulation : faite deux fois. La deuxième, on m'a demandé comment je gère un conflit dans l'équipe ; j'avais une réponse de principe mais pas d'exemple concret prêt. Je l'ai préparé depuis.",
  conseil:"Lisez « ce que j'apporte » à voix haute la veille. Puis fermez l'app : vous êtes prête." }
